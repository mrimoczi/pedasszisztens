 közlések illemtana:** megszólítás, udvarias, hivatalos hangnem, tömör, pontos, helyesírási hibáktól mentes szöveg, dátum, aláírás; az e-mailnél tárgy megadása. Írásban különösen fontos az adatvédelem és a tárgyilagosság. A pedagógiai asszisztens írásbeli közléseit a pedagógussal egyezteti."}]}, {"h": "Titoktartás a pedagógiai asszisztens munkájában", "blocks": [{"t": "p", "text": "A pedagógiai asszisztenst – a köznevelési törvény alapján – **titoktartási kötelezettség** terheli a gyermekkel, a tanulóval és a családjával kapcsolatban a munkája során tudomására jutott minden olyan információ tekintetében, amely a gyermek, a család személyes adataira, egészségi állapotára, családi körülményeire, magánéletére vonatkozik. Ez a kötelezettség a munkaviszony megszűnése után is fennáll. Be kell tartani az adatvédelmi szabályokat (GDPR) – például fotók, videók közzététele, dokumentumok kezelése. A titoktartás alól kivétel a gyermek veszélyeztetettségének jelzése: ilyenkor jelzési kötelezettség áll fenn, ami a gyermek érdekét szolgálja. A szakmai megbeszéléseken az információ megosztható, de csak az érintett kollégákkal és a szükséges mértékben."}]}], "outline": ["Kommunikáció (communicare: közössé tenni): információcsere jelek segítségével.", "Tényezők: adó, vevő, üzenet, kód, csatorna, kontextus, zaj, visszajelzés.", "Típusok: intraperszonális, interperszonális, csoport-, tömegkommunikáció; egy- és kétirányú; közvetlen és közvetett; verbális és nonverbális.", "Nonverbális csatornák: vokális jelek, mimika, tekintet, gesztus, testtartás, térköz, érintés, külső megjelenés.", "Technikák: aktív hallgatás, én-üzenet, nyitott kérdés, tükrözés, összefoglalás, asszertivitás.", "Asszisztens: udvarias, közérthető, empatikus, életkorhoz igazodó; ápolt, egyszerű megjelenés.", "Illemtan: szóbeli, telefonos, írásbeli közlés; titoktartás."], "cards": [{"q": "Honnan ered a kommunikáció szó?", "a": "A latin „communicare” – közössé tenni, közölni."}, {"q": "Melyek a kommunikáció tényezői?", "a": "Adó, vevő, üzenet, kód, csatorna, kontextus, zaj, visszajelzés."}, {"q": "Soroljon fel nonverbális csatornákat!", "a": "Vokális jelek, mimika, tekintet, gesztus, testtartás, térköz, érintés, külső megjelenés."}, {"q": "Mekkora a személyes távolság Hall szerint?", "a": "45–120 cm."}, {"q": "Mi a metakommunikáció?", "a": "Az üzenet értelmezését segítő nonverbális kísérőjelzés – „kommunikáció a kommunikációról”."}, {"q": "Mi az én-üzenet?", "a": "A saját érzés kifejezése vádaskodás nélkül (Thomas Gordon)."}, {"q": "Meddig tart a titoktartási kötelezettség?", "a": "A munkaviszony megszűnése után is fennáll."}], "cim": "A kommunikáció", "temakor": "Kommunikáció és viselkedéskultúra", "kerdes": "Ismertesse a kommunikáció fogalmát, típusait, tényezőit, csatornáit! Mutassa be a verbális és nonverbális kommunikációt, valamint a pedagógiai asszisztenstől elvárt kommunikáció jellemzőit!", "kulcsszavak": ["A kommunikáció fogalma, típusai, tényezői, csatornái", "A verbális kommunikáció", "A nonverbális kommunikáció", "Kommunikációs technikák", "A külső megjelenés mint metakommunikáció", "A pedagógiai asszisztens megjelenése", "A kapcsolatteremtés szabályai a szülőkkel", "A szóbeli közlések, a telefonálás és az írásbeli közlések illemtana", "Titoktartás a pedagógiai asszisztens munkájában"]}, {"n": 22, "sections": [{"h": "Az egészség fogalma", "blocks": [{"t": "p", "text": "Az Egészségügyi Világszervezet (WHO) 1948-as meghatározása szerint az egészség **„a teljes testi, lelki és szociális jólét állapota, és nem csupán a betegség vagy fogyatékosság hiánya”.** Az egészség tehát többdimenziós:"}, {"t": "ul", "items": ["**testi egészség:** a szervezet zavartalan működése;", "**lelki (mentális) egészség:** a kiegyensúlyozottság, az érzelmi stabilitás, a stressz kezelésének képessége;", "**szociális egészség:** a jó kapcsolatok, a közösségbe való beilleszkedés;", "egyes megközelítések szerint **spirituális egészség** is: az élet értelmének érzése."]}, {"t": "p", "text": "Az egészség dinamikus állapot, amelyet folyamatosan fenn kell tartani, és amelyet az életmód, a környezet, az öröklött adottságok és az egészségügyi ellátás együttesen befolyásolnak. Az életmód hatása a legnagyobb."}]}, {"h": "Az egészség megközelítése a nevelés oldaláról", "blocks": [{"t": "p", "text": "A nevelés szempontjából az egészség **érték és erőforrás,** amelyet meg kell becsülni, és amelynek megőrzése tanulható. Az egészséges életmód nem velünk született: ismereteken, attitűdökön és szokásokon alapul, amelyeket a gyermek a családban és az intézményekben sajátít el. A gyermekkor a szokások kialakulásának legfontosabb időszaka, ezért az egészségnevelést a lehető legkorábban kell kezdeni. A nevelés célja az **egészségtudatos, felelős magatartás** kialakítása: a gyermek értse, értékelje és saját döntéseiben vegye figyelembe az egészségét."}]}, {"h": "Az egészségnevelés fogalma, célja, feladata", "blocks": [{"t": "p", "text": "Az egészségnevelés olyan tudatos, tervszerű pedagógiai tevékenység, amelynek célja, hogy az egyének és közösségek ismereteket, készségeket, attitűdöket és szokásokat sajátítsanak el egészségük megőrzése és fejlesztése érdekében. Az egészségnevelés tágabb kerete az **egészségfejlesztés,** amelynek fogalmát az **Ottawai Charta (1986)** fogalmazta meg: az a folyamat, amely képessé teszi az embereket arra, hogy növeljék az egészségük feletti kontrollt, és javítsák azt."}, {"t": "p", "text": "**Célja:** az egészséges életmód kialakítása, az egészségkárosító magatartások megelőzése, az egészségtudatos személyiség formálása."}, {"t": "p", "text": "**Feladatai, területei:**"}, {"t": "ul", "items": ["**egészséges táplálkozás:** rendszeres, változatos étkezés, zöldség, gyümölcs, elegendő folyadék, a cukor és só mérséklése;", "**mindennapos testmozgás,** a tartáshibák megelőzése;", "**személyi higiénia:** tisztálkodás, kézmosás, fogápolás, öltözködés;", "**lelki egészség védelme:** stresszkezelés, érzelmi biztonság, önismeret, konfliktuskezelés;", "**a szenvedélybetegségek megelőzése:** dohányzás, alkohol, drog, digitális függőség;", "**baleset-megelőzés, elsősegélynyújtás, közlekedésbiztonság;**", "**környezeti nevelés,** egészséges környezet;", "**családi életre és szexuális egészségre nevelés** (életkornak megfelelően);", "**a betegségek megelőzése:** védőoltások, szűrővizsgálatok, a fertőzések megelőzése;", "**a bántalmazás és az erőszak megelőzése.**"]}, {"t": "p", "text": "A köznevelési jogszabályok előírják a **mindennapos testnevelést** és a **teljes körű iskolai egészségfejlesztést,** amelynek elemei: az egészséges táplálkozás, a mindennapos testmozgás, a testi-lelki egészség fejlesztése, a bántalmazás és erőszak megelőzése, valamint a személyi higiénia."}]}, {"h": "Az egészségnevelés kapcsolata a neveléssel", "blocks": [{"t": "p", "text": "Az egészségnevelés a nevelés szerves része, és szoros kapcsolatban áll a nevelés más területeivel: az erkölcsi neveléssel (felelősség önmagunkért és másokért), az értelmi neveléssel (ismeretek), az érzelmi neveléssel (lelki egészség), a testi neveléssel (mozgás), a környezeti neveléssel és a közösségi neveléssel. Minden nevelési helyzet egyben egészségnevelési helyzet is lehet (például az étkezés, a kézmosás, a szabadidő eltöltése)."}]}, {"h": "Az egészségnevelés folyamata", "blocks": [{"t": "p", "text": "Az egészségnevelés lépései:"}, {"t": "ol", "items": ["**ismeretek nyújtása:** mi egészséges és miért;", "**attitűdök formálása:** az egészség értékként való elfogadása, a motiváció kialakítása;", "**készségek, szokások kialakítása:** a helyes viselkedés gyakorlása, ismétlése;", "**az életmód részévé válás:** a szokások automatikussá és önkéntessé válnak."]}, {"t": "p", "text": "A folyamat sikerének feltétele a **személyes példa,** az **életkornak megfelelő** módszerek (játék, mese, tevékenykedtetés), a **következetesség,** valamint a család és az intézmény **összhangja.**"}]}, {"h": "A család és az egészségnevelés kapcsolata", "blocks": [{"t": "p", "text": "A család az egészségnevelés első és legfontosabb színtere: itt alakulnak ki az étkezési, tisztálkodási, alvási, mozgási szokások, és a gyermek itt látja az első mintát (a szülők dohányzása, táplálkozása, mozgása, stresszkezelése). A család egészségkultúráját befolyásolja az iskolázottság, az anyagi helyzet, a hagyományok és az értékrend. A kedvezőtlen családi minta (például dohányzás, egészségtelen táplálkozás, mozgáshiány) a gyermek egészségét is veszélyezteti."}]}, {"h": "A család és az intézmény együttműködése", "blocks": [{"t": "p", "text": "Az óvoda és az iskola kiegészíti, szükség esetén kompenzálja a családi egészségnevelést. Az együttműködés formái:"}, {"t": "ul", "items": ["**kölcsönös tájékoztatás** a gyermek egészségi állapotáról, allergiájáról, gyógyszereiről, étkezési sajátosságairól;", "**egységes szokásrend** kialakítása (napirend, kézmosás, fogmosás, pihenés);", "**szülői értekezletek, előadások** egészségnevelési témákban (táplálkozás, alvás, képernyőhasználat);", "**közös programok:** egészségnap, sportnap, családi kirándulás, egészséges ételek kóstolója;", "**az egészségügyi szűrések, védőoltások** szervezésében való együttműködés;", "**tanácsadás,** a szakemberekhez való irányítás;", "a beteg gyermek esetén az intézményi szabályok közös betartása (lázas gyermek nem lehet közösségben)."]}]}, {"h": "A prevenció kérdése", "blocks": [{"t": "p", "text": "A prevenció (megelőzés) az egészségnevelés központi eleme. Szintjei:"}, {"t": "ul", "items": ["**elsődleges (primer) prevenció:** a betegség, a káros szokás kialakulásának megelőzése az egészséges életmóddal, felvilágosítással, védőoltással (például dohányzás-megelőzési program);", "**másodlagos (szekunder) prevenció:** a betegség, probléma korai felismerése és időben történő kezelése (szűrővizsgálatok, a figyelmeztető jelek észlelése);", "**harmadlagos (tercier) prevenció:** a már kialakult betegség szövődményeinek, visszaesésének megelőzése, rehabilitáció."]}, {"t": "p", "text": "A gyermekkorban az elsődleges prevenció a legfontosabb és a leghatékonyabb."}]}, {"h": "A szakemberek köre", "blocks": [{"t": "p", "text": "Védőnő, házi gyermekorvos, iskolaorvos, fogorvos, gyógytestnevelő, dietetikus, iskolapszichológus, mentálhigiénés szakember, egészségfejlesztő, gyógypedagógus, logopédus, a pedagógiai szakszolgálat munkatársai, a család- és gyermekjóléti szolgálat, a rendőrség bűnmegelőzési előadói, a népegészségügyi hatóság. A pedagógiai asszisztens a pedagógus irányításával, ezekkel a szakemberekkel együttműködve végzi egészségnevelő tevékenységét, és a mindennapi gondozási helyzetekben személyes példát mutat."}]}], "outline": ["Egészség (WHO, 1948): a teljes testi, lelki és szociális jólét állapota, nem csupán a betegség hiánya.", "Nevelési megközelítés: az egészség érték, amelyet tanulni és gyakorolni kell; életmód, szokások.", "Egészségnevelés: tervszerű tevékenység az egészséges életmód kialakítására; az egészségfejlesztés (Ottawai Charta, 1986) része.", "Cél: egészségtudatos magatartás; feladatok: táplálkozás, mozgás, higiénia, lelki egészség, szenvedélybetegség-megelőzés, balesetmegelőzés, szexuális nevelés.", "Folyamat: ismeret → attitűd → szokás → életmód.", "Család: elsődleges minta; intézmény: kiegészít, kompenzál; együttműködés.", "Prevenció: elsődleges, másodlagos, harmadlagos.", "Szakemberek: védőnő, iskolaorvos, fogorvos, gyógytestnevelő, pszichológus, dietetikus."], "cards": [{"q": "Hogyan határozza meg a WHO az egészséget?", "a": "A teljes testi, lelki és szociális jólét állapota, nem csupán a betegség hiánya (1948)."}, {"q": "Mi az Ottawai Charta?", "a": "Az egészségfejlesztés alapdokumentuma (1986): az emberek képessé tétele egészségük feletti kontroll növelésére."}, {"q": "Mi az egészségnevelés célja?", "a": "Az egészséges életmód és az egészségtudatos magatartás kialakítása."}, {"q": "Melyek az egészségnevelés folyamatának lépései?", "a": "Ismeret → attitűd → szokás → életmód."}, {"q": "Mi a primer prevenció?", "a": "A betegség, káros szokás kialakulásának megelőzése (egészséges életmód, felvilágosítás, védőoltás)."}, {"q": "Mi a szekunder prevenció?", "a": "A betegség korai felismerése és kezelése (szűrés)."}], "cim": "Egészség és egészségnevelés", "temakor": "Gondozás és egészségnevelés", "kerdes": "Határozza meg az egészség, egészségnevelés fogalmát, valamint az egészségnevelés célját, feladatát és a neveléshez fűződő kapcsolatát! Értelmezze a család, az óvoda és az iskola együttműködésén alapuló egészségnevelői feladatokat!", "kulcsszavak": ["Az egészség fogalma", "Az egészség megközelítése a nevelés oldaláról", "Az egészségnevelés fogalma, célja, feladata", "Az egészségnevelés folyamata", "A család és az egészségnevelés kapcsolata", "A család és az intézmény együttműködése", "A prevenció kérdése", "A szakemberek köre"]}, {"n": 23, "sections": [{"h": "A személyi gondozás fogalma", "blocks": [{"t": "p", "text": "A személyi gondozás a gyermek testi szükségleteinek kielégítésére, testi épségének, egészségének megóvására, jó közérzetének biztosítására irányuló tevékenység. A gondozás során a felnőtt segíti, vagy – kisebb gyermekeknél, illetve SNI-s gyermekeknél – elvégzi azokat a teendőket, amelyekre a gyermek még nem képes önállóan, miközben fokozatosan fejleszti önállóságát. A pedagógiai asszisztens a pedagógus irányításával, az intézmény szabályai szerint végzi a gondozási feladatokat."}]}, {"h": "A személyi gondozás területei", "blocks": [{"t": "ul", "items": ["**Tisztálkodás:** kézmosás, arcmosás, fogmosás, fésülködés, orrfújás, szükség esetén zuhanyozás, a bőr ápolása.", "**Öltözködés:** az időjárásnak és a tevékenységnek megfelelő öltözék; segítés a le- és felöltözésben, a ruhák rendben tartása; tornaruha, váltóruha.", "**Étkezés:** az étkezés előkészítése (kézmosás, terítés), a kulturált étkezés segítése, az evőeszközök használatának tanítása, a folyadékpótlás; a diétás, allergiás gyermekek étkezésének figyelemmel kísérése.", "**Pihenés, alvás:** a délutáni pihenés (óvodában, napköziben), a nyugodt környezet biztosítása, a fáradtság jeleinek figyelése.", "**Szobatisztaság, WC-használat:** segítés a WC használatában, a toalett higiéniájának betartatása, „baleset” esetén tapintatos ellátás, átöltöztetés.", "**Mozgás, levegőzés:** mindennapos mozgás, friss levegőn tartózkodás.", "**A beteg, rosszul lévő gyermek ellátása:** a betegség jeleinek felismerése (láz, sápadtság, hányás, kiütés), a gyermek elkülönítése, a pedagógus és a szülő értesítése, szükség esetén elsősegélynyújtás.", "**Testi épség, biztonság:** a balesetek megelőzése, felügyelet."]}]}, {"h": "A gondozás szerepe a nevelési folyamatban", "blocks": [{"t": "p", "text": "A gondozás nem pusztán „ellátás”, hanem a nevelés szerves része, különösen kisgyermekkorban. A gondozási helyzetekben:"}, {"t": "ul", "items": ["kialakul a **szoros, bizalmas kapcsolat** a gyermek és a felnőtt között, ami érzelmi biztonságot ad;", "a gyermek **önállósága fejlődik** – fokozatosan megtanulja ellátni magát;", "**szokások alakulnak ki,** amelyek az egész életre meghatározzák az egészségmagatartást;", "fejlődik a **beszéd,** a **finommotorika** (gombolás, cipőfűzés, evőeszköz használata), a **testséma,** a **téri tájékozódás;**", "a gyermek megtanul **figyelni a saját testére,** szükségleteire;", "fejlődik az **együttműködés, a mások iránti figyelem** (naposi teendők, segítés a társaknak);", "a gondozási helyzetekben a gyermek **önbecsülése** is formálódik: az elfogadó, kedves gondozás az önértékelést erősíti."]}]}, {"h": "A higiénés szokások kialakításának területei", "blocks": [{"t": "p", "text": "A higiénés szokások a gyermek egészségének megőrzését szolgáló, rendszeres ismétléssel automatikussá váló cselekvések. Kialakításuk lépései: **bemutatás → közös gyakorlás → segítés → ellenőrzés → önálló végzés.** Fontos a következetesség, a dicséret, a személyes példa és a játékosság (mondókák, dalok, képi segítség)."}, {"t": "ul", "items": ["**Kézmosás:** étkezés előtt, WC-használat után, játék, udvari tevékenység után, köhögés, tüsszentés után – helyes technikával (szappan, alapos dörzsölés, öblítés, törlés saját törölközővel vagy papírtörlővel).", "**Fogápolás:** étkezés utáni fogmosás, a helyes technika, saját fogkefe és pohár.", "**Orr- és köhögési higiénia:** papír zsebkendő használata, eldobása, köhögéskor a könyökhajlat használata.", "**Toaletthigiénia:** helyes WC-használat, öblítés, kézmosás.", "**Testápolás, hajápolás:** fésülködés, körömápolás, a fejtetvesség megelőzése és felismerése.", "**Öltözködés:** tiszta ruha, váltócipő, a ruhák rendben tartása.", "**Étkezési kultúra:** kulturált étkezés, tisztaság az asztalnál.", "**A környezet tisztasága:** rendrakás, a játékok tisztán tartása, szellőztetés.", "**Személyes tárgyak használata:** saját törölköző, fésű, pohár, fogkefe – a fertőzések megelőzése."]}]}, {"h": "Az integráltan nevelt SNI-s gyermek személyi gondozásának kérdései", "blocks": [{"t": "p", "text": "Az SNI-s gyermek gondozása a fogyatékosság típusához, súlyosságához és a gyermek egyéni szükségleteihez igazodik. Alapelvek:"}, {"t": "ul", "items": ["**egyéni szükségletek ismerete:** a szakértői vélemény, a gyógypedagógus és a szülő tájékoztatása alapján;", "**az önállóság maximális támogatása:** annyi segítség, amennyi szükséges, és annyi önállóság, amennyi lehetséges;", "**a méltóság és az intimitás tiszteletben tartása:** a gondozás (például pelenkázás, WC-használat) diszkréten, a többi gyermektől elkülönítve történjen;", "**állandóság, kiszámíthatóság:** állandó napirend, lehetőleg állandó gondozó;", "**együttműködés** a gyógypedagógussal, a konduktorral, a gyógytornásszal, a szülőkkel."]}, {"t": "p", "text": "**Fogyatékossági típusok szerinti teendők:**"}, {"t": "ul", "items": ["**Mozgáskorlátozott gyermek:** segítés a helyváltoztatásban, a segédeszközök (kerekesszék, járókeret, ortézis) használatában; helyes emelési, mozgatási technikák; akadálymentes környezet; segítés az öltözködésben, étkezésben (speciális evőeszközök), a WC-használatban.", "**Látássérült gyermek:** a tárgyak állandó helyen tartása, a környezet bemutatása (szóbeli leírás, tapintás), a balesetveszélyes helyzetek megszüntetése, megfelelő megvilágítás; a szemüveg tisztán tartása.", "**Hallássérült gyermek:** a hallókészülék, cochleáris implantátum gondozása, ellenőrzése; szemkontaktus, jól látható arc és szájmozgás a kommunikáció során; vizuális jelzések.", "**Értelmi fogyatékos gyermek:** a gondozási teendők apró lépésekre bontása, sok ismétlés, képi segítség, türelmes, egyszerű utasítások; a szokások kialakítása hosszabb időt igényel.", "**Autizmus spektrumzavarral élő gyermek:** strukturált, kiszámítható környezet, képes napirend, a változások előre jelzése; az érzékszervi túlérzékenység figyelembevétele (zaj, érintés, ételek textúrája); a rutinok tiszteletben tartása.", "**Beszédfogyatékos gyermek:** türelmes meghallgatás, alternatív kommunikációs eszközök (képkártyák) használata."]}, {"t": "p", "text": "A gyógyszerek beadása csak az intézmény szabályai szerint, a szülő és az orvos írásos rendelkezése alapján, a pedagógus tudtával történhet."}]}, {"h": "A gondozási folyamat során elvárt magatartás, kommunikáció", "blocks": [{"t": "ul", "items": ["**türelem, nyugalom, kedvesség:** a gondozás nem lehet kapkodó, kioktató;", "**tapintat, a szeméremérzet tiszteletben tartása,** különösen a nagyobb gyermekeknél;", "**empátia, elfogadás:** a gyermek ne érezze tehernek magát, ne szégyenítsük meg (például bepisilés esetén);", "**a gyermek bevonása:** a teendők elmondása, előkészítése („Most segítek felvenni a pulóvert.”);", "**dicséret, bátorítás** az önálló próbálkozásokért;", "**következetesség, egységes elvárások** a pedagógussal és a szülővel;", "**személyes példa:** az asszisztens saját higiéniája, ápoltsága, kulturált viselkedése;", "**nyugodt, érthető kommunikáció,** a gyermek életkorához és állapotához igazítva; nonverbális jelzések (mosoly, simogatás) tapintattal;", "**titoktartás** a gyermek egészségi állapotával, családi körülményeivel kapcsolatban;", "**a megfigyelések jelzése:** a gyermek állapotában tapasztalt változásokat (sérülés, elhanyagoltság, rosszullét) jelezze a pedagógusnak."]}]}], "outline": ["Személyi gondozás: a gyermek testi szükségleteinek kielégítése, testi épségének és egészségének védelme.", "Területei: tisztálkodás, öltözködés, étkezés, pihenés-alvás, szobatisztaság és WC-használat, mozgás, a beteg gyermek ellátása, biztonság.", "Gondozás és nevelés: a gondozás nevelő hatású – önállóság, szokások, kapcsolat, érzelmi biztonság.", "Higiénés szokások: kézmosás, fogmosás, orrfújás, WC-használat, öltözködés, környezet rendje, étkezési kultúra.", "SNI: egyéni szükségletek, segédeszközök, önállóság maximális támogatása, méltóság, intimitás, szakemberekkel együttműködés.", "Elvárt magatartás: türelem, tapintat, empátia, nyugodt, kedves kommunikáció, következetesség, a gyermek bevonása."], "cards": [{"q": "Mi a személyi gondozás?", "a": "A gyermek testi szükségleteinek kielégítése, testi épségének, egészségének és jó közérzetének biztosítása."}, {"q": "Soroljon fel gondozási területeket!", "a": "Tisztálkodás, öltözködés, étkezés, pihenés-alvás, WC-használat, mozgás, a beteg gyermek ellátása, biztonság."}, {"q": "Miért nevelő hatású a gondozás?", "a": "Érzelmi biztonságot ad, fejleszti az önállóságot, szokásokat alakít, fejleszti a finommotorikát és a beszédet."}, {"q": "Melyek a szokásalakítás lépései?", "a": "Bemutatás, közös gyakorlás, segítés, ellenőrzés, önálló végzés."}, {"q": "Mi az SNI-s gyermek gondozásának alapelve?", "a": "Annyi segítség, amennyi szükséges, annyi önállóság, amennyi lehetséges – a méltóság és az intimitás tiszteletben tartásával."}, {"q": "Mire figyeljünk autizmussal élő gyermek gondozásánál?", "a": "Strukturált, kiszámítható környezet, képes napirend, a változások előre jelzése, az érzékszervi túlérzékenység figyelembevétele."}], "cim": "Személyi gondozás és higiénés szokások", "temakor": "Gondozás és egészségnevelés", "kerdes": "Mutassa be a pedagógiai asszisztens feladatait a gyermek, tanuló személyi gondozása, a higiénés szokások kialakítása terén! Térjen ki az integráltan nevelt, sajátos nevelési igényű gyermek személyi gondozásának kérdéseire!", "kulcsszavak": ["A személyi gondozás fogalma", "A személyi gondozás területei", "A gondozás szerepe a nevelési folyamatban", "A higiénés szokások kialakításának területei", "Az integráltan nevelt SNI-s gyermek személyi gondozásának kérdései", "A gondozási folyamat során elvárt magatartás, kommunikáció"]}]</script>
<script>
const T = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('pat:'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem('pat:'+k, JSON.stringify(v)); }catch(e){} }
};
let cur = Math.min(Math.max(store.get('cur',0),0),T.length-1);
let view = store.get('view','olvas'); if(!['olvas','roviden','kartya'].includes(view)) view='roviden';
let status = store.get('status',{});
let cardIdx = 0, cardBack = false;
const W = JSON.parse(document.getElementById('written').textContent);
let mode = store.get('mode','szobeli')==='irasbeli' ? 'irasbeli' : 'szobeli';
let wCur = Math.min(Math.max(store.get('wCur',0),0),W.length-1);
let wStatus = store.get('wStatus',{});
let wView = store.get('wView','olvas')==='roviden' ? 'roviden' : 'olvas';
const isW = () => mode==='irasbeli';
const wTotal = W.reduce((n,w)=>n+w.q.length,0);

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const plain = s => s.replace(/\*\*/g,'');

/* ---------- sidebar ---------- */
function setProgress(ok,w,total){
  $('#pbar').innerHTML = `<i style="width:${ok/total*100}%;background:var(--ok)"></i><i style="width:${w/total*100}%;background:var(--warn)"></i>`;
  $('#ptxt').textContent = `${ok}/${total} megy`;
}
function renderWList(){
  const count = (i,s) => W[i].q.filter((_,j)=>wStatus[i+'-'+j]===s).length;
  $('#tlist').innerHTML = `<div class="grp">Témakörök</div><ul class="tlist">${W.map((w,i)=>{
    const ok=count(i,'ok'), done=ok===w.q.length;
    return `<li><button type="button" data-i="${i}" aria-current="${i===wCur}"><span class="num">${ok}/${w.q.length}</span><span>${esc(w.name)}</span><span class="dot ${done?'ok':ok||count(i,'warn')?'warn':''}"></span></button></li>`;}).join('')}</ul>`;
  $('#mSel').innerHTML = W.map((w,i)=>`<option value="${i}" ${i===wCur?'selected':''}>${esc(w.name)} (${count(i,'ok')}/${w.q.length})</option>`).join('');
  const vals=Object.values(wStatus);
  setProgress(vals.filter(v=>v==='ok').length, vals.filter(v=>v==='warn').length, wTotal);
}
function renderList(){
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode));
  $('#brandSub').textContent = isW() ? `Központi írásbeli · ${W.length} témakör · ${wTotal} kérdés` : 'Szóbeli képesítő vizsga · Szakmai elmélet · 23 tétel';
  $('#drawBtn').hidden = $('#drawBtn2').hidden = isW();
  $('#mSel').setAttribute('aria-label', isW() ? 'Témakör kiválasztása' : 'Tétel kiválasztása');
  if(isW()){ renderWList(); return; }
  const groups = [];
  T.forEach((t,i)=>{ let g = groups.find(g=>g.name===t.temakor); if(!g){g={name:t.temakor,items:[]};groups.push(g);} g.items.push(i); });
  $('#tlist').innerHTML = groups.map(g=>`<div class="grp">${esc(g.name)}</div><ul class="tlist">${g.items.map(i=>{
    const st = status[i]; return `<li><button type="button" data-i="${i}" aria-current="${i===cur}"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${esc(T[i].cim)}</span><span class="dot ${st==='ok'?'ok':st==='warn'?'warn':''}"></span></button></li>`;}).join('')}</ul>`).join('');
  $('#mSel').innerHTML = T.map((t,i)=>`<option value="${i}" ${i===cur?'selected':''}>${i+1}. ${esc(t.cim)}${status[i]==='ok'?' ✓':''}</option>`).join('');
  const ok = Object.values(status).filter(v=>v==='ok').length, w = Object.values(status).filter(v=>v==='warn').length;
  setProgress(ok,w,T.length);
}
$('#tlist').addEventListener('click', e=>{ const b=e.target.closest('button[data-i]'); if(b) go(+b.dataset.i); });
$('#mSel').addEventListener('change', e=>go(+e.target.value));

function go(i){
  stopReading();
  if(isW()){ wCur=i; qi=0; store.set('wCur',wCur); }
  else { cur=i; cardIdx=0; cardBack=false; store.set('cur',cur); }
  render(); window.scrollTo({top:0});
}
function setMode(m){
  if(m===mode) return;
  stopReading(); mode=m; qi=0; store.set('mode',mode);
  $('#nowS').textContent = 'Kattints egy bekezdésre, vagy indítsd a lejátszást.';
  noticeUpdate(); render(); window.scrollTo({top:0});
}
document.addEventListener('click',e=>{ const b=e.target.closest('.modes button'); if(b) setMode(b.dataset.m); });

/* ---------- main ---------- */
const blocksHtml = bl => bl.map(b=>{
  if(b.t==='p') return `<p class="rd">${fmt(b.text)}</p>`;
  const tag = b.t; return `<${tag}>${b.items.map(it=>`<li class="rd">${fmt(it)}</li>`).join('')}</${tag}>`;
}).join('');
function wDot(id){ const st=wStatus[id]; return st==='ok'?'ok':st==='warn'?'warn':''; }
function renderWritten(){
  const w = W[wCur];
  $('#slip').innerHTML = `<div class="eyebrow"><span>Központi írásbeli</span><span>${w.q.length} kérdés</span></div>
    <h2 class="rd">${esc(w.name)}</h2>
    <p class="q">Gondold végig a választ, aztán nyisd ki a kérdést.</p>
    <div class="status"><button type="button" id="wAll">Mindet kinyitom</button></div>`;
  $('#pane').innerHTML = `<div class="wlist">${w.q.map((q,j)=>{ const id=wCur+'-'+j; return `<details class="wq" data-id="${id}">
    <summary><span class="num">${j+1}.</span><span class="rd">${esc(q.q)}</span><span class="dot ${wDot(id)}"></span></summary>
    <div class="doc">${q.alt.map(a=>`<p class="walt">Így is kérdezhetik: ${esc(a)}</p>`).join('')}${blocksHtml(wView==='roviden'?q.short:q.blocks)}${q.note&&wView==='olvas'?`<p class="wnote"><strong>Javítva:</strong> ${esc(q.note)}</p>`:''}
    <div class="status" role="group" aria-label="Hol tartok ezzel a kérdéssel?">
      <button type="button" class="s-warn" data-ws="warn" aria-pressed="${wStatus[id]==='warn'}">Még gyakorolom</button>
      <button type="button" class="s-ok" data-ws="ok" aria-pressed="${wStatus[id]==='ok'}">Megy</button>
    </div></div></details>`;}).join('')}</div>`;
  /* a felvételben minden .rd elem egy szakasz; a becsukott válaszokat a lejátszás átugorja */
  document.querySelectorAll('#slip .rd, #pane .rd').forEach((el,i)=>{ el.dataset.seg=i; });
  readerTitle();
}
const wSyncAll = () => { const b=$('#wAll'); if(b) b.textContent = [...document.querySelectorAll('.wq')].every(d=>d.open) ? 'Mindet becsukom' : 'Mindet kinyitom'; };
$('#pane').addEventListener('click',e=>{
  const sb=e.target.closest('button[data-ws]');
  if(sb){
    const d=sb.closest('.wq'), id=d.dataset.id, s=sb.dataset.ws;
    if(wStatus[id]===s) delete wStatus[id]; else wStatus[id]=s;
    store.set('wStatus',wStatus);
    d.querySelectorAll('button[data-ws]').forEach(x=>x.setAttribute('aria-pressed',wStatus[id]===x.dataset.ws));
    d.querySelector('summary .dot').className=`dot ${wDot(id)}`;
    renderList(); return;
  }
  const sum=e.target.closest('.wq summary');
  if(sum){ if(playing) stopReading(); setTimeout(()=>{ wSyncAll(); buildQueue(); qi=Math.max(0,queue.indexOf(sum.querySelector('.rd'))); },0); }
});
function render(){
  $('#kw').hidden = $('#tab-kartya').hidden = isW();
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.v===(isW()?wView:view)));
  if(isW()){ $('#kw').innerHTML=''; renderList(); renderWritten(); return; }
  const t = T[cur];
  renderList();
  $('#slip').innerHTML = `<div class="eyebrow"><span><b>${t.n}.</b> húzótétel</span><span>${esc(t.temakor)}</span></div>
    <h2 class="rd" data-r="title">${esc(t.cim)}</h2>
    <p class="q rd" data-r="q">${esc(t.kerdes)}</p>
    <div class="status" role="group" aria-label="Hol tartok ezzel a tétellel?">
      <button type="button" class="s-warn" data-s="warn" aria-pressed="${status[cur]==='warn'}">Még gyakorolom</button>
      <button type="button" class="s-ok" data-s="ok" aria-pressed="${status[cur]==='ok'}">Megy</button>
    </div>`;
  $('#kw').innerHTML = `<h3>A tanári példány kulcsszavai</h3><div class="chips">${t.kulcsszavak.map(k=>`<span>${esc(k)}</span>`).join('')}</div>`;
  const p = $('#pane');
  if(view==='olvas'){
    p.innerHTML = `<div class="doc">${t.sections.map(s=>`<h3 class="rd">${esc(s.h)}</h3>`+blocksHtml(s.blocks)).join('')}</div>`;
  } else if(view==='roviden'){
    p.innerHTML = `<div class="short"><h3 class="sh rd">Vázlat</h3><p class="hint" style="margin-top:4px">Ezt érdemes a 10 perces felkészülési idő alatt felírni, és a felelet során végigmenni rajta.</p><ol class="outline">${t.outline.map(o=>`<li class="rd">${fmt(o)}</li>`).join('')}</ol>
      <h3 class="sh rd">Fogalmak, amiket tudni kell</h3><ul class="facts">${t.cards.map(c=>`<li class="rd"><span class="fq">${esc(c.q)}</span> <span class="fa">${esc(c.a)}</span></li>`).join('')}</ul></div>`;
  } else {
    renderCard();
  }
  readerTitle();
}
function renderCard(){
  const t=T[cur], c=t.cards[cardIdx];
  $('#pane').innerHTML = `<div class="card"><div class="card-inner ${cardBack?'back':''}" id="cardFace" tabindex="0" role="button" aria-label="Kártya megfordítása">
    <span class="side">${cardBack?'Válasz':'Kérdés'}</span><div class="txt rd" data-r="card" data-seg="${2+cardIdx*2+(cardBack?1:0)}">${esc(cardBack?c.a:c.q)}</div>
    ${cardBack?'':'<span class="hint" style="margin:0">Gondold végig a választ, aztán kattints a kártyára.</span>'}</div></div>
    <div class="cardnav"><button class="btn" id="cPrev" type="button" ${cardIdx===0?'disabled':''}>← Előző</button>
    <span class="count">${cardIdx+1} / ${t.cards.length}</span>
    <button class="btn primary" id="cNext" type="button">${cardIdx===t.cards.length-1?'Következő tétel →':'Következő →'}</button></div>`;
  const flip=()=>{stopReading();cardBack=!cardBack;renderCard();};
  $('#cardFace').addEventListener('click',flip);
  $('#cardFace').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}});
  $('#cPrev').onclick=()=>{stopReading();cardIdx--;cardBack=false;renderCard();};
  $('#cNext').onclick=()=>{ stopReading(); if(cardIdx<t.cards.length-1){cardIdx++;cardBack=false;renderCard();} else go((cur+1)%T.length); };
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-v]'); if(!b)return; stopReading();
  if(isW()){ wView=b.dataset.v; store.set('wView',wView); qi=0; render(); return; }
  view=b.dataset.v; store.set('view',view); cardIdx=0; cardBack=false; render();});
$('#slip').addEventListener('click',e=>{ if(!e.target.closest('#wAll')) return;
  stopReading(); const ds=[...document.querySelectorAll('.wq')], open=!ds.every(d=>d.open); ds.forEach(d=>d.open=open); qi=0; wSyncAll(); });
$('#slip').addEventListener('click',e=>{const b=e.target.closest('button[data-s]'); if(!b)return; status[cur]= status[cur]===b.dataset.s?undefined:b.dataset.s; if(!status[cur]) delete status[cur]; store.set('status',status); render();});

/* ---------- felolvasás: felvett Noémi hang (hangok/), tartalékként a böngésző hangja ---------- */
const AUD = window.AUDIO_TIMINGS || null;
const REC = '__rec__';
const au = new Audio(); au.preload='auto';
let audioOK = !!AUD, curSrc='', recSeg=-1, recTimer=null;
const synth = window.speechSynthesis;
let voices=[], voice=null, sel=store.get('voice2', AUD?REC:null), rate=+store.get('rate',1), queue=[], qi=0, playing=false, utter=null, token=0;
const MALE=/szabolcs|tam[aá]s|\bmale\b|f[eé]rfi/i;
function scoreVoice(v){ let s=0; const n=v.name;
  if(/no[eé]mi|mariska/i.test(n)) s+=10; if(/enhanced|premium|b[őo]v[íi]tett|pr[ée]mium/i.test(n)) s+=4; if(/natural|online|neural/i.test(n)) s+=3; if(/google/i.test(n)) s+=2; if(/female|n[őo]i/i.test(n)) s+=4; if(MALE.test(n)) s-=20; return s; }
const fileKey = () => isW() ? `w${String(wCur+1).padStart(2,'0')}${wView==='roviden'?'-roviden':''}` : `t${String(cur+1).padStart(2,'0')}-${view}`;
const useRec = () => audioOK && sel===REC && AUD && AUD[fileKey()];
function loadVoices(){
  voices = synth ? synth.getVoices().filter(v=>/^hu/i.test(v.lang)).sort((a,b)=>scoreVoice(b)-scoreVoice(a)) : [];
  if(sel===REC && !audioOK) sel=null;
  voice = voices.find(v=>v.name===sel) || voices[0] || null;
  const opts=[];
  if(audioOK) opts.push(`<option value="${REC}" ${sel===REC?'selected':''}>Noémi (felvett hang)</option>`);
  voices.forEach(v=>opts.push(`<option value="${esc(v.name)}" ${sel!==REC&&v===voice?'selected':''}>${esc(v.name)}</option>`));
  $('#voiceSel').innerHTML = opts.join('') || '<option>Nincs magyar hang</option>';
  noticeUpdate();
}
function noticeUpdate(){
  const n=$('#voiceNotice');
  if(sel===REC && audioOK){ n.hidden=true; return; }
  if(!synth){ n.hidden=false; n.textContent='A felvett hangfájlok nem érhetők el, és ez a böngésző nem tud felolvasni.'; return; }
  if(!voice){ n.hidden=false; n.innerHTML='A felvett hangfájlok nem érhetők el, és ezen az eszközön nincs magyar hang. Futtasd a <b>Hangok_generalasa.bat</b> fájlt az app mappájában.'; return; }
  if(!AUD){ n.hidden=false; n.innerHTML='A felvett Noémi hang még nincs legenerálva, ezért most a böngésző hangja olvas. Futtasd a <b>Hangok_generalasa.bat</b> fájlt az app mappájában.'; return; }
  n.hidden=true;
}
if(synth){ synth.onvoiceschanged=loadVoices; setTimeout(loadVoices,800); }
loadVoices();
$('#voiceSel').addEventListener('change',e=>{ const was=playing; stopReading(); sel=e.target.value; store.set('voice2',sel); voice=voices.find(v=>v.name===sel)||voice; noticeUpdate(); if(was) startAt(qi); });
const rateEl=$('#rate'); rateEl.value=rate; $('#rateOut').textContent=rate.toFixed(2)+'×';
rateEl.addEventListener('input',()=>{ rate=+rateEl.value; $('#rateOut').textContent=rate.toFixed(2)+'×'; store.set('rate',rate); au.playbackRate=rate; });
rateEl.addEventListener('change',()=>{ if(playing && !useRec()) speakBlock(); });

function buildQueue(){ queue=[...document.querySelectorAll('#slip .rd, #pane .rd')].filter(el=>!el.closest('details:not([open]) .doc')); }
const segOf = el => el && el.dataset.seg!=null ? +el.dataset.seg : queue.indexOf(el);
function readerTitle(){ if(isW()){ $('#nowT').textContent=`Írásbeli · ${W[wCur].name}${wView==='roviden'?' · Röviden':''}`; return; } $('#nowT').textContent=`${T[cur].n}. tétel · ${({olvas:'Kidolgozás',roviden:'Röviden',kartya:'Kártya'})[view]}`; }
function mark(){ document.querySelectorAll('.rd.speaking').forEach(e=>e.classList.remove('speaking')); const el=queue[qi]; if(el){ el.classList.add('speaking'); const r=el.getBoundingClientRect(); if(r.top<60||r.bottom>innerHeight-110) el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'}); $('#nowS').textContent=plain(el.textContent).slice(0,120);} }
function setPlayIcon(){ $('#playIco').innerHTML = playing?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>'; $('#playB').setAttribute('aria-label',playing?'Felolvasás szüneteltetése':'Felolvasás indítása'); }

/* felvett hang */
function recSeek(t){ const go=()=>{ try{ au.currentTime=t; }catch(e){} }; if(au.readyState>=1) go(); else au.addEventListener('loadedmetadata',go,{once:true}); }
function recPlay(){
  const segs=AUD[fileKey()]; recSeg=segOf(queue[qi]); if(!segs[recSeg]){ stopReading(true); return; }
  const src='hangok/'+fileKey()+'.mp3';
  if(curSrc!==src){ curSrc=src; au.src=src; }
  au.playbackRate=rate; recSeek(segs[recSeg][0]); mark();
  const p=au.play(); if(p&&p.catch) p.catch(err=>{ if(err.name==='NotAllowedError'){ playing=false; setPlayIcon(); } });
  clearInterval(recTimer); recTimer=setInterval(recTick,60);
}
function recTick(){
  if(!playing) return; const segs=AUD[fileKey()]; if(!segs||!segs[recSeg]) return;
  if(au.currentTime < segs[recSeg][1]-0.03 && !au.ended) return;
  const nq=qi+1;
  if(nq>=queue.length){ stopReading(true); return; }
  const ns=segOf(queue[nq]); qi=nq;
  if(ns!==recSeg+1) recSeek(segs[ns][0]);
  recSeg=ns; mark();
}
au.addEventListener('ended',()=>{ if(playing) recTick(); });
au.addEventListener('error',()=>{ if(!curSrc) return; audioOK=false; curSrc=''; const was=playing; clearInterval(recTimer); loadVoices(); if(was && synth){ speakBlock(); } else { playing=false; setPlayIcon(); } });

/* böngésző hangja (tartalék) */
const ABBR=[[/\bpl\./g,'például'],[/\bkb\./g,'körülbelül'],[/\bstb\./g,'és így tovább'],[/\bvs\./g,'kontra'],[/\bNkt\./g,'köznevelési törvény'],[/\bGyvt\./g,'gyermekvédelmi törvény'],[/\bBtk\./g,'Büntető Törvénykönyv'],[/\bbv\./g,'büntetés-végrehajtási'],[/(\d)\s?cm\b/g,'$1 centiméter'],[/(\d)\s?kg\b/g,'$1 kilogramm'],[/→/g,', majd '],[/(\d+)–(\d+)/g,'$1-$2'],[/\s–\s/g,', '],[/[„”"]/g,'']];
function speakable(s){ s=plain(s); ABBR.forEach(([a,b])=>s=s.replace(a,b)); return s; }
function chunks(s){ const out=[]; s.split(/(?<=[.!?:;])\s+/).forEach(p=>{ while(p.length>220){ let k=p.lastIndexOf(',',220); if(k<60) k=p.lastIndexOf(' ',220); out.push(p.slice(0,k+1)); p=p.slice(k+1).trim(); } if(p) out.push(p); }); return out; }
function speakBlock(){
  if(!synth){ stopReading(); noticeUpdate(); return; } const my=++token; synth.cancel();
  if(qi>=queue.length){ stopReading(true); return; }
  mark();
  let el=queue[qi], txt=el.textContent; if(el.tagName==='H3'||el.tagName==='H2') txt+='.';
  const parts=chunks(speakable(txt)); let pi=0;
  const next=()=>{ if(my!==token) return;
    if(pi>=parts.length){ qi++; speakBlock(); return; }
    utter=new SpeechSynthesisUtterance(parts[pi++]); utter.lang='hu-HU'; if(voice) utter.voice=voice; utter.rate=rate;
    utter.pitch = voice && MALE.test(voice.name) ? 1.35 : 1;
    utter.onend=()=>setTimeout(next, 60); utter.onerror=e=>{ if(e.error!=='interrupted'&&e.error!=='canceled') setTimeout(next,60); };
    synth.speak(utter); };
  next();
}

/* közös vezérlés */
function startAt(i){ buildQueue(); qi=Math.max(0,Math.min(i,queue.length-1)); playing=true; setPlayIcon(); if(useRec()) recPlay(); else speakBlock(); }
function stopReading(done){ token++; if(synth) synth.cancel(); au.pause(); clearInterval(recTimer); playing=false; setPlayIcon(); document.querySelectorAll('.rd.speaking').forEach(e=>e.classList.remove('speaking')); if(done){ qi=0; $('#nowS').textContent='Vége. Kattints bármelyik bekezdésre az újrakezdéshez.'; } }
$('#playB').addEventListener('click',()=>{
  if(playing){ playing=false; token++; if(synth) synth.cancel(); au.pause(); clearInterval(recTimer); setPlayIcon(); return; }
  buildQueue(); if(qi>=queue.length) qi=0;
  if(useRec() && curSrc==='hangok/'+fileKey()+'.mp3' && recSeg===segOf(queue[qi]) && au.currentTime>0){ playing=true; setPlayIcon(); au.play(); clearInterval(recTimer); recTimer=setInterval(recTick,60); mark(); return; }
  startAt(qi);
});
$('#prevB').addEventListener('click',()=>{ buildQueue(); startAt(qi-1); });
$('#nextB').addEventListener('click',()=>{ buildQueue(); startAt(qi+1); });
document.addEventListener('click',e=>{ const el=e.target.closest('#slip .rd, #pane .doc .rd, #pane .short .rd'); if(!el) return; if(String(getSelection())) return; buildQueue(); startAt(queue.indexOf(el)); });
window.addEventListener('beforeunload',()=>{ if(synth) synth.cancel(); });

/* ---------- exam simulation ---------- */
let ex=null, tick=null;
function openDraw(){
  stopReading(); const pool=T.map((_,i)=>i); const weak=pool.filter(i=>status[i]!=='ok'); const src=weak.length?weak:pool;
  ex={i:src[Math.floor(Math.random()*src.length)], phase:'prep', left:600}; drawRender(); clearInterval(tick); tick=setInterval(()=>{ if(!ex||ex.phase==='check') return; ex.left--; if(ex.left<=0){ if(ex.phase==='prep'){ex.phase='answer';ex.left=600;} else {ex.phase='check';} drawRender(); } else { const el=$('#timer'); if(el) el.textContent=mmss(ex.left);} },1000);
}
const mmss=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
function drawRender(){
  const o=$('#overlay'), t=T[ex.i]; o.hidden=false; document.body.style.overflow='hidden';
  const phases={prep:'Felkészülési idő',answer:'Felelet',check:'Önértékelés'};
  let body='';
  if(ex.phase==='check'){
    body=`<div><p class="lbl">Mely kulcsszavakat érintetted a feleletben?</p><ul class="checklist">${t.kulcsszavak.map((k,j)=>`<li><label><input type="checkbox" id="kc${j}"> <span>${esc(k)}</span></label></li>`).join('')}</ul></div>
    <p class="score" id="score">Érintett kulcsszavak: <b>0 / ${t.kulcsszavak.length}</b></p>
    <div class="row"><button class="btn primary" id="exSave" type="button">Eredmény mentése</button><button class="btn" id="exOpen" type="button">Megnyitom a kidolgozást</button><button class="btn" id="exAgain" type="button">Új tétel húzása</button><button class="btn" id="exClose" type="button">Bezárás</button></div>`;
  } else {
    body=`<p class="hint" style="margin:0">${ex.phase==='prep'?'Írd fel a vázlatodat egy lapra. A vizsgán 10 perc jut a felkészülésre és 10 perc a feleletre.':'Mondd el hangosan a feleletet a vázlatod alapján. Ha végeztél, lépj tovább az önértékelésre.'}</p>
    <div class="row"><button class="btn primary" id="exNext" type="button">${ex.phase==='prep'?'Kezdem a feleletet':'Befejeztem'}</button><button class="btn" id="exClose" type="button">Bezárás</button></div>`;
  }
  o.innerHTML=`<div class="exam" role="dialog" aria-modal="true" aria-label="Vizsgaszimuláció">
    <div class="top"><div><div class="phase">${phases[ex.phase]}</div>${ex.phase!=='check'?`<div class="timer" id="timer">${mmss(ex.left)}</div>`:''}</div></div>
    <section class="slip"><div class="eyebrow"><span><b>${t.n}.</b> húzótétel</span><span>${esc(t.temakor)}</span></div><p class="q" style="margin-top:12px;font-style:normal;font-size:19px">${esc(t.kerdes)}</p></section>
    ${body}</div>`;
  const on=(id,f)=>{const b=document.getElementById(id); if(b) b.onclick=f;};
  on('exClose',closeDraw); on('exAgain',openDraw);
  on('exNext',()=>{ if(ex.phase==='prep'){ex.phase='answer';ex.left=600;} else ex.phase='check'; drawRender(); });
  on('exOpen',()=>{ const i=ex.i; closeDraw(); view='olvas'; go(i); });
  if(ex.phase==='check'){
    const upd=()=>{ const n=o.querySelectorAll('.checklist input:checked').length; $('#score').innerHTML=`Érintett kulcsszavak: <b>${n} / ${t.kulcsszavak.length}</b>`; return n; };
    o.querySelectorAll('.checklist input').forEach(c=>c.addEventListener('change',upd));
    on('exSave',()=>{ const n=upd(); status[ex.i]= n/t.kulcsszavak.length>=0.8?'ok':'warn'; store.set('status',status); renderList(); $('#exSave').textContent= status[ex.i]==='ok'?'Mentve: megy':'Mentve: még gyakorolom'; });
  }
  setTimeout(()=>{const b=o.querySelector('.btn.primary'); b&&b.focus();},30);
}
function closeDraw(){ clearInterval(tick); ex=null; $('#overlay').hidden=true; $('#overlay').innerHTML=''; document.body.style.overflow=''; render(); }
$('#drawBtn').onclick=openDraw; $('#drawBtn2').onclick=openDraw;
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&ex) closeDraw(); });

render();
</script>
