e", "temakor": "Pedagógiai, pszichológiai ismeretek", "kerdes": "Mutassa be a megismerő funkciók (érzékelés, észlelés, figyelem, emlékezet, képzelet, gondolkodás) fejlődésének sajátosságait újszülöttkortól kisiskoláskorig!", "kulcsszavak": ["Megismerő folyamat sajátosságai", "A megismerés területei", "Az újszülöttkor, a csecsemőkor, a kisgyermekkor, az óvodáskor és a kisiskoláskor megismerő funkcióinak fejlődése"]}, {"n": 13, "sections": [{"h": "A szociálpszichológia fogalma és tárgya", "blocks": [{"t": "p", "text": "A szociálpszichológia a pszichológia és a szociológia határterülete, amely azt vizsgálja, hogyan hatnak az ember gondolkodására, érzelmeire és viselkedésére mások – valóságos, elképzelt vagy feltételezett – jelenléte és a társas helyzetek. Tárgya az egyén és a csoport kölcsönhatása, a társas észlelés, az attitűdök, a csoportfolyamatok, a konformitás, a vezetés, a kommunikáció, az előítéletek, a segítő és agresszív viselkedés."}]}, {"h": "A csoport fogalma és típusai", "blocks": [{"t": "p", "text": "A csoport két vagy több személy olyan közössége, amelynek tagjai rendszeres kapcsolatban (interakcióban) állnak egymással, közös céljaik, normáik vannak, és összetartozást éreznek („mi-tudat”). A csoportnak szerkezete van: a tagok különböző helyet (státuszt) és szerepet töltenek be."}, {"t": "p", "text": "A csoportok típusai:"}, {"t": "ul", "items": ["**Elsődleges (primer) csoport:** kis létszámú, személyes, érzelmi kapcsolatokon alapul (család, baráti kör).", "**Másodlagos (szekunder) csoport:** nagyobb, személytelenebb, céltudatos szerveződés (iskola, munkahely, egyesület).", "**Formális csoport:** szabályzattal, hivatalos szerkezettel működik (iskolai osztály).", "**Informális csoport:** spontán, rokonszenv alapján szerveződik (baráti társaság az osztályon belül).", "**Kiscsoport és nagycsoport:** a létszám szerint; kiscsoportban mindenki közvetlen kapcsolatban van mindenkivel.", "**Tagsági csoport:** amelyhez ténylegesen tartozunk.", "**Referenciacsoport (vonatkoztatási csoport):** amelyhez tartozni szeretnénk, amelynek normáihoz igazodunk."]}]}, {"h": "A szerep és a státusz összefüggése", "blocks": [{"t": "p", "text": "A **státusz** az egyén helye, pozíciója a társadalomban vagy a csoportban. Lehet **született (tulajdonított)** – például nem, életkor, családi származás – és **szerzett** – például foglalkozás, végzettség, csoportvezetői pozíció."}, {"t": "p", "text": "A **szerep** a státuszhoz kapcsolódó, a közösség által elvárt viselkedésminták összessége. A státusz tehát a „hely”, a szerep a „hozzá tartozó viselkedés”. Minden ember egyszerre több státuszt tölt be, így több szerepe van (egy pedagógiai asszisztens egyszerre munkatárs, szülő, házastárs, barát)."}, {"t": "p", "text": "**Szerepkonfliktus** akkor jön létre, ha a szerepelvárások összeütköznek:"}, {"t": "ul", "items": ["**szerepek közötti konfliktus:** két szerep elvárásai ellentmondanak (munka és család);", "**szerepen belüli konfliktus:** egy szerepen belül különböző elvárások (a pedagógustól a szülők és az igazgató mást várnak)."]}, {"t": "p", "text": "Fontos fogalom még a **szerepkészlet** és a **szereptanulás:** a szerepeket a szocializáció során sajátítjuk el."}]}, {"h": "A sztereotípia", "blocks": [{"t": "p", "text": "A sztereotípia egy csoportról kialakult, leegyszerűsítő, általánosító kép, amely a csoport minden tagjának ugyanazokat a tulajdonságokat tulajdonítja („a skótok fukarok”). A sztereotípia a gondolkodás „gazdaságos” működéséből fakad: segít a bonyolult világ gyors rendezésében, a kategorizálásban. Lehet pozitív és negatív is, de mindig torzít, mert figyelmen kívül hagyja az egyéni különbségeket. A sztereotípiák makacsul fennmaradnak, mert az ember inkább a megerősítő információkat veszi észre."}]}, {"h": "Az előítélet", "blocks": [{"t": "p", "text": "Az előítélet egy csoporttal vagy annak tagjaival szemben megfelelő tapasztalat és ismeret nélkül kialakított, általában negatív, érzelmileg erősen telített és nehezen változtatható ítélet, attitűd (Gordon Allport). Az előítélet három összetevője:"}, {"t": "ul", "items": ["**kognitív:** a sztereotip vélekedés („ők ilyenek”);", "**érzelmi:** ellenszenv, félelem, megvetés;", "**viselkedési:** elkerülés, kirekesztés, diszkrimináció, szélsőséges esetben erőszak."]}, {"t": "p", "text": "**Kialakulásának okai:** a családi és kortárs minták átvétele, a tapasztalat hiánya, a csoportok közötti versengés, a frusztráció levezetése (bűnbakképzés), a saját csoport felértékelése (mi és ők), a tekintélyelvű személyiség."}, {"t": "p", "text": "**Csökkentésének lehetőségei:** személyes kapcsolat egyenrangú helyzetben, közös cél érdekében végzett együttműködés (például kooperatív tanulás), ismeretterjesztés, empátia fejlesztése, a pedagógus és az asszisztens előítélet-mentes mintája."}]}, {"h": "Az előítélet és a sztereotípia összefüggései", "blocks": [{"t": "p", "text": "A sztereotípia az előítélet **kognitív alapja,** a „tudás” rész, az előítélet pedig a sztereotípiához kapcsolódó **érzelmi viszonyulás** és cselekvési hajlam. Sztereotípia lehet előítélet nélkül is, de előítélet nem létezik sztereotípia nélkül. A negatív sztereotípiák táplálják az előítéleteket, az előítéletek pedig megerősítik a sztereotípiákat. Az előítélet a viselkedésben diszkriminációként jelenik meg. Az iskolában az előítéletek kirekesztéshez, csúfoláshoz, bántalmazáshoz vezethetnek, ezért a megelőzés kiemelt pedagógiai feladat."}]}, {"h": "A deviancia fogalma és típusai", "blocks": [{"t": "p", "text": "A deviancia a társadalmi normáktól eltérő, azokat megsértő viselkedés. A deviancia megítélése társadalmanként és koronként változó. Szűkebb értelemben a negatív, a társadalom által elítélt eltérést értjük alatta."}, {"t": "p", "text": "Magyarázatai közül ismert Émile Durkheim **anómia-elmélete** (a normák meggyengülése, értékzavar társadalmi válság idején) és Robert Merton elmélete, amely szerint a deviancia akkor jön létre, amikor a társadalmilag elfogadott célok és az elérésükhöz rendelkezésre álló legális eszközök között ellentmondás van. Merton alkalmazkodási típusai: konformitás (elfogadja a célokat és az eszközöket), újítás (elfogadja a célt, de illegitim eszközt választ – például bűnözés), ritualizmus (az eszközökhöz ragaszkodik, de a célt feladja), visszahúzódás (célt és eszközt is elutasít – például szenvedélybetegség), lázadás (új célokat és eszközöket állít)."}, {"t": "p", "text": "A deviancia formái:"}, {"t": "ul", "items": ["bűnözés (kriminalitás), fiatalkori bűnözés;", "alkoholizmus és más szenvedélybetegségek (drogfogyasztás, játékszenvedély, digitális függőség);", "öngyilkosság;", "egyes mentális zavarok;", "iskolakerülés, csavargás, agresszió, bántalmazás (bullying)."]}, {"t": "p", "text": "A deviáns viselkedés hátterében gyakran családi problémák, érzelmi elhanyagolás, kedvezőtlen kortárs hatás, kudarcok, szegénység áll. A pedagógiai asszisztens feladata a figyelmeztető jelek észrevétele, jelzése a pedagógusnak, és a gyermek támogatása."}]}], "outline": ["Szociálpszichológia: az egyén viselkedése társas helyzetekben, az egyén és a csoport kölcsönhatása.", "Csoport: közös cél, interakció, összetartozás, normák; elsődleges–másodlagos, formális–informális, kis–nagy, tagsági–referencia.", "Státusz: hely a csoportban (született, szerzett); szerep: a státuszhoz kapcsolódó elvárt viselkedés; szerepkonfliktus.", "Sztereotípia: leegyszerűsítő általánosítás egy csoportról; előítélet: megalapozatlan, általában negatív, érzelmileg telített ítélet.", "Deviancia: a normáktól eltérő viselkedés; formái: bűnözés, szenvedélybetegségek, öngyilkosság, mentális zavarok; Merton tipológiája."], "cards": [{"q": "Mit vizsgál a szociálpszichológia?", "a": "Az egyén gondolkodását, érzelmeit, viselkedését társas helyzetekben, az egyén és a csoport kölcsönhatását."}, {"q": "Mi a referenciacsoport?", "a": "Az a csoport, amelyhez tartozni szeretnénk, amelynek normáihoz igazodunk."}, {"q": "Mi a különbség a státusz és a szerep között?", "a": "A státusz a helyünk a csoportban; a szerep a hozzá kapcsolódó elvárt viselkedés."}, {"q": "Mi a sztereotípia?", "a": "Egy csoportról alkotott leegyszerűsítő, általánosító kép."}, {"q": "Mi az előítélet?", "a": "Tapasztalat nélkül kialakult, általában negatív, érzelmileg telített, nehezen változó ítélet (Allport)."}, {"q": "Hogyan függ össze az előítélet és a sztereotípia?", "a": "A sztereotípia az előítélet kognitív alapja; az előítélet hozzá kapcsolódó érzelmi és viselkedési viszonyulás."}, {"q": "Mi a deviancia?", "a": "A társadalmi normáktól eltérő, azokat megsértő viselkedés."}], "cim": "Szociálpszichológiai alapfogalmak", "temakor": "Pedagógiai, pszichológiai ismeretek", "kerdes": "Ismertesse a szociálpszichológia fogalmát, tárgyát, és mutassa be a szociálpszichológia alapfogalmait: csoport, szerep, státusz, előítélet, deviancia!", "kulcsszavak": ["A szociálpszichológia fogalma, tárgya", "A csoport fogalma, típusai", "A szerep és státusz összefüggése", "Az előítélet fogalma, működése", "A sztereotípia fogalma, működése", "Az előítélet és a sztereotípia összefüggései", "A deviancia fogalma, típusai"]}, {"n": 14, "sections": [{"h": "A nevelési stílus fogalma", "blocks": [{"t": "p", "text": "A nevelési (vezetési) stílus a nevelő viselkedésének, a gyermekekkel való bánásmódjának, irányítási módjának jellegzetes, viszonylag állandó módja. Megmutatja, hogyan kezeli a nevelő a szabályokat, a fegyelmet, a követelményeket, és milyen érzelmi viszonyt alakít ki a gyermekekkel. A nevelési stílus meghatározza a csoport légkörét, a gyermekek viselkedését, motivációját és személyiségfejlődését."}, {"t": "p", "text": "Kurt Lewin és munkatársai klasszikus kísérletükben három vezetési stílust vizsgáltak gyermekcsoportokban:"}, {"t": "ul", "items": ["**autokratikus (tekintélyelvű):** a vezető dönt mindenről, utasít; a csoport hatékony, amíg a vezető jelen van, de feszült, agresszív vagy apatikus a légkör;", "**demokratikus:** a vezető bevonja a tagokat a döntésekbe; jó a légkör, a munka a vezető távollétében is folyik, nagy az önállóság;", "**laissez-faire (engedékeny, „hagyd, hadd menjen”):** a vezető nem irányít; a csoport szervezetlen, kevéssé eredményes."]}]}, {"h": "A tekintélyelvű nevelő jellemzői", "blocks": [{"t": "ul", "items": ["erős irányítás, sok szabály, utasítás, tiltás;", "a szabályokat nem magyarázza meg („mert én mondtam”);", "feltétlen engedelmességet követel, gyakran büntet;", "kevés érzelmi melegség, kevés dicséret;", "a gyermek véleményére nem kíváncsi."]}, {"t": "p", "text": "**Hatása:** a gyermek fegyelmezett, de szorongó, bizonytalan, kevéssé önálló és kezdeményező; vagy éppen lázadó, agresszív lehet; gyenge a belső kontroll, a szabálykövetés a külső ellenőrzéshez kötött."}]}, {"h": "Az engedékeny nevelő jellemzői", "blocks": [{"t": "ul", "items": ["kevés szabály és követelmény, következetlenség;", "a gyermek kívánságainak teljesítése, a határok hiánya;", "érzelmileg lehet meleg, de nem irányít;", "elkerüli a konfliktusokat."]}, {"t": "p", "text": "**Hatása:** a gyermek önközpontú, impulzív, alacsony a kudarctűrése és a feladattudata, nehezen alkalmazkodik a szabályokhoz, önfegyelme gyenge."}]}, {"h": "A megkívánó nevelő jellemzői", "blocks": [{"t": "p", "text": "A megkívánó (mérvadó, irányító-elfogadó, demokratikus) nevelő:"}, {"t": "ul", "items": ["világos, életkornak megfelelő követelményeket támaszt, és ezeket következetesen betartatja;", "a szabályokat megmagyarázza, indokolja;", "érzelmileg meleg, elfogadó, tiszteli a gyermek személyiségét;", "meghallgatja a gyermek véleményét, bevonja a döntésekbe;", "dicsér, bátorít, és támogatja az önállóságot."]}, {"t": "p", "text": "**Hatása:** a gyermek önálló, magabiztos, felelősségteljes, együttműködő, jó önszabályozású, és teljesítménye is jobb. Ez a pedagógiailag legkedvezőbb stílus (Diana Baumrind kutatásai alapján). Baumrind később leírta az **elhanyagoló** (közömbös) stílust is: nincs sem követelmény, sem melegség – ez a legkárosabb."}]}, {"h": "A nevelői attitűd fogalma", "blocks": [{"t": "p", "text": "Az attitűd valamely személlyel, tárggyal, helyzettel szembeni értékelő, viszonylag tartós beállítódás, viszonyulás. Három összetevője: **kognitív** (ismeret, vélemény), **érzelmi** (rokonszenv–ellenszenv) és **viselkedési** (cselekvési hajlam). A nevelői attitűd a nevelő gyermekhez való alapvető viszonyulása, amely meghatározza a nevelő minden megnyilvánulását – hangnemét, testbeszédét, reakcióit. A gyermek a nevelői attitűdöt nagyon érzékenyen észleli."}]}, {"h": "A nevelői attitűd formái", "blocks": [{"t": "p", "text": "A nevelői attitűd két dimenzió mentén írható le (Schaefer, Becker modellje alapján):"}, {"t": "ul", "items": ["**érzelmi klíma:** meleg (elfogadó, szeretetteljes) vagy hideg (elutasító, ellenséges);", "**a viselkedés irányítása:** engedékeny (autonómiát adó) vagy korlátozó (szigorú, kontrolláló)."]}, {"t": "p", "text": "A két dimenzió kombinációjából négy alapforma adódik:"}, {"t": "ul", "items": ["**meleg és engedékeny:** demokratikus, elfogadó, önállóságot adó nevelés – a gyermek aktív, önálló, kreatív, barátságos;", "**meleg és korlátozó:** túlóvó, féltő, birtokló nevelés – a gyermek függő, engedelmes, kevéssé önálló és kreatív;", "**hideg és korlátozó:** tekintélyelvű, autoriter, elutasító nevelés – a gyermek szorongó, visszahúzódó vagy agresszív, lázadó;", "**hideg és engedékeny:** elhanyagoló, közömbös nevelés – a gyermek agresszív, deviáns viselkedésre hajlamos, érzelmileg sérült."]}, {"t": "p", "text": "A kedvező nevelői attitűd tehát meleg, elfogadó, ugyanakkor következetes, és az életkornak megfelelő önállóságot biztosít."}]}, {"h": "A gyermekek közötti kapcsolatok feltérképezése: a szociometria", "blocks": [{"t": "p", "text": "A közösség belső kapcsolatrendszerének feltárására szolgáló módszer a **szociometria,** amelyet Jacob L. Moreno dolgozott ki, Magyarországon pedig Mérei Ferenc fejlesztett tovább (**közösségi szociometria**)."}, {"t": "p", "text": "**Menete:** a gyermekek (az életkoruknak megfelelő módon, például kérdőíven vagy beszélgetésben) válaszolnak olyan kérdésekre, mint „Kivel ülnél szívesen egy padban?”, „Kit hívnál meg a születésnapodra?”, „Kivel dolgoznál együtt?”. A választásokat táblázatba (szociometriai mátrix) rendezik, és ábrán (**szociogram**) ábrázolják: a gyermekeket körök, a választásokat nyilak jelölik."}, {"t": "p", "text": "**Az elemzés során kirajzolódó pozíciók:**"}, {"t": "ul", "items": ["**sztár (vezér):** a legtöbb választást kapó gyermek;", "**népszerű, kedvelt tagok;**", "**peremhelyzetű:** kevés választást kap;", "**elszigetelt (izolált):** senki nem választja;", "**elutasított:** sok negatív választást kap (ha a vizsgálat erre is rákérdez);", "**kölcsönös párok, láncok, klikkek (zárt alcsoportok).**"]}, {"t": "p", "text": "**Pedagógiai haszna:** feltárja a rejtett kapcsolatokat, az elszigetelt, kirekesztett gyermekeket, a hatással bíró tagokat. Ennek alapján a pedagógus tudatosan segítheti a beilleszkedést (ültetés, csoportbeosztás, feladatok kiosztása). A vizsgálat eredményei bizalmasak, a gyermekek nem ismerhetik meg egymás választásait. A szociometria mellett a kapcsolatokról a **megfigyelés** (játék, szünetek, kirándulás) is sokat elárul – ebben a pedagógiai asszisztens tapasztalatai különösen értékesek."}]}], "outline": ["Nevelési stílus: a nevelő viselkedésének, irányítási módjának jellegzetes, tartós módja.", "Lewin: autokratikus, demokratikus, laissez-faire.", "Baumrind: tekintélyelvű, engedékeny, megkívánó (mérvadó, irányító) + elhanyagoló.", "Attitűd: viszonyulás – értékelő beállítódás; kognitív, érzelmi, viselkedési összetevő.", "Két dimenzió: érzelmi klíma (meleg–hideg) és irányítás (engedékeny–korlátozó) → négy típus.", "Szociometria (Moreno, Mérei): kérdőív, szociogram; sztár, népszerű, peremhelyzetű, elszigetelt, elutasított, klikk."], "cards": [{"q": "Melyek Lewin vezetési stílusai?", "a": "Autokratikus, demokratikus, laissez-faire."}, {"q": "Mi jellemzi a megkívánó nevelőt?", "a": "Világos, következetes követelmények, megmagyarázott szabályok, érzelmi melegség, a gyermek véleményének tisztelete."}, {"q": "Milyen gyermek nő fel túlóvó (meleg-korlátozó) nevelés mellett?", "a": "Függő, engedelmes, kevéssé önálló és kreatív."}, {"q": "Melyik a legkárosabb nevelői attitűd?", "a": "A hideg és engedékeny, elhanyagoló attitűd."}, {"q": "Ki dolgozta ki a szociometriát?", "a": "Jacob L. Moreno; Magyarországon Mérei Ferenc fejlesztette tovább."}, {"q": "Mi a szociogram?", "a": "A csoporton belüli választásokat ábrázoló rajz: a tagok körök, a választások nyilak."}, {"q": "Mit jelent az elszigetelt pozíció?", "a": "A gyermeket senki sem választja a csoportban."}], "cim": "Nevelési stílusok, nevelői attitűd, szociometria", "temakor": "Pedagógiai, pszichológiai ismeretek", "kerdes": "Mutassa be a nevelési-vezetési stílusokat, valamint a nevelői attitűd formáit! Ismertesse a gyermekek, tanulók közötti kapcsolatok feltérképezésének lehetőségét!", "kulcsszavak": ["A nevelési stílus fogalma", "A tekintélyelvű nevelő jellemzői", "Az engedékeny nevelő jellemzői", "A megkívánó nevelő jellemzői", "A nevelői attitűd fogalma", "A nevelői attitűd formái emocionális klíma és a viselkedés irányítása szerint", "A kortárscsoportok kapcsolatainak feltérképezése, a szociometria"]}, {"n": 15, "sections": [{"h": "A család fogalma", "blocks": [{"t": "p", "text": "A család a társadalom legkisebb, alapvető egysége: házasság, élettársi kapcsolat, vérrokonság vagy örökbefogadás révén összetartozó, többnyire közös háztartásban élő személyek közössége, akiket érzelmi kötelék, kölcsönös felelősség, gondoskodás és közös gazdálkodás kapcsol össze. A család a gyermek elsődleges szocializációs színtere, ahol megtapasztalja a szeretetet, a biztonságot, és elsajátítja az alapvető értékeket és szokásokat."}]}, {"h": "A társadalom, az intézmények és a család kapcsolatrendszere", "blocks": [{"t": "p", "text": "A család nem elszigetelt egység: kölcsönhatásban áll a tágabb társadalommal és annak intézményeivel. A társadalom jogszabályokkal (például a családjogi, gyermekvédelmi szabályok), pénzbeli és természetbeni támogatásokkal (családi pótlék, gyermekgondozási ellátások, családi adókedvezmény) és szolgáltatásokkal (bölcsőde, óvoda, iskola, védőnői hálózat, egészségügy, család- és gyermekjóléti szolgálat) segíti a családot."}, {"t": "p", "text": "A nevelési-oktatási intézmények a család nevelő munkáját kiegészítik, nem helyettesítik. A sikeres neveléshez a család és az intézmény **partneri együttműködése** szükséges: kölcsönös tájékoztatás, bizalom, közös célok. A pedagógiai asszisztens ennek a kapcsolatnak a része, a pedagógus irányításával segíti a kapcsolattartást."}]}, {"h": "A család szerkezete", "blocks": [{"t": "ul", "items": ["**Nukleáris (kiscsalád):** szülők és gyermekeik – ma a leggyakoribb forma.", "**Többgenerációs (nagy- vagy kiterjesztett) család:** a nagyszülők, esetleg más rokonok is együtt élnek.", "**Egyszülős (csonka) család:** az egyik szülő hiányzik (válás, halál, egyedülálló szülő).", "**Mozaikcsalád (patchwork, újraszerveződött család):** az egyik vagy mindkét szülő korábbi kapcsolatából származó gyermekek együtt élnek a közös gyermekekkel.", "**Élettársi kapcsolaton alapuló család.**", "**Örökbefogadó család, nevelőszülői család.**", "**Gyermektelen család.**"]}, {"t": "p", "text": "A család méretét tekintve beszélhetünk egygyermekes, kétgyermekes és nagycsaládról (3 vagy több gyermek)."}]}, {"h": "A család funkciói", "blocks": [{"t": "ul", "items": ["**Biológiai-reprodukciós funkció:** az utódok világra hozatala, a társadalom fennmaradása.", "**Gazdasági funkció:** a család tagjainak anyagi ellátása, közös háztartás, fogyasztás, gazdálkodás.", "**Érzelmi, védelmi funkció:** szeretet, biztonság, elfogadás, érzelmi támasz, a családtagok testi és lelki védelme.", "**Szocializációs, nevelési funkció:** a gyermek felnevelése, értékek, normák, szokások átadása.", "**Kulturális funkció:** a hagyományok, a nyelv, a kultúra átörökítése.", "**Rekreációs funkció:** pihenés, közös szabadidő, a munka utáni feltöltődés.", "**Egészségvédő, gondozó funkció:** a beteg, idős családtagok gondozása."]}, {"t": "p", "text": "A modern társadalomban egyes funkciókat részben intézmények vesznek át (oktatás, egészségügy), az érzelmi funkció jelentősége viszont megnőtt."}]}, {"h": "A család fejlődési életciklusai", "blocks": [{"t": "p", "text": "A család életében egymást követő, jellegzetes szakaszok vannak, amelyek mindegyike új feladatokat, alkalmazkodást kíván. Az egyik szakaszból a másikba való átmenet gyakran normatív krízissel jár."}, {"t": "ol", "items": ["**Párválasztás, a párkapcsolat kialakulása:** leválás a származási családról.", "**A fiatal házaspár gyermek nélkül:** közös életvitel kialakítása, egymáshoz alkalmazkodás.", "**Kisgyermekes család:** szülői szerepek megtanulása; a pár kapcsolata átalakul.", "**Óvodás- és iskoláskorú gyermekes család:** a gyermek intézményes közösségbe kerül; a család nyit a külvilág felé.", "**Serdülő gyermekes család:** a gyermek leválási törekvései, nagyobb önállóság; a szülők határaik újragondolására kényszerülnek.", "**A gyermekek kirepülése („üres fészek”):** a házaspár ismét kettesben marad; új egyensúly kialakítása.", "**Idős kor:** nyugdíjazás, nagyszülői szerep, a betegségek, a társ elvesztése."]}]}, {"h": "Családi szerepek", "blocks": [{"t": "ul", "items": ["**Anya:** hagyományosan a gondoskodás, az érzelmi biztonság, a gondozás fő forrása.", "**Apa:** hagyományosan a család anyagi biztonságának megteremtője, a külvilág felé vezető, a szabályokat képviselő szülő; ma egyre inkább egyenrangú társa az anyának a gondozásban és nevelésben.", "**Gyermek:** a családi rendszer aktív része; szerepe életkorával változik; fontos, hogy gyermek maradhasson, ne kelljen felnőtt szerepet betöltenie (szerepcsere, „parentifikáció”).", "**Testvér:** a testvérkapcsolat az első kortárskapcsolat; tanít együttműködésre, osztozásra, versengésre. A testvérsorrend (elsőszülött, középső, legkisebb, egyke) befolyásolja a személyiséget.", "**Nagyszülő:** érzelmi támasz, hagyományőrzés, segítség a gyermekfelügyeletben."]}, {"t": "p", "text": "A szerepek ma rugalmasabbak, mint korábban; zavar akkor keletkezik, ha a szerepek tisztázatlanok vagy összemosódnak."}]}, {"h": "Családi konfliktusok típusai és okai", "blocks": [{"t": "p", "text": "**Típusai:**"}, {"t": "ul", "items": ["**házastársak (partnerek) közötti konfliktus;**", "**szülő-gyermek konfliktus** (különösen serdülőkorban);", "**testvérek közötti konfliktus** (testvérféltékenység, rivalizálás);", "**generációk közötti konfliktus** (szülők és nagyszülők, eltérő nevelési elvek);", "**a család és a külvilág közötti konfliktus** (iskola, munkahely, szomszédság)."]}, {"t": "p", "text": "**Lehetséges okai:**"}, {"t": "ul", "items": ["anyagi gondok, munkanélküliség, rossz lakáskörülmények;", "túlterheltség, a munka és a család összeegyeztetésének nehézségei;", "eltérő értékrend, nevelési elvek;", "kommunikációs zavarok, a meghallgatás hiánya;", "szerepzavarok, a feladatok egyenlőtlen elosztása;", "szenvedélybetegségek (alkohol, drog, játékszenvedély);", "hűtlenség, féltékenység, válás;", "betegség, haláleset, fogyatékos családtag gondozása;", "a fejlődési életciklusok közötti átmenetek."]}, {"t": "p", "text": "A tartós családi konfliktus a gyermeknél szorongást, magatartási és tanulási problémákat okozhat; a pedagógiai asszisztens fontos feladata az ilyen jelek észrevétele és jelzése a pedagógusnak."}]}], "outline": ["Család: házasság, élettársi kapcsolat, rokonság, örökbefogadás alapján együtt élő, érzelmileg és gazdaságilag összetartozó közösség; a társadalom alapegysége.", "Kapcsolatrendszer: család – intézmények (óvoda, iskola, egészségügy, szociális rendszer) – társadalom.", "Szerkezet: nukleáris, többgenerációs (nagycsalád), egyszülős, mozaik, élettársi, örökbefogadó, nevelőszülői.", "Funkciók: biológiai-reprodukciós, gazdasági, érzelmi-védelmi, szocializációs-nevelési, kulturális, rekreációs.", "Életciklus: párkapcsolat → kisgyermekes → iskolás → serdülő → kirepülés (üres fészek) → idős kor.", "Szerepek: anya, apa, gyermek, testvér, nagyszülő.", "Konfliktusok: házastársi, szülő-gyermek, testvér, generációs; okok: anyagi, munka, alkohol, szerepzavar, kommunikáció."], "cards": [{"q": "Mi a család?", "a": "A társadalom alapegysége: házasság, élettársi kapcsolat, rokonság vagy örökbefogadás révén összetartozó, érzelmileg és gazdaságilag összekapcsolódó közösség."}, {"q": "Mi a mozaikcsalád?", "a": "Olyan család, amelyben a szülők korábbi kapcsolataiból származó gyermekek is együtt élnek."}, {"q": "Soroljon fel családi funkciókat!", "a": "Biológiai-reprodukciós, gazdasági, érzelmi-védelmi, szocializációs-nevelési, kulturális, rekreációs."}, {"q": "Mi az „üres fészek” időszaka?", "a": "Amikor a gyermekek kirepülnek, és a házaspár ismét kettesben marad."}, {"q": "Melyek a családi konfliktusok típusai?", "a": "Házastársi, szülő-gyermek, testvérek közötti, generációs, a család és a külvilág közötti."}, {"q": "Mi a parentifikáció?", "a": "Szerepcsere: a gyermeknek felnőtt, szülői szerepet kell betöltenie a családban."}], "cim": "A család: fogalom, szerkezet, funkciók, életciklus, konfliktusok", "temakor": "Családpedagógiai alapismeretek", "kerdes": "Ismertesse a család fogalmát, kapcsolatrendszerét! Mutassa be a család szerkezeti formáit és a családi funkciókat! Jellemezze a családi életciklusokat! Térjen ki az egyes családi szerepekre, valamint a családi konfliktusok típusaira és a konfliktusok lehetséges okaira!", "kulcsszavak": ["A család fogalma", "Társadalom, intézmény, család kapcsolatrendszere", "A család szerkezete", "A család funkciói", "A család fejlődési életciklusai", "Családi szerepek", "Családi konfliktusok típusai"]}, {"n": 16, "sections": [{"h": "Az iskolakerülő magatartás", "blocks": [{"t": "p", "text": "Az iskolakerülés (csavargás, lógás) a tanköteles gyermek rendszeres, igazolatlan távolmaradása az iskolától. Magyarországon a tankötelezettség jelenleg a 16. életév végéig tart. Az iskolakerülés megnyilvánulhat egész napos hiányzásban, egyes órák „ellógásában”, gyakori késésben, vagy abban, hogy a gyermek a szülő tudtával vagy tudta nélkül nem megy iskolába."}, {"t": "p", "text": "**Lehetséges hátterei:**"}, {"t": "ul", "items": ["**iskolai okok:** tanulási kudarcok, lemaradás, rossz kapcsolat a pedagógussal, a kortársak általi kiközösítés, bántalmazás (bullying), unalom, túlterhelés;", "**egyéni okok:** szorongás, iskolafóbia, depresszió, alacsony önértékelés, tanulási zavar, figyelemzavar;", "**családi okok:** elhanyagolás, a szülők közömbössége az iskolával szemben, családi krízis (válás, betegség, munkanélküliség), szegénység, a gyermek bevonása a munkába vagy a testvérek gondozásába, szenvedélybeteg szülő;", "**kortárs hatás:** deviáns baráti társaság, a csoport nyomása."]}]}, {"h": "A családi reakciók", "blocks": [{"t": "p", "text": "A család reakciója nagyban meghatározza, hogyan alakul tovább a helyzet:"}, {"t": "ul", "items": ["**tudatlanság:** a szülő nem tud a hiányzásokról (rossz a kapcsolat az iskolával, a gyermek hamisít igazolást);", "**közöny, elhanyagolás:** a szülőt nem érdekli az iskola, nem tartja fontosnak a tanulást;", "**elnézés, fedezés, cinkosság:** a szülő igazolja a hiányzást, mert a gyermeket otthon tartja, vagy védeni akarja;", "**túlzott, indulatos büntetés:** verés, kemény tiltások – ezek gyakran tovább rontják a helyzetet;", "**tehetetlenség:** a szülő nem tud hatni a (főként serdülő) gyermekre;", "**együttműködő reakció:** a szülő az iskolával együtt keresi az okokat és a megoldást – ez a kívánatos."]}]}, {"h": "Az iskola eljárása", "blocks": [{"t": "p", "text": "A jogszabály (a köznevelési törvény végrehajtási rendelete) fokozatos jelzési kötelezettséget ír elő: az iskola az első igazolatlan hiányzáskor értesíti a szülőt, a hiányzások számának növekedésével (jellemzően 10, 30 és 50 tanórai foglalkozásnál) pedig a család- és gyermekjóléti szolgálatot, a szabálysértési hatóságot, illetve a gyámhatóságot. A gyámhatóság ilyenkor védelembe veheti a gyermeket, és súlyos esetben szankciók is következhetnek. (A pontos óraszámokat és eljárásokat mindig a hatályos jogszabály szerint kell alkalmazni.)"}]}, {"h": "A fiatalkorú bűnelkövető", "blocks": [{"t": "p", "text": "A fiatalkorú bűnelkövető az a személy, aki a bűncselekmény elkövetésekor a 12., illetve 14. életévét betöltötte, de a 18. életévét még nem. A fiatalkori bűnözés leggyakoribb formái a vagyon elleni bűncselekmények (lopás, rongálás), a garázdaság, a testi sértés, a kábítószerrel kapcsolatos bűncselekmények és egyre inkább az internetes (online) bűncselekmények."}, {"t": "p", "text": "**Családi háttér:** a fiatalkorú bűnelkövetők családjában gyakori a csonka vagy diszfunkcionális család, az érzelmi elhanyagolás, a következetlen vagy durva nevelés, a szülői felügyelet hiánya, a szenvedélybetegség, a szülők bűnözői múltja, a szegénység. A család reakciója a gyermek bűncselekményére lehet szégyen, tagadás, a gyermek védelme, elutasítás, kitagadás, de lehet támogató, felelősségvállaló is. A bűnelkövetés megterheli a családot (anyagi kár, megbélyegzés, eljárások)."}]}, {"h": "A büntethetőség jogi kérdései", "blocks": [{"t": "p", "text": "A Büntető Törvénykönyv (2012. évi C. törvény) szerint:"}, {"t": "ul", "items": ["**a büntethetőség alsó korhatára a 14. életév;**", "kivételesen **12. életévét betöltött** gyermek is büntethető bizonyos súlyos, élet elleni és erőszakos bűncselekmények (például emberölés, erős felindulásban elkövetett emberölés, súlyos testi sértés, rablás, kifosztás egyes esetei) miatt, **ha az elkövetéskor rendelkezett a bűncselekmény következményeinek felismeréséhez szükséges belátással;**", "a fiatalkorúakra külön szabályok vonatkoznak: a büntetés vagy intézkedés elsődleges célja a fiatalkorú **helyes irányba terelése, nevelése, a társadalomba való beilleszkedésének elősegítése.** A szabadságelvonással járó szankciót csak végső esetben lehet alkalmazni."]}, {"t": "p", "text": "**Szankciók fiatalkorúakkal szemben:**"}, {"t": "ul", "items": ["**intézkedések:** megrovás, próbára bocsátás, jóvátételi munka, pártfogó felügyelet, javítóintézeti nevelés;", "**büntetések:** közérdekű munka (16 éves kortól), pénzbüntetés (önálló jövedelem esetén), foglalkozástól és járművezetéstől eltiltás, kiutasítás, szabadságvesztés (rövidebb maximummal, fiatalkorúak bv. intézetében)."]}, {"t": "p", "text": "A büntetőeljárásban a fiatalkorúnak mindig védője van, és jelen lehet a törvényes képviselője. Lehetőség van közvetítői eljárásra (mediáció) is, amelyben a sértett és az elkövető egyezséget köthet."}]}, {"h": "A büntetés pszichés hatásai", "blocks": [{"t": "p", "text": "**Kedvezőtlen hatások:**"}, {"t": "ul", "items": ["**megbélyegzés (stigmatizáció, címkézés):** a fiatal „bűnözőnek” látja magát, és a környezet is így kezeli, ami tovább erősíti a deviáns viselkedést (címkézéselmélet);", "az önértékelés sérülése, szégyen, düh, bosszúvágy, szorongás;", "a családtól, iskolától való eltávolodás; kimaradás az iskolából;", "a zárt intézetben a bűnözői szubkultúra hatása, „bűnözői iskola”;", "a szabadulás utáni beilleszkedés nehézségei (munka, lakhatás, kapcsolatok)."]}, {"t": "p", "text": "**Kedvező hatások (megfelelő szankció és támogatás esetén):** a következmények megtapasztalása, felelősségtudat, a jóvátétel élménye, új kezdés lehetősége. Ezért fontos az utógondozás, a pártfogó felügyelet, a család és az iskola támogató szerepe."}]}, {"h": "Az iskolakerülés és a bűnelkövetés kapcsolata", "blocks": [{"t": "p", "text": "Az iskolakerülés és a bűnelkövetés között szoros összefüggés van: az iskolából kimaradó gyermek felügyelet nélkül tölti az idejét, gyakran deviáns kortárscsoporthoz csatlakozik, és könnyebben sodródik bűncselekmények felé. Az iskolai kudarc, a lemorzsolódás és a képzetlenség pedig a későbbi munkanélküliség, szegénység és bűnözés kockázatát növeli. Az iskolakerülés ezért **figyelmeztető jel,** amelyre időben reagálni kell. A megelőzés eszközei: a hiányzások gondos nyilvántartása, a gyermekkel és a családdal való azonnali kapcsolatfelvétel, az okok feltárása, a felzárkóztatás, a sikerélmény biztosítása, a tartalmas szabadidős programok."}]}, {"h": "A segítő szakemberek köre", "blocks": [{"t": "ul", "items": ["**osztályfőnök, pedagógusok, pedagógiai asszisztens;**", "**iskolapszichológus, iskolai szociális segítő;**", "**pedagógiai szakszolgálat** (nevelési tanácsadás);", "**család- és gyermekjóléti szolgálat, család- és gyermekjóléti központ;**", "**gyámhatóság;**", "**pártfogó felügyelő;**", "**rendőrség** (ifjúságvédelmi, bűnmegelőzési előadók – például DADA, ELLEN-SZER programok);", "**védőnő, iskolaorvos, gyermekpszichiáter;**", "civil szervezetek, mentorprogramok, egyházak."]}, {"t": "p", "text": "A pedagógiai asszisztens a gyermekkel való közvetlen kapcsolat révén gyakran elsőként észleli a problémákat; feladata, hogy tapasztalatait a pedagógussal megossza, és a titoktartás szabályait betartsa."}]}], "outline": ["Iskolakerülés: tartós, igazolatlan távolmaradás az iskolából, a tankötelezettség megsértése.", "Háttér: tanulási kudarc, iskolai konfliktus, bántalmazás, szorongás, családi problémák, elhanyagolás, kortárs hatás.", "Családi reakciók: tudatlanság, közöny, elnézés, fedezés, túlzott büntetés, együttműködés.", "Jelzési rend: a hiányzás arányában a szülő, majd a gyermekjóléti szolgálat, a gyámhatóság értesítése.", "Büntethetőség: 14 év (egyes súlyos bűncselekményeknél 12 év, belátási képesség esetén); fiatalkorú: 12/14–18 év; az intézkedések és büntetések célja a nevelés.", "Pszichés hatás: megbélyegzés, önértékelés sérülése, bűnöző mintákhoz kötődés; de felelősségtudat is.", "Kapcsolat: az iskolakerülés gyakran a bűnelkövetés előszobája.", "Segítők: osztályfőnök, iskolapszichológus, szociális segítő, család- és gyermekjóléti szolgálat, pártfogó felügyelő, gyámhatóság, rendőrség."], "cards": [{"q": "Mi az iskolakerülés?", "a": "A tanköteles gyermek rendszeres, igazolatlan távolmaradása az iskolától."}, {"q": "Meddig tart Magyarországon a tankötelezettség?", "a": "A 16. életév végéig."}, {"q": "Mi a büntethetőség alsó korhatára?", "a": "A 14. életév; bizonyos súlyos bűncselekményeknél 12 év, ha a gyermek rendelkezett a szükséges belátással."}, {"q": "Soroljon fel fiatalkorúakra alkalmazható intézkedéseket!", "a": "Megrovás, próbára bocsátás, jóvátételi munka, pártfogó felügyelet, javítóintézeti nevelés."}, {"q": "Mi a stigmatizáció?", "a": "Megbélyegzés: a „bűnöző” címke miatt a fiatal így látja magát, ami erősíti a deviáns viselkedést."}, {"q": "Miért figyelmeztető jel az iskolakerülés?", "a": "Mert a felügyelet nélküli idő és a deviáns kortárs hatás a bűnelkövetés felé sodorhatja a gyermeket."}], "cim": "Iskolakerülés és fiatalkori bűnelkövetés", "temakor": "Családpedagógiai alapismeretek", "kerdes": "Jellemezze az iskolakerülő magatartást, ennek lehetséges háttereit és az erre adott családi reakciókat! Jellemezze a fiatalkorú bűnelkövetői magatartást, térjen ki a fiatalkorúak büntethetőségének kérdéseire, valamint a büntetés pszichés hatásaira!", "kulcsszavak": ["Az iskolakerülő magatartás és az erre adott családi reakciók", "Fiatalkorú bűnöző a családban", "A büntethetőség jogi kérdései", "A büntetés pszichés hatásai a fiatalkorú egyénre", "Az iskolakerülő és bűnelkövető magatartás kapcsolata", "A segítő szakemberek köre"]}, {"n": 17, "sections": [{"h": "A mentálhigiéné fogalma és jellemzői", "blocks": [{"t": "p", "text": "A mentálhigiéné a lelki egészség megőrzésével, védelmével és fejlesztésével foglalkozó interdiszciplináris terület. Magyarországi meghatározó alakja Buda Béla. A mentálhigiéné nem csak a lelki betegségek megelőzését jelenti, hanem az egészséges, kiegyensúlyozott, teljes élet feltételeinek megteremtését: az önismeretet, a jó kapcsolatokat, a stressz kezelését, a krízisekkel való megküzdést."}, {"t": "p", "text": "A lelkileg egészséges ember jellemzői: reális énkép, önelfogadás, alkalmazkodóképesség, stressztűrő képesség, tartalmas kapcsolatok, alkotó munka, az élet értelmének érzése."}, {"t": "p", "text": "A mentálhigiénés tevékenység szintjei: a megelőzés (prevenció), a lelki egészség fejlesztése és a segítő kapcsolat (tanácsadás, támogatás)."}]}, {"h": "A család mint a mentálhigiéné tárgya", "blocks": [{"t": "p", "text": "A család a lelki egészség legfontosabb forrása – de egyben a lelki zavarok egyik fő kiváltója is lehet. A család mentálhigiénés feladatai:"}, {"t": "ul", "items": ["**érzelmi biztonság, feltétel nélküli elfogadás** nyújtása;", "az **ősbizalom és a biztonságos kötődés** megalapozása;", "**egészséges kommunikációs minták** – az érzelmek kifejezése, meghallgatás;", "a **stressz és a konfliktusok kezelésének mintája;**", "**a krízisek közös feldolgozása,** a családtagok támogatása;", "**egészséges életmód,** napirend, pihenés, közös szabadidő;", "**az önállóság és az önbizalom fejlesztése;**", "**határok, szabályok** biztosítása."]}]}, {"h": "A krízis fogalma", "blocks": [{"t": "p", "text": "A krízis (válság) olyan állapot, amikor az egyén vagy a család egy új, megterhelő helyzetbe kerül, és a megszokott problémamegoldó, alkalmazkodó módszerei nem elegendőek (Gerald Caplan). A krízis heves érzelmekkel, szorongással, tehetetlenségérzéssel jár. Időben korlátozott (általában 4–6 hét), és kimenetele kétféle lehet: a sikeres megküzdés a személyiség fejlődését, megerősödését eredményezi, a sikertelen pedig lelki zavarokhoz vezethet. A krízis tehát egyszerre **veszély és lehetőség.**"}]}, {"h": "Krízishelyzetek a családban", "blocks": [{"t": "ul", "items": ["**Fejlődési (normatív) krízisek:** az életciklus várható átmenetei – házasságkötés, gyermek születése, óvodába, iskolába lépés, serdülőkor, a gyermekek kirepülése, nyugdíjazás.", "**Váratlan (akcidentális, helyzeti) krízisek:** előre nem látható események – válás, súlyos betegség, baleset, haláleset, munkahely elvesztése, fogyatékos gyermek születése, költözés, elemi csapás, anyagi csőd, bűncselekmény áldozatává válás, szenvedélybetegség."]}, {"t": "p", "text": "A gyermek a családi krízisre gyakran magatartási változással reagál: visszahúzódás, szorongás, agresszió, regresszió (például újra bepisil), tanulmányi romlás, testi panaszok. A pedagógiai asszisztens feladata az ilyen jelek észlelése, a gyermek támogatása (türelem, meghallgatás, biztonságos környezet), és a tapasztalatok jelzése a pedagógusnak."}]}, {"h": "A hátrányos helyzetű gyermek", "blocks": [{"t": "p", "text": "A gyermekek védelméről és a gyámügyi igazgatásról szóló 1997. évi XXXI. törvény (Gyvt.) szerint **hátrányos helyzetű (HH)** az a gyermek, akinek rendszeres gyermekvédelmi kedvezményre való jogosultságát megállapították, és az alábbi körülmények közül **egy** fennáll:"}, {"t": "ul", "items": ["a szülő (szülők) alacsony iskolai végzettsége (legfeljebb általános iskola);", "a szülő alacsony foglalkoztatottsága (munkanélküliség);", "elégtelen lakókörnyezet, lakáskörülmények."]}, {"t": "p", "text": "**Halmozottan hátrányos helyzetű (HHH)** az a gyermek, akinél a felsorolt körülmények közül legalább **kettő** fennáll, valamint a nevelésbe vett gyermek és az utógondozói ellátásban részesülő fiatal felnőtt."}, {"t": "p", "text": "**Jellemzői az óvodában, iskolában:** hiányos felszerelés, ruházat, rendszertelen étkezés, kevés otthoni ösztönzés, szókincsbeli és tapasztalati hátrány, gyakoribb hiányzás, tanulási kudarcok, alacsony önértékelés. Az intézmény feladata a hátrányok kompenzálása: felzárkóztatás, ingyenes étkeztetés és tankönyv, tehetséggondozás, óvodai és iskolai fejlesztő programok, a szülőkkel való együttműködés."}]}, {"h": "A veszélyeztetett gyermek", "blocks": [{"t": "p", "text": "A Gyvt. szerint veszélyeztetettség az a – gyermek vagy más személy által tanúsított – magatartás, mulasztás vagy körülmény következtében kialakult állapot, amely a gyermek **testi, értelmi, érzelmi vagy erkölcsi fejlődését gátolja vagy akadályozza.**"}, {"t": "p", "text": "**Veszélyeztető tényezők:** elhanyagolás (fizikai, érzelmi), testi, lelki vagy szexuális bántalmazás, a szülők szenvedélybetegsége, családon belüli erőszak, a gyermek saját deviáns viselkedése (szerhasználat, csavargás), súlyos anyagi gondok, lakhatási problémák."}, {"t": "p", "text": "**Figyelmeztető jelek:** megmagyarázhatatlan sérülések, ápolatlanság, éhség, fáradtság, félelem, szorongás, visszahúzódás vagy agresszió, életkornak nem megfelelő viselkedés, gyakori hiányzás."}, {"t": "p", "text": "A nevelési-oktatási intézmény a **gyermekvédelmi jelzőrendszer** tagja: veszélyeztetettség gyanúja esetén **jelzési kötelezettsége** van a család- és gyermekjóléti szolgálat felé, súlyos, közvetlen veszély esetén azonnal a hatóság felé. A pedagógiai asszisztens tapasztalatát haladéktalanul jelzi a pedagógusnak, illetve az intézményvezetőnek."}]}, {"h": "A konfliktus fogalma és típusai", "blocks": [{"t": "p", "text": "A konfliktus egymással ellentétes érdekek, célok, vélemények, értékek vagy szükségletek ütközése. A konfliktus az élet természetes része, nem feltétlenül rossz: ha jól kezelik, fejlődést, tisztázást hozhat."}, {"t": "p", "text": "**Típusai a résztvevők szerint:**"}, {"t": "ul", "items": ["**intraperszonális (belső) konfliktus:** az egyénen belül, két ellentétes vágy, motívum között (Lewin: vonzó–vonzó, taszító–taszító, vonzó–taszító konfliktus);", "**interperszonális konfliktus:** két személy között;", "**csoporton belüli konfliktus;**", "**csoportok közötti konfliktus.**"]}, {"t": "p", "text": "**Kimenetele szerint:** konstruktív (építő) vagy destruktív (romboló)."}]}, {"h": "A család konfliktusai az óvodával, iskolával", "blocks": [{"t": "ul", "items": ["eltérő nevelési elvek, értékrend (például a szabályok, a büntetés kérdése);", "a gyermek értékelésével, jegyeivel kapcsolatos vita;", "a szülő túlzott elvárásai, vagy éppen közönye;", "a gyermekek közötti konfliktus, sérelem (például bántalmazás) kezelése;", "kommunikációs félreértések, a tájékoztatás hiánya;", "a szülő bizalmatlansága, rossz korábbi tapasztalatai az intézménnyel;", "étkezési, egészségügyi, öltözködési kérdések."]}]}, {"h": "Konfliktuskezelési stratégiák", "blocks": [{"t": "p", "text": "A Thomas–Kilmann-modell öt stratégiája (a saját és a másik fél érdekeinek érvényesítése szerint):"}, {"t": "ul", "items": ["**versengő (erőszakos):** a saját érdek érvényesítése a másik rovására („győztes–vesztes”);", "**alkalmazkodó (behódoló):** a saját érdek feladása a másik javára;", "**elkerülő:** a konfliktus megkerülése, elhalasztása – egyik fél érdeke sem érvényesül;", "**kompromisszumkereső:** kölcsönös engedmények, „félúton találkozás”;", "**problémamegoldó (együttműködő):** közösen keresett megoldás, amely mindkét fél érdekét kielégíti („győztes–győztes”)."]}, {"t": "p", "text": "Thomas Gordon a **„vesztes nélküli módszert”** javasolja: a probléma meghatározása, megoldási lehetőségek gyűjtése, értékelése, döntés, megvalósítás, ellenőrzés. Ehhez **aktív hallgatás** és **én-üzenetek** szükségesek. Az intézmény és a család közötti konfliktusban hasznos a nyugodt hangnem, a meghallgatás, a tényekre épülő beszélgetés és a közös cél – a gyermek érdekének – hangsúlyozása. A pedagógiai asszisztens a konfliktusokban nem dönt önállóan, hanem a pedagógushoz irányítja a szülőt."}]}, {"h": "A segítő szakemberek köre", "blocks": [{"t": "p", "text": "Pszichológus, iskolapszichológus, mentálhigiénés szakember, család- és gyermekjóléti szolgálat, iskolai szociális segítő, pedagógiai szakszolgálat, családterapeuta, mediátor, védőnő, háziorvos, gyermekpszichiáter, krízisintervenciós központok, telefonos lelkisegély-szolgálatok, gyámhatóság."}]}], "outline": ["Mentálhigiéné: a lelki egészség megőrzése, védelme, fejlesztése (Buda Béla).", "A család mentálhigiénés feladatai: érzelmi biztonság, stresszkezelési minta, kommunikáció, krízisek feldolgozása.", "Krízis: a megszokott alkalmazkodási módok kudarca egy új helyzetben (Caplan); fejlődési és váratlan (akcidentális) krízisek.", "Hátrányos helyzet: rendszeres gyermekvédelmi kedvezmény + iskolázatlanság, munkanélküliség vagy rossz lakáskörülmény; halmozottan hátrányos: legalább kettő, illetve nevelésbe vett gyermek.", "Veszélyeztetettség: a gyermek testi, értelmi, érzelmi, erkölcsi fejlődését gátló állapot.", "Konfliktus: ellentétes érdekek, célok ütközése; intraperszonális, interperszonális, csoporton belüli, csoportok közötti.", "Konfliktuskezelés: versengő, alkalmazkodó, elkerülő, kompromisszumkereső, problémamegoldó (Thomas–Kilmann)."], "cards": [{"q": "Mi a mentálhigiéné?", "a": "A lelki egészség megőrzésével, védelmével és fejlesztésével foglalkozó terület."}, {"q": "Mi a krízis Caplan szerint?", "a": "Olyan helyzet, amelyben a megszokott alkalmazkodási, problémamegoldó módok nem elegendőek."}, {"q": "Mi a különbség a fejlődési és a váratlan krízis között?", "a": "A fejlődési krízis az életciklus várható átmenete; a váratlan krízis előre nem látható esemény (válás, haláleset, betegség)."}, {"q": "Ki a halmozottan hátrányos helyzetű gyermek?", "a": "Akinél a rendszeres gyermekvédelmi kedvezmény mellett legalább két feltétel (alacsony iskolázottság, munkanélküliség, rossz lakáskörülmény) fennáll, valamint a nevelésbe vett gyermek."}, {"q": "Mi a veszélyeztetettség?", "a": "Olyan állapot, amely a gyermek testi, értelmi, érzelmi vagy erkölcsi fejlődését gátolja vagy akadályozza."}, {"q": "Melyek a Thomas–Kilmann konfliktuskezelési stratégiák?", "a": "Versengő, alkalmazkodó, elkerülő, kompromisszumkereső, problémamegoldó (együttműködő)."}], "cim": "Mentálhigiéné, krízis, hátrányos és veszélyeztetett helyzet, konfliktus", "temakor": "Családpedagógiai alapismeretek", "kerdes": "Ismertesse a mentálhigiéné fogalmát, valamint a család mentálhigiénés feladatait! Mutassa be a krízis fogalmát és a családi krízishelyzetek formáit! Értelmezze a hátrányos és a veszélyeztetett helyzet fogalmát, jellemzőit! Mutassa be a konfliktus fogalmát, típusait!", "kulcsszavak": ["A mentálhigiéné fogalma, jellemzői", "A család mint a mentálhigiéné tárgya", "A krízis fogalma, krízishelyzetek a családban", "A hátrányos helyzetű gyermek, tanuló", "Veszélyeztetett gyermek, tanuló", "A konfliktus fogalma, típusai", "A család konfliktusai az óvodával, iskolával", "Konfliktuskezelési stratégiák", "A segítő szakemberek köre"]}, {"n": 18, "sections": [{"h": "A szabadidő fogalma", "blocks": [{"t": "p", "text": "A szabadidő a nap azon része, amely a kötelező tevékenységek (munka, tanulás, házi feladat, közlekedés, alvás, étkezés, háztartási teendők) után fennmarad, és amelyet az ember szabadon, saját választása szerint, kedvére tölthet el. A gyermekek esetében a szabadidő a tanórákon és a kötelező foglalkozásokon kívüli idő."}]}, {"h": "A szabadidő funkciói, célja és jelentősége", "blocks": [{"t": "p", "text": "Joffre Dumazedier francia szociológus szerint a szabadidő három fő funkciója:"}, {"t": "ul", "items": ["**pihenés (regeneráció):** a testi és szellemi fáradtság kipihenése;", "**szórakozás, kikapcsolódás:** az unalom, a monotónia ellensúlyozása, élményszerzés;", "**a személyiség fejlesztése:** tanulás, művelődés, alkotás, a képességek kibontakoztatása."]}, {"t": "p", "text": "További funkciók: **szocializáció, közösségépítés** (barátságok, csoporthoz tartozás), **kompenzáció** (a kudarcok ellensúlyozása sikerélménnyel), **egészségmegőrzés** (mozgás, friss levegő), **prevenció** (a deviáns viselkedés megelőzése)."}, {"t": "p", "text": "A szabadidő-pedagógia célja, hogy a gyermekek megtanulják **tartalmasan, értelmesen, egészségesen** eltölteni a szabadidejüket, és ez életre szóló szokássá váljon."}]}, {"h": "A szabadidő-szervezés pedagógiai kérdései", "blocks": [{"t": "ul", "items": ["**Önkéntesség:** a gyermek választhasson, ne kényszerítve vegyen részt.", "**Az érdeklődésre építés:** a program a gyermekek igényeiből, ötleteiből induljon.", "**Az életkori és egyéni sajátosságok figyelembevétele.**", "**Változatosság:** a szellemi és a fizikai, az egyéni és a közösségi, a passzív és az aktív tevékenységek egyensúlya.", "**Aktív részvétel:** a gyermekek maguk is tervezzenek, szervezzenek.", "**Élményszerűség, sikerélmény.**", "**Közösségfejlesztés, együttműködés.**", "**Biztonság, felügyelet, balesetvédelem.**", "**Esélyegyenlőség:** a programok legyenek mindenki számára elérhetők (költségek!).", "**Tudatos médiahasználat:** a képernyő előtt töltött idő mértéke, minősége."]}]}, {"h": "A szabadidő-szervezést befolyásoló tényezők", "blocks": [{"t": "ul", "items": ["**életkor és fejlettség;**", "**a család anyagi helyzete, kulturális szintje, értékrendje;**", "**lakóhely** (város vagy falu, a programlehetőségek elérhetősége);", "**az intézmény lehetőségei:** helyiségek, eszközök, szakemberek, pénzügyi források;", "**a gyermek érdeklődése, képességei, egészségi állapota;**", "**a rendelkezésre álló idő** (a tanulmányi terhelés, a napközi, a közlekedés);", "**kortárscsoport, divat, média, digitális eszközök;**", "**évszak, időjárás.**"]}]}, {"h": "A szabadidő szemléletformáló hatása, a családi minta", "blocks": [{"t": "p", "text": "A szabadidő eltöltésének módja tükrözi és formálja az értékrendet: aki gyermekkorában megtapasztalja az olvasás, a kirándulás, a sport, a zene örömét, az felnőttként is keresni fogja ezeket. A gyermek elsősorban a **családi mintát** követi: ha a szülők olvasnak, sportolnak, kirándulnak, múzeumba járnak, a gyermek is ezt tartja természetesnek; ha a család szabadidejét főként a televízió vagy a képernyő előtt tölti, a gyermek is ezt a mintát veszi át. Az intézmény szerepe, hogy új mintákat mutasson, és kompenzálja a családi hátrányokat."}]}, {"h": "Az intézményen belüli és kívüli szabadidős tevékenységek", "blocks": [{"t": "p", "text": "**Intézményen belüli:** napközi, tanulószoba, szakkörök (rajz, kézműves, informatika, dráma), sportkörök, énekkar, iskolai könyvtár, klubfoglalkozások, vetélkedők, versenyek, iskolai rendezvények (farsang, sportnap, egészségnap), diákönkormányzati programok."}, {"t": "p", "text": "**Intézményen kívüli:**"}, {"t": "ul", "items": ["**kulturális programok:** színház, bábszínház, mozi, hangverseny, múzeum, kiállítás, könyvtárlátogatás;", "**kirándulások:** tanulmányi, osztály- és túrakirándulás, erdei iskola, osztálykirándulás – közösségépítés, természetismeret, honismeret;", "**sport:** úszás, korcsolyázás, versenyek, sportegyesületek;", "**táborok, szünidei programok:** nyári tábor, napközis tábor, tematikus táborok."]}, {"t": "p", "text": "**A szünidei programok jelentősége:** a hosszú szünidő alatt sok gyermek felügyelet nélkül marad, vagy ingerszegény környezetben tölti az idejét. A szünidei programok biztosítják a felügyeletet, a tartalmas időtöltést, a közösségi élményt, a hátrányos helyzetű gyermekeknél az étkezést és az élményszerzést, és megelőzik a deviáns viselkedést."}]}, {"h": "A szülőkkel történő kapcsolattartás formái", "blocks": [{"t": "ul", "items": ["**Szülői értekezlet:** az osztály, csoport szüleinek közös tájékoztatása (félévente legalább egyszer; év eleji, félévi, év végi; rendkívüli). Témái: a tanév rendje, követelmények, programok, közös ügyek. Szervezése: időpont-egyeztetés, meghívó, helyiség, napirend, jegyzőkönyv vagy emlékeztető.", "**Fogadóóra:** egyéni, négyszemközti beszélgetés a szülő és a pedagógus között a gyermek fejlődéséről, eredményeiről, problémáiról. Szervezése: időpontok kiírása, beosztás, nyugodt, diszkrét környezet.", "**Nyílt nap:** a szülők betekinthetnek a foglalkozásokba, tanórákba, megismerhetik az intézmény életét. Szervezése: meghirdetés, a program összeállítása, a vendégek fogadása.", "További formák: családlátogatás, írásbeli tájékoztatás (üzenőfüzet, e-napló, e-mail), közös családi programok (családi nap, kirándulás, ünnepségek), szülői szervezet (szülői munkaközösség)."]}]}, {"h": "A pedagógiai asszisztens feladatai a programokhoz kapcsolódóan", "blocks": [{"t": "p", "text": "**Előkészítés:**"}, {"t": "ul", "items": ["részvétel a program tervezésében, ötletekkel;", "információgyűjtés (időpont, helyszín, költség, közlekedés, nyitvatartás);", "a szülők értesítése, beleegyező nyilatkozatok, befizetések összegyűjtése (a pedagógus irányításával);", "eszközök, anyagok, díszletek beszerzése és előkészítése;", "a gyermekek felkészítése, balesetvédelmi oktatásban való segítés;", "a helyszín berendezése, meghívók, plakátok készítése."]}, {"t": "p", "text": "**Lebonyolítás:**"}, {"t": "ul", "items": ["a gyermekek felügyelete, létszám ellenőrzése, balesetek megelőzése;", "segítségnyújtás a rászoruló, SNI-s gyermekeknek;", "a program szervezési feladatainak segítése (étkezés, közlekedés, szünetek);", "a fegyelem és a jó hangulat fenntartása, a gyermekek bevonása;", "szükség esetén elsősegély, a pedagógus értesítése."]}, {"t": "p", "text": "**A programot követően:**"}, {"t": "ul", "items": ["a helyszín rendbetétele, az eszközök elpakolása;", "az élmények közös feldolgozása (beszélgetés, rajz, fotók, kiállítás);", "elszámolás, adminisztrációban való segítés;", "a tapasztalatok értékelése a pedagógussal, javaslatok a jövőre."]}]}], "outline": ["Szabadidő: a kötelezettségeken (munka, tanulás, létfenntartás) kívüli, szabadon felhasználható idő.", "Funkciók (Dumazedier): pihenés, szórakozás, személyiségfejlesztés; + szocializáció, kompenzáció.", "Szabadidő-szervezés: önkéntesség, érdeklődésre épülés, változatosság, életkori sajátosságok, biztonság.", "Befolyásoló tényezők: életkor, család anyagi és kulturális helyzete, lakóhely, intézményi lehetőségek, érdeklődés, egészség, média.", "Családi minta: a gyermek a szülők szabadidős szokásait veszi át.", "Programok: kulturális (színház, múzeum, könyvtár), kirándulás, sport, szakkör, tábor, szünidei programok.", "Szülőkkel: szülői értekezlet, fogadóóra, nyílt nap, családi programok.", "Asszisztens: előkészítés, lebonyolítás, utómunka."], "cards": [{"q": "Mi a szabadidő?", "a": "A kötelező tevékenységeken túl fennmaradó, szabadon felhasználható idő."}, {"q": "Melyek Dumazedier szerint a szabadidő funkciói?", "a": "Pihenés, szórakozás, a személyiség fejlesztése."}, {"q": "Soroljon fel a szabadidő-szervezést befolyásoló tényezőket!", "a": "Életkor, a család anyagi és kulturális helyzete, lakóhely, intézményi lehetőségek, érdeklődés, egészség, idő, média."}, {"q": "Miért fontosak a szünidei programok?", "a": "Felügyeletet, tartalmas időtöltést, élményt, közösséget adnak, és megelőzik a deviáns viselkedést."}, {"q": "Mi a különbség a szülői értekezlet és a fogadóóra között?", "a": "A szülői értekezlet közös csoportos tájékoztatás; a fogadóóra egyéni, négyszemközti beszélgetés."}, {"q": "Mik az asszisztens feladatai egy program után?", "a": "Rendrakás, az élmények feldolgozása, elszámolás, adminisztráció, értékelés a pedagógussal."}], "cim": "A szabadidő és a szabadidő-szervezés", "temakor": "Szabadidő-pedagógia", "kerdes": "Jellemezze a szabadidő fogalmát, célját, jelentőségét! Mutassa be a szabadidő-szervezés pedagógiai kérdéseit, valamint a szabadidő szervezését befolyásoló tényezőket! Ismertesse az intézményen belüli és kívüli szabadidős tevékenységek típusait, a pedagógiai asszisztens programokhoz kapcsolódó feladatait!", "kulcsszavak": ["Szabadidő fogalma, funkciói", "A szabadidő-szervezés célja, feladata, pedagógiai kérdései", "A szabadidő-szervezést befolyásoló tényezők", "A szabadidő szemléletformáló hatása, a családi minta jelentősége", "Kulturális programok", "Kirándulások", "A szünidei programok jelentősége", "A szülőkkel történő kapcsolattartás formái: szülői értekezlet, fogadóóra, nyílt nap", "A pedagógiai asszisztens feladatai a programok előkészítésében, lebonyolításában és a programot követően"]}, {"n": 19, "sections": [{"h": "Az ünnep fogalma", "blocks": [{"t": "p", "text": "Az ünnep a hétköznapokból kiemelkedő, különleges alkalom, amelyen egy közösség valamilyen jelentős eseményre, személyre emlékezik, vagy egy örömteli eseményt közösen megél. Az ünnepnek mindig van tartalma (miről emlékezünk, mit ünneplünk), formája (szokások, rítusok, jelképek) és hangulata (emelkedettség, öröm). A jeles nap a népi kalendárium kiemelt napja, amelyhez szokások, hiedelmek kapcsolódnak."}]}, {"h": "Az óvodai, iskolai ünnepek, megemlékezések típusai", "blocks": [{"t": "p", "text": "**Nemzeti ünnepek és megemlékezések:**"}, {"t": "ul", "items": ["**március 15.** – az 1848–49-es forradalom és szabadságharc ünnepe;", "**augusztus 20.** – az államalapítás, Szent István király ünnepe (a nyári szünetre esik, de a tanévben is megjelenik);", "**október 23.** – az 1956-os forradalom és szabadságharc ünnepe;", "**megemlékezések:** október 6. (az aradi vértanúk, nemzeti gyásznap), február 25. (a kommunista diktatúrák áldozatainak emléknapja), április 16. (a holokauszt áldozatainak emléknapja), június 4. (a Nemzeti Összetartozás Napja, a trianoni békediktátum évfordulója)."]}, {"t": "p", "text": "**Naptári (egyházi és népi) ünnepek:** Márton-nap (november 11.), advent, Mikulás (december 6.), Luca-nap (december 13.), karácsony, újév, vízkereszt, farsang, húsvét, anyák napja (május első vasárnapja), pünkösd, gyermeknap (május utolsó vasárnapja)."}, {"t": "p", "text": "**A természet ünnepei (zöld jeles napok):** a víz világnapja (március 22.), a Föld napja (április 22.), a madarak és fák napja (május 10.), a környezetvédelmi világnap (június 5.), az állatok világnapja (október 4.), az évszakváltások."}, {"t": "p", "text": "**Intézményi ünnepek, hagyományok:** tanévnyitó, tanévzáró, ballagás, évzáró, az iskola névadójának napja, sportnap, egészségnap, a magyar kultúra napja (január 22.), a magyar költészet napja (április 11.)."}, {"t": "p", "text": "**Magánjellegű ünnepek:** születésnap, névnap, a családi ünnepek – az óvodában, iskolában a gyermek születésnapjának, névnapjának megünneplése."}]}, {"h": "Az ünnepek jelentősége a gyermek életében", "blocks": [{"t": "ul", "items": ["**Érzelmi élményt** adnak: várakozás, készülődés, öröm, emelkedettség.", "**Közösséget építenek:** a közös készülődés, szereplés összeköti a gyermekeket, a pedagógusokat és a családokat.", "**Hagyományt, identitást** közvetítenek: a nemzeti, a helyi és a családi hovatartozás érzését erősítik.", "**Ritmust adnak** az évnek: a gyermek az ünnepeken keresztül éli meg az idő múlását, az évszakok körforgását.", "**Ismereteket** nyújtanak a történelemről, a néphagyományokról, a természetről.", "**Képességeket fejlesztenek:** szereplés, éneklés, versmondás, kézműves alkotás, együttműködés.", "**Erkölcsi és érzelmi nevelés:** hála, tisztelet, szeretet, adakozás, gondoskodás."]}, {"t": "p", "text": "Fontos, hogy az ünnep tartalma az életkornak megfelelő legyen: az óvodában a családias, élményszerű, cselekvésre épülő formák, az iskolában fokozatosan a tartalmasabb, megemlékező formák is."}]}, {"h": "Ünnepekhez kapcsolódó népszokások, hagyományok", "blocks": [{"t": "ul", "items": ["**Márton-nap:** lámpás felvonulás, libaétel; „aki Márton-napon libát nem eszik, egész évben éhezik”.", "**Advent:** adventi koszorú, gyertyagyújtás, várakozás.", "**Luca-nap:** Luca-szék készítése, Luca-búza ültetése (ha kizöldül karácsonyra, bő termés lesz), kotyolás.", "**Karácsony:** betlehemezés, kántálás, regölés, mézeskalács, karácsonyfa.", "**Farsang:** alakoskodás, maszkos, jelmezes felvonulás, télűzés (Mohácson a busójárás – az UNESCO szellemi kulturális örökségének része), fánksütés, kiszebáb-égetés.", "**Húsvét:** tojásfestés, hímes tojás, locsolkodás, locsolóversek, kalácssütés.", "**Május 1.:** májusfaállítás.", "**Pünkösd:** pünkösdi királyválasztás, pünkösdi királynéjárás.", "**Szent Iván-éj (június 24.):** tűzgyújtás, tűzugrás, a nyári napforduló ünnepe.", "**Szüret:** szüreti felvonulás, mulatság."]}]}, {"h": "Néprajzi értékeink", "blocks": [{"t": "p", "text": "A néprajzi értékek a magyar népi kultúra kincsei, amelyek az ünnepeken keresztül is átadhatók a gyermekeknek: **népdalok, népi gyermekjátékok, mondókák, kiszámolók, népmesék, néptánc, népi hangszerek, népi kézművesség** (hímzés, fazekasság, szövés, csuhéfonás, nemezelés, gyöngyfűzés), a **népviselet** és a népi ételek. Ide tartoznak a hungarikumok és a Magyar Értéktár elemei is. Az óvodákban a jeles napok és a népi hagyományok ápolása az óvodai nevelés országos alapprogramjának is része. A hagyományőrzés erősíti a nemzeti identitást és a közösséghez tartozás érzését."}]}, {"h": "A pedagógiai asszisztens feladatai", "blocks": [{"t": "p", "text": "**Az ünnepek előkészítése:**"}, {"t": "ul", "items": ["részvétel a műsor, a program tervezésében;", "segítség a gyermekek felkészítésében (versek, dalok gyakorlása, jelmezek, kellékek);", "dekoráció, díszletek, meghívók, plakátok készítése a gyermekekkel közösen;", "a terem, a helyszín berendezése, a technikai eszközök előkészítése;", "kézműves foglalkozások szervezésében segítés (ajándékkészítés anyák napjára, adventi koszorú, tojásfestés);", "a szülők tájékoztatásában való közreműködés (ünneplő ruha, időpont)."]}, {"t": "p", "text": "**Az ünnepély lebonyolítása:**"}, {"t": "ul", "items": ["a gyermekek felügyelete, sorba állítása, a szereplők segítése, „súgás”;", "a vendégek fogadása, ültetése;", "a technikai feltételek biztosítása (zene, mikrofon, világítás);", "az izguló, szorongó gyermekek megnyugtatása; az SNI-s gyermekek segítése;", "a rend és a megfelelő hangulat biztosítása."]}, {"t": "p", "text": "**Az ünnepélyt követően:**"}, {"t": "ul", "items": ["a helyszín rendbetétele, a dekoráció, eszközök elpakolása, tárolása;", "az élmények feldolgozása a gyermekekkel (beszélgetés, rajz, fotók, faliújság);", "a tapasztalatok megbeszélése a pedagógussal;", "dokumentálás (fényképek, beszámoló) a pedagógus irányításával, az adatvédelmi szabályok betartásával."]}]}], "outline": ["Ünnep: a hétköznapokból kiemelkedő, emlékező vagy örömteli közösségi alkalom.", "Típusok: nemzeti ünnepek és megemlékezések; naptári (egyházi-népi) ünnepek; a természet ünnepei; intézményi ünnepek; magánjellegű ünnepek.", "Nemzeti: március 15., augusztus 20., október 23.; megemlékezések: október 6., február 25., április 16., június 4.", "Naptári: Mikulás, advent, karácsony, farsang, húsvét, anyák napja, gyermeknap, pünkösd.", "Természet: víz világnapja, Föld napja, madarak és fák napja, állatok világnapja.", "Magán: születésnap, névnap.", "Jelentőség: közösség, identitás, hagyomány, érzelmi élmény, ritmus.", "Népszokások: Luca-nap, betlehemezés, farsangi alakoskodás, locsolkodás, májusfa, pünkösdölés, Szent Iván-éj, Márton-nap.", "Asszisztens: előkészítés, lebonyolítás, utómunka."], "cards": [{"q": "Melyek a nemzeti ünnepek?", "a": "Március 15., augusztus 20., október 23."}, {"q": "Mire emlékezünk október 6-án?", "a": "Az aradi vértanúkra – nemzeti gyásznap."}, {"q": "Soroljon fel a természethez kapcsolódó jeles napokat!", "a": "Víz világnapja (márc. 22.), Föld napja (ápr. 22.), madarak és fák napja (máj. 10.), állatok világnapja (okt. 4.)."}, {"q": "Milyen szokás kapcsolódik a Luca-naphoz?", "a": "Luca-szék készítése, Luca-búza ültetése."}, {"q": "Miért fontosak az ünnepek a gyermek életében?", "a": "Érzelmi élményt adnak, közösséget építenek, hagyományt és identitást közvetítenek, ritmust adnak az évnek."}, {"q": "Mi a busójárás?", "a": "Mohácsi farsangi télűző, maszkos népszokás – az UNESCO szellemi kulturális örökségének része."}], "cim": "Jeles napok és ünnepek", "temakor": "Szabadidő-pedagógia", "kerdes": "Jeles napok és ünnepek. Mutassa be az óvodai és iskolai ünnepek típusait, jelentőségét! Ismertesse a pedagógiai asszisztens ünnepekhez kapcsolódó feladatait!", "kulcsszavak": ["Az óvodai, iskolai ünnepek, megemlékezések típusai", "A naptári ünnepek", "A természet ünnepei", "Magánjellegű ünnepek", "Az ünnepek jelentősége a gyermek életében", "Ünnepekhez kapcsolódó népszokások, hagyományok", "Néprajzi értékeink", "A pedagógiai asszisztens feladatai az ünnepélyek előkészületeiben, lebonyolításában és az ünnepélyeket követően"]}, {"n": 20, "sections": [{"h": "A játék fogalma", "blocks": [{"t": "p", "text": "A játék a gyermek legfontosabb, legjellemzőbb tevékenysége, amelyet önként, örömmel, önmagáért végez. Johan Huizinga holland kultúrtörténész szerint a játék olyan szabad cselekvés, amely meghatározott idő- és térbeli határok között, önként vállalt szabályok szerint folyik, célja önmagában van, és feszültség, öröm érzése kíséri, valamint annak tudata, hogy „másként van”, mint a mindennapi élet."}, {"t": "p", "text": "**A játék jellemzői:**"}, {"t": "ul", "items": ["**önkéntes:** a gyermek belső késztetésből játszik;", "**örömforrás:** a tevékenység maga okoz örömet;", "**nem a végeredmény a fontos,** hanem maga a folyamat;", "**a valóság és a képzelet** sajátos keveredése („mintha”);", "**aktív, cselekvő, kreatív;**", "**belső motivációjú;**", "**szabályok** jellemzik (kimondott vagy ki nem mondott szabályok)."]}]}, {"h": "A játék objektív és szubjektív feltételei", "blocks": [{"t": "p", "text": "**Objektív (tárgyi) feltételek:**"}, {"t": "ul", "items": ["**idő:** elegendő, nyugodt, nem töredezett játékidő;", "**hely:** biztonságos, megfelelő méretű, kuckókkal, játszósarkokkal kialakított tér, udvar;", "**eszközök:** az életkornak megfelelő, biztonságos, sokoldalúan használható, esztétikus, szabadon elérhető játékszerek; félkész és természetes anyagok is;", "**tapasztalat, élmény:** a gyermek a megélt élményeit játssza el, ezért szükség van élményekre (kirándulás, mese, megfigyelés)."]}, {"t": "p", "text": "**Szubjektív (személyi) feltételek:**"}, {"t": "ul", "items": ["**nyugodt, szeretetteljes, elfogadó légkör;**", "**a felnőtt pozitív attitűdje,** türelme, tapintatos jelenléte;", "**a játszótársak,** a jó csoportlégkör;", "**a gyermek testi-lelki állapota:** kipihent, egészséges, érzelmi biztonságban lévő gyermek tud elmélyülten játszani."]}]}, {"h": "A játékfajták és jelentőségük", "blocks": [{"t": "ul", "items": ["**Gyakorló (funkciós) játék:** a mozgások, cselekvések, hangok ismételgetése a működés öröméért (csörgő rázása, homok szórása, lépcsőn fel-le járás). Fejleszti a mozgást, az érzékelést, az ok-okozati összefüggések felismerését. Csecsemő- és kisgyermekkorban uralkodó.", "**Szimbolikus (mintha) játék és szerepjáték:** a gyermek tárgyakat, helyzeteket, szerepeket helyettesít (a doboz autó, a baba beteg). A szerepjátékban felnőtt szerepeket játszik el (anyuka, orvos, boltos). Fejleszti a képzeletet, a beszédet, az érzelmi feldolgozást (a félelmetes élmények „eljátszása”), a szociális szerepek megértését. Óvodáskorban a legjelentősebb.", "**Konstrukciós (építő) játék:** építés, összerakás, alkotás (kocka, LEGO, homokvár). Fejleszti a finommotorikát, a téri tájékozódást, a gondolkodást, a kitartást, a kreativitást.", "**Szabályjáték:** előre rögzített szabályok szerinti játék (fogócska, társasjáték, sportjáték). Fejleszti a szabálytudatot, az önuralmat, a kudarctűrést, a versenyszellemet és az együttműködést. Az óvodáskor végétől, kisiskoláskortól meghatározó.", "**Bábozás és dramatizálás:** mesék, történetek eljátszása; fejleszti a beszédet, az önkifejezést, segíti a gátlások oldását.", "**Barkácsolás, kézműves tevékenység:** alkotó, tárgykészítő tevékenység."]}]}, {"h": "A játéktevékenység fejlődése az életkori szakaszokban", "blocks": [{"t": "ul", "items": ["**Csecsemőkor:** manipuláció (a tárgyak szájba vétele, ütögetése, dobálása), gyakorló játék; a felnőttel közös játékok (kukucs, höcögtetők, mondókák).", "**Kisgyermekkor (1–3 év):** gyakorló játék, majd megjelenik az utánzó és a szimbolikus játék; a játék még nagyrészt **magányos** vagy **párhuzamos** (a gyermekek egymás mellett, de nem együtt játszanak).", "**Óvodáskor (3–6/7 év):** a szerepjáték kibontakozik és kiteljesedik, egyre bonyolultabb, hosszabb; megjelenik a konstrukciós játék, a bábozás, a dramatizálás, és az óvodáskor végén a szabályjáték. A játék egyre inkább **társas, kooperatív.**", "**Kisiskoláskor:** a szabályjátékok, a csapatjátékok, a társasjátékok, a sport, a gyűjtögetés kerülnek előtérbe.", "**Serdülőkor:** sport, társasági és stratégiai játékok, számítógépes játékok – fontos a tudatos és mértékletes használat."]}, {"t": "p", "text": "Mildred Parten a játék társas fejlődésének szakaszait írta le: tétlen viselkedés, magányos játék, szemlélődő viselkedés, párhuzamos játék, társuló játék, együttműködő (kooperatív) játék."}]}, {"h": "A játék személyiségre gyakorolt hatása", "blocks": [{"t": "ul", "items": ["**testi fejlődés:** mozgáskoordináció, erőnlét, finommotorika;", "**értelmi fejlődés:** észlelés, figyelem, emlékezet, képzelet, gondolkodás, problémamegoldás, kreativitás;", "**beszédfejlődés:** szókincs, kommunikáció, mondatalkotás;", "**érzelmi fejlődés:** öröm, a feszültségek, félelmek feldolgozása, érzelemszabályozás;", "**akarati tulajdonságok:** kitartás, önuralom, szabálytartás, kudarctűrés;", "**szociális fejlődés:** együttműködés, alkalmazkodás, empátia, konfliktuskezelés;", "**énkép, önbizalom:** a sikerélmény, a kompetencia érzése."]}, {"t": "p", "text": "A játék tehát a személyiség egészét fejleszti; a gyermek a játékban „tanul meg élni”."}]}, {"h": "A játék és a tanulás kapcsolata", "blocks": [{"t": "p", "text": "A kisgyermek elsősorban játék közben tanul: tapasztalatokat szerez, kipróbál, utánoz, gyakorol, felfedez. A játékban történő tanulás spontán, élményszerű, belső motiváción alapul, ezért nagyon hatékony. Az óvodában a tanulás játékba ágyazott, az iskolában pedig a **didaktikai játékok,** a játékos feladatok és a mozgásos tevékenységek segítik a tanulást, különösen az alsó tagozatban. A játékos tanulás növeli a motivációt, a figyelmet, csökkenti a szorongást, és segíti az ismeretek tartós bevésődését. A különbség: a játék célja önmagában van, a tanulásé egy eredmény elérése – a jó pedagógiai gyakorlat a kettőt összeköti."}]}, {"h": "A játék szerepe a társas kapcsolatok alakulásában", "blocks": [{"t": "p", "text": "A közös játékban a gyermek megtanul kapcsolatot teremteni, közös célokat kitűzni, szerepeket elosztani, megegyezni, alkalmazkodni, a sorára várni, veszíteni és nyerni, segíteni és segítséget elfogadni. A játékban alakulnak ki az első barátságok, kirajzolódnak a csoporton belüli pozíciók (kezdeményező, vezető, követő). A konfliktusok a játékban természetesen jelentkeznek, és ezek megoldása fejleszti a szociális készségeket. A szerepjáték révén a gyermek beleéli magát mások helyzetébe – így fejlődik az empátia."}]}, {"h": "A pedagógiai asszisztens szerepe a játékban", "blocks": [{"t": "ul", "items": ["**biztosítja a játék feltételeit:** időt, helyet, eszközöket, nyugodt légkört;", "**élményeket nyújt,** amelyekből a játék táplálkozhat;", "**mintát ad,** szükség esetén bekapcsolódik a játékba, ötletet ad, de nem irányítja és nem zavarja meg az elmélyült játékot;", "**segíti** a visszahúzódó, a nehezen bekapcsolódó és az SNI-s gyermekek játékba való bevonását;", "**megfigyeli** a gyermekek játékát (fejlődés, kapcsolatok, problémák), és tapasztalatait megosztja a pedagógussal;", "**figyel a biztonságra,** a balesetek megelőzésére, a játékszerek épségére és tisztaságára;", "**segít a konfliktusok kezelésében,** a szabályok betartatásában;", "**szervez** udvari és csoportos játékokat, népi gyermekjátékokat a pedagógus útmutatása szerint."]}]}], "outline": ["Játék: önkéntes, örömteli, önmagáért végzett, belső motivációjú tevékenység (Huizinga).", "Feltételek: objektív (idő, hely, eszköz, tapasztalat) és szubjektív (légkör, felnőtt attitűd, társak, a gyermek állapota).", "Játékfajták: gyakorló (funkciós), szimbolikus és szerepjáték, konstrukciós (építő), szabályjáték; bábozás, dramatizálás.", "Fejlődés: manipuláció → gyakorló → szimbolikus → szerepjáték → szabályjáték; magányos → párhuzamos → társas (Parten).", "Hatás: mozgás, értelem, beszéd, érzelem, akarat, szociális készségek.", "Játék és tanulás: játékos tanulás; a játék a kisgyermek legfőbb tanulási formája.", "Társas kapcsolatok: együttműködés, szabálykövetés, konfliktuskezelés, szerepek.", "Asszisztens: feltételek biztosítása, minta, bekapcsolódás, megfigyelés, segítés."], "cards": [{"q": "Hogyan határozta meg Huizinga a játékot?", "a": "Szabad cselekvés meghatározott idő- és térbeli keretek között, önként vállalt szabályok szerint, célja önmagában van, öröm kíséri."}, {"q": "Melyek a játék objektív feltételei?", "a": "Idő, hely, eszközök, tapasztalat-élmény."}, {"q": "Melyek a fő játékfajták?", "a": "Gyakorló, szimbolikus és szerepjáték, konstrukciós, szabályjáték (valamint bábozás, dramatizálás)."}, {"q": "Mikor a legjelentősebb a szerepjáték?", "a": "Óvodáskorban."}, {"q": "Mi a párhuzamos játék?", "a": "A gyermekek egymás mellett, hasonló tevékenységet folytatva, de nem együtt játszanak."}, {"q": "Mi a pedagógiai asszisztens szerepe a játékban?", "a": "Feltételek biztosítása, mintaadás, bevonás, megfigyelés, biztonság, konfliktuskezelés segítése."}], "cim": "A játék", "temakor": "Szabadidő-pedagógia", "kerdes": "Ismertesse a játék fogalmát, jellemezze a játékfajtákat és jelentőségüket a gyermek fejlődésében! Értelmezze a játék és tanulás kapcsolatát, valamint mutassa be a játék szerepét a társas kapcsolatok alakulásában!", "kulcsszavak": ["A játék fogalma", "A játék objektív és szubjektív feltételei", "A játéktevékenység fejlődése a különböző életkori szakaszokban", "A játék személyiségre gyakorolt hatása", "A játék és tanulás kapcsolata", "A pedagógiai asszisztens szerepe a gyermek játéktevékenységében"]}, {"n": 21, "sections": [{"h": "A kommunikáció fogalma", "blocks": [{"t": "p", "text": "A kommunikáció a latin „communicare” (közössé tenni, közölni) szóból ered. Jelentése: információ, gondolatok, érzések, szándékok cseréje két vagy több személy között, jelek, jelrendszerek segítségével. A kommunikáció kölcsönös folyamat: nemcsak közlés, hanem kapcsolat is; az ember nem tud nem kommunikálni (Paul Watzlawick) – a hallgatás, a testtartás is üzenet."}]}, {"h": "A kommunikáció tényezői", "blocks": [{"t": "ul", "items": ["**Adó (közlő):** aki az üzenetet küldi.", "**Vevő (befogadó):** aki az üzenetet fogadja.", "**Üzenet (közlemény):** az átadott tartalom.", "**Kód:** a jelrendszer (nyelv, gesztusok, jelnyelv, írás), amelyet mindkét félnek ismernie kell.", "**Csatorna:** az út, amelyen az üzenet halad (hang, látvány, írás, telefon, internet).", "**Kontextus (beszédhelyzet):** a körülmények – hely, idő, a felek viszonya.", "**Zaj:** minden, ami zavarja az üzenet átadását (fizikai zaj, figyelmetlenség, előítélet, eltérő szóhasználat).", "**Visszajelzés (visszacsatolás):** a vevő reakciója, amely megmutatja, hogyan értette az üzenetet."]}, {"t": "p", "text": "(Roman Jakobson modellje szerint a tényezők: adó, vevő, üzenet, kód, csatorna, valóság/kontextus.)"}]}, {"h": "A kommunikáció típusai", "blocks": [{"t": "ul", "items": ["**a résztvevők szerint:** intraperszonális (belső beszéd), interperszonális (két személy), csoportkommunikáció, tömegkommunikáció;", "**az irány szerint:** egyirányú (előadás, hirdetmény) és kétirányú (beszélgetés);", "**a közvetítés módja szerint:** közvetlen (személyes, szemtől szembe) és közvetett (telefon, levél, e-mail, közösségi média);", "**a jelrendszer szerint:** verbális (nyelvi) és nonverbális (nem nyelvi);", "**a helyzet szerint:** formális (hivatalos) és informális (baráti)."]}]}, {"h": "A kommunikáció csatornái", "blocks": [{"t": "p", "text": "A kommunikáció csatornái egyrészt a **fizikai, technikai csatornák** (hang, kép, írás, telefon, digitális eszközök), másrészt a nonverbális kommunikáció jelzései, amelyeket szintén csatornáknak nevezünk: vokális jelek, arcjáték, tekintet, gesztusok, testtartás, térközszabályozás, testi érintés, külső megjelenés."}]}, {"h": "A verbális kommunikáció", "blocks": [{"t": "p", "text": "A verbális kommunikáció a nyelv – a szavak, mondatok – segítségével történő közlés, szóban vagy írásban. Eszköze a nyelv, amely a legpontosabb és legárnyaltabb jelrendszer: alkalmas elvont gondolatok, múlt és jövő kifejezésére is. A hatékony verbális közlés jellemzői:"}, {"t": "ul", "items": ["**érthető, egyszerű, pontos szóhasználat** – a hallgatóhoz igazítva;", "**logikus felépítés;**", "**megfelelő hangnem, udvariasság;**", "**helyes kiejtés, nyelvhelyesség;**", "**a beszédhelyzethez illő stílus** (gyermekkel, szülővel, kollégával)."]}]}, {"h": "A nonverbális kommunikáció", "blocks": [{"t": "p", "text": "A nonverbális kommunikáció a nem nyelvi jelekkel történő közlés. Elsősorban az érzelmeket, a viszonyulást és az attitűdöket fejezi ki, és sokszor hitelesebb a szavaknál. Ha a verbális és a nonverbális üzenet ellentmond egymásnak, többnyire a nonverbálisnak hiszünk. Csatornái:"}, {"t": "ul", "items": ["**vokális (paralingvisztikai) jelek:** hangerő, hangszín, hanglejtés, hangsúly, beszédtempó, szünetek;", "**mimika (arcjáték):** az alapérzelmek (öröm, bánat, düh, félelem, meglepetés, undor) arckifejezései egyetemesek;", "**tekintet (szemkontaktus):** figyelmet, érdeklődést, őszinteséget jelez; kerülése zavart, bizonytalanságot;", "**gesztusok:** kéz- és fejmozgások, amelyek kísérik vagy helyettesítik a beszédet;", "**testtartás:** nyitott vagy zárt, feszült vagy laza;", "**térközszabályozás (proxemika):** Edward T. Hall szerint az intim (0–45 cm), a személyes (45–120 cm), a társasági (120–360 cm) és a nyilvános (360 cm felett) távolság;", "**testi érintés:** kézfogás, simogatás, ölelés – kisgyermekeknél a biztonság fontos forrása, de mindig tapintattal;", "**külső megjelenés:** öltözködés, hajviselet, ápoltság."]}]}, {"h": "A metakommunikáció és a külső megjelenés", "blocks": [{"t": "p", "text": "A metakommunikáció a „kommunikáció a kommunikációról”: az a nonverbális kísérőjelzés, amely megmutatja, hogyan kell értelmezni az üzenetet (komolyan, tréfásan, szeretettel). A **külső megjelenés is metakommunikáció:** üzen arról, milyennek látjuk magunkat, mennyire tiszteljük a másikat és a helyzetet."}, {"t": "p", "text": "**A pedagógiai asszisztens megjelenése:** ápolt, tiszta, egyszerű, kényelmes, a munkához illő (mozgást engedő, nem kihívó) öltözet; mérsékelt smink és ékszer (biztonsági okokból is – a gyermekek belekapaszkodhatnak); rövid, ápolt köröm; zárt, kényelmes cipő; ünnepélyeken alkalomhoz illő ruha. A megjelenés mintát ad a gyermekeknek, és bizalmat kelt a szülőkben."}]}, {"h": "Kommunikációs technikák", "blocks": [{"t": "ul", "items": ["**Aktív hallgatás:** figyelem, szemkontaktus, bólintás, visszakérdezés, a másik érzéseinek visszatükrözése.", "**Én-üzenet (Thomas Gordon):** a saját érzés kifejezése vádaskodás nélkül („Aggódom, amikor…” a „Te mindig…” helyett).", "**Nyitott kérdések:** amelyekre nem lehet igennel vagy nemmel válaszolni, és beszélgetésre ösztönöznek.", "**Tükrözés, parafrazeálás, összefoglalás:** a hallottak saját szavakkal való visszaadása.", "**Asszertív kommunikáció:** határozott, de nem agresszív; a saját és a másik jogait is tiszteletben tartja.", "**Dicséret, pozitív megerősítés.**", "Gyermekekkel: guggolás a gyermek szemmagasságába, rövid, egyszerű mondatok, nyugodt hang, a nevén szólítás."]}]}, {"h": "A pedagógiai asszisztenstől elvárt kommunikáció", "blocks": [{"t": "ul", "items": ["**udvarias, tisztelettudó, nyugodt;**", "**életkornak megfelelő, érthető** a gyermekekkel;", "**empatikus, elfogadó, türelmes;**", "**hiteles:** a verbális és nonverbális jelzések összhangban vannak;", "**következetes,** a pedagógussal egyeztetett;", "**szakmailag pontos** és a hatáskörét nem lépi túl (például értékelésről, problémákról a pedagógus nyilatkozik);", "**nyelvileg igényes,** mintát ad a gyermekeknek."]}]}, {"h": "A kapcsolatteremtés szabályai a szülőkkel", "blocks": [{"t": "p", "text": "**A szóbeli közlések illemtana:** köszönés (a fiatalabb köszön előbb, de a pedagógiai dolgozó udvariasan elsőként is köszönhet), bemutatkozás, magázás (amíg a szülő mást nem kínál), a szülő meghallgatása, nyugodt hangnem, rövid, lényegre törő tájékoztatás, a problémás ügyekben a pedagógushoz irányítás. Kerülendő a pletyka, a más gyermekekről való beszéd, a szülők előtti vita."}, {"t": "p", "text": "**A telefonálás illemtana:** bemutatkozás (név, intézmény), a hívás céljának megnevezése, megfelelő időpont választása, rövid, érthető közlés, a lényeg összefoglalása, elköszönés. Bizalmas információt telefonon csak megfelelő azonosítás után, a pedagógus engedélyével lehet közölni."}, {"t": "p", "text": "**Az írásbeli
