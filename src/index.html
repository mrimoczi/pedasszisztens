<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedagógiai asszisztens tételtár</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: exam-slip sidebar (23 drawn topics) + notebook reading pane + fixed reader bar at the bottom */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --fg:#1A1F2B; --muted:#5A6377; --line:#D9DEE8;
  --ink:#2140A0; --ink-soft:#E6EBFA; --hl:#FFE76A; --hl-bg:rgba(255,226,70,.45);
  --ok:#1E7A4F; --ok-bg:#E2F3EA; --warn:#9A5B00; --warn-bg:#FCEFD8;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --bar-h:76px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141B; --surface:#191E28; --fg:#E5E8EF; --muted:#9AA3B6; --line:#2B3240;
  --ink:#93A9FF; --ink-soft:#232C47; --hl:#FFE76A; --hl-bg:rgba(255,226,70,.22);
  --ok:#6FD3A0; --ok-bg:#183327; --warn:#F2B562; --warn-bg:#3A2A12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141B; --surface:#191E28; --fg:#E5E8EF; --muted:#9AA3B6; --line:#2B3240;
  --ink:#93A9FF; --ink-soft:#232C47; --hl:#FFE76A; --hl-bg:rgba(255,226,70,.22);
  --ok:#6FD3A0; --ok-bg:#183327; --warn:#F2B562; --warn-bg:#3A2A12; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-display);font-size:15px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100%;padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom,0px))}
/* sidebar */
aside{border-right:1px solid var(--line);background:var(--surface);padding:20px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - var(--bar-h));overflow-y:auto}
.brand{padding:0 8px 14px}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.progress{display:flex;gap:10px;align-items:center;padding:10px 8px 14px;font-size:12.5px;color:var(--muted)}
.pbar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.pbar i{display:block;height:100%}
.draw{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:10px;border:1.5px dashed var(--ink);background:var(--ink-soft);color:var(--ink);font-weight:700;margin-bottom:14px}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 8px 6px;font-weight:700}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.tlist button{width:100%;display:grid;grid-template-columns:30px 1fr 10px;gap:8px;align-items:center;text-align:left;padding:7px 8px;border:0;border-radius:8px;background:none;font-size:13.5px;line-height:1.3}
.tlist button:hover{background:var(--bg)}
.tlist button[aria-current="true"]{background:var(--ink-soft);color:var(--ink);font-weight:600}
.num{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tlist button[aria-current="true"] .num{color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:transparent;border:1.5px solid var(--line)}
.dot.ok{background:var(--ok);border-color:var(--ok)} .dot.warn{background:var(--warn);border-color:var(--warn)}
/* main */
main{min-width:0;padding-block:28px 40px;padding-inline:clamp(16px,4vw,56px)}
.mobilebar{display:none}
.slip{max-width:760px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;position:relative}
.slip .eyebrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.slip .eyebrow b{font-family:var(--f-mono);font-size:13px;color:var(--ink);letter-spacing:0}
.slip h2{font-size:clamp(24px,3.2vw,34px);line-height:1.12;margin:10px 0 12px;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
.slip .q{font-family:var(--f-body);font-style:italic;font-size:17px;line-height:1.55;margin:0;color:var(--fg)}
.status{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.status button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.status button[aria-pressed="true"].s-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.status button[aria-pressed="true"].s-warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);font-weight:600}
.kw{max-width:760px;margin:18px 0 0}
.kw h3,.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;padding:3px 9px;border-radius:6px;background:var(--hl-bg)}
.tabs{display:flex;gap:4px;margin:26px 0 0;border-bottom:1px solid var(--line);max-width:760px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.pane{max-width:760px;padding-top:8px}
/* reading */
.doc{font-family:var(--f-body);font-size:17.5px;line-height:1.68;max-width:68ch}
.doc h3{font-family:var(--f-display);font-size:21px;font-weight:700;margin:34px 0 10px;letter-spacing:-.005em;text-wrap:balance}
.doc p{margin:0 0 14px}
.doc ul,.doc ol{margin:0 0 16px;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.doc strong{font-weight:600}
.rd{border-radius:6px;transition:background .2s;cursor:pointer;margin-inline:-6px;padding-inline:6px}
.rd:hover{background:color-mix(in srgb,var(--ink-soft) 55%,transparent)}
.rd.speaking{background:var(--hl-bg);box-shadow:inset 3px 0 0 var(--hl)}
.outline{list-style:none;padding:0;margin:18px 0 0;font-family:var(--f-body);font-size:18px;line-height:1.55;counter-reset:o;display:flex;flex-direction:column;gap:4px}
.outline li{display:grid;grid-template-columns:34px 1fr;padding:9px 6px;border-bottom:1px dashed var(--line)}
.outline li::before{counter-increment:o;content:counter(o);font-family:var(--f-mono);font-size:13px;color:var(--ink);padding-top:4px}
.sh{font-size:20px;font-weight:700;margin:28px 0 0;letter-spacing:-.005em}
.short .sh:first-child{margin-top:14px}
.facts{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.facts li{padding:10px 6px;border-bottom:1px dashed var(--line);font-family:var(--f-body);font-size:17px;line-height:1.5;display:flex;flex-direction:column;gap:2px}
.facts .fq{font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--ink)}
.hint{font-size:13.5px;color:var(--muted);margin:16px 0 0}
/* cards */
.card{margin-top:20px;perspective:1200px}
.card-inner{min-height:240px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:28px;display:flex;flex-direction:column;justify-content:center;gap:14px;cursor:pointer}
.card-inner .side{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.card-inner .txt{font-family:var(--f-body);font-size:21px;line-height:1.45;text-wrap:balance}
.card-inner.back{background:var(--ink-soft);border-color:transparent}
.card-inner.back .txt{font-size:19px}
.cardnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.cardnav .count{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
/* draw overlay */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(3px);z-index:20;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(var(--bar-h) + 24px)}
.exam{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.exam .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font-family:var(--f-mono);font-size:clamp(44px,9vw,72px);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;color:var(--ink)}
.phase{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.checklist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;font-size:15px}
.checklist input{margin-top:3px;accent-color:var(--ink);width:16px;height:16px}
.score{font-size:15px;color:var(--muted)} .score b{font-family:var(--f-mono);color:var(--fg);font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap}
/* reader bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:var(--bar-h)}
.play{width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);display:grid;place-items:center;flex:none}
.play svg{width:20px;height:20px;fill:currentColor}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.ib svg{width:16px;height:16px;fill:currentColor}
.now{flex:1;min-width:160px}
.now .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.ctl select{max-width:220px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 8px;font-size:13px}
.ctl input[type=range]{width:90px;accent-color:var(--ink)}
.ctl output{font-family:var(--f-mono);font-size:12.5px;width:3.2em}
[hidden]{display:none!important}
.modes{display:flex;gap:3px;padding:3px;margin:0 8px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.modes button{flex:1;border:0;background:none;border-radius:7px;padding:7px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.mobilemodes{display:none;margin:0 0 10px}
.wlist{max-width:760px;margin-top:18px;display:flex;flex-direction:column;gap:8px}
.wq{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.wq summary{display:grid;grid-template-columns:26px 1fr 10px;gap:8px;align-items:baseline;padding:13px 14px;cursor:pointer;font-weight:600;line-height:1.35;list-style:none}
.wq summary::-webkit-details-marker{display:none}
.wq summary .dot{align-self:center}
.wq[open] summary{border-bottom:1px dashed var(--line)}
.wq .doc{padding:14px 18px 16px;font-size:16.5px;line-height:1.6;max-width:none}
.wq .doc :last-child{margin-bottom:0}
.walt{font-size:14px;color:var(--muted);font-style:italic}
.wnote{font-family:var(--f-display);font-size:13.5px;line-height:1.45;padding:9px 12px;border-radius:9px;background:var(--warn-bg);color:var(--warn)}
.wq .status{margin-top:14px}
.notice{max-width:760px;margin:0 0 18px;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13.5px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  .mobilemodes{display:flex}
  .mobilebar{display:flex;gap:8px;margin-bottom:16px;align-items:center}
  .mobilebar select{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:9px;font-size:14px}
  .mobilebar .draw{width:auto;margin:0;padding:9px 12px}
  .ctl.voice{display:none}
  .bar{gap:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="app">
  <aside id="side">
    <div class="brand">
      <h1>Pedagógiai asszisztens tételtár</h1>
      <p id="brandSub"></p>
    </div>
    <div class="modes" role="group" aria-label="Vizsgarész"><button type="button" data-m="szobeli">Szóbeli</button><button type="button" data-m="irasbeli">Írásbeli</button></div>
    <div class="progress"><div class="pbar" id="pbar"></div><span id="ptxt"></span></div>
    <button class="draw" id="drawBtn" type="button">Tételhúzás · vizsgaszimuláció</button>
    <div id="tlist"></div>
  </aside>
  <main>
    <div class="modes mobilemodes" role="group" aria-label="Vizsgarész"><button type="button" data-m="szobeli">Szóbeli</button><button type="button" data-m="irasbeli">Írásbeli</button></div>
    <div class="mobilebar">
      <select id="mSel" aria-label="Tétel kiválasztása"></select>
      <button class="draw" id="drawBtn2" type="button">Húzás</button>
    </div>
    <div class="notice" id="voiceNotice" hidden></div>
    <section class="slip" id="slip"></section>
    <div class="kw" id="kw"></div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" id="tab-olvas" data-v="olvas" type="button">Kidolgozás</button>
      <button role="tab" id="tab-roviden" data-v="roviden" type="button">Röviden</button>
      <button role="tab" id="tab-kartya" data-v="kartya" type="button">Kártyák</button>
    </div>
    <div class="pane" id="pane"></div>
  </main>
</div>

<div class="overlay" id="overlay" hidden></div>

<div class="bar" role="region" aria-label="Felolvasás">
  <button class="ib" id="prevB" type="button" aria-label="Előző bekezdés"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
  <button class="play" id="playB" type="button" aria-label="Felolvasás indítása"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 4v16l13-8z"/></svg></button>
  <button class="ib" id="nextB" type="button" aria-label="Következő bekezdés"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  <div class="now"><div class="t" id="nowT">Felolvasás</div><div class="s" id="nowS">Kattints egy bekezdésre, vagy indítsd a lejátszást.</div></div>
  <div class="ctl voice"><label for="voiceSel">Hang</label><select id="voiceSel"></select></div>
  <div class="ctl"><label for="rate">Tempó</label><input type="range" id="rate" min="0.6" max="1.6" step="0.05" value="1"><output id="rateOut">1.00×</output></div>
</div>

<script id="written" type="application/json">[{"name":"Pedagógia, neveléselmélet","q":[{"q":"Ismertesse a pedagógia fogalmát és tárgyát!","alt":[],"note":"","blocks":[{"t":"p","text":"**Fogalma:** komplex fogalom, amely jelenti a nevelés elméletét, a neveléstudományt, és jelenti a nevelés gyakorlati megvalósulását is."},{"t":"p","text":"**Tárgya:** a fejlesztendő személyiség alakításának, fejlesztésének folyamata."}],"short":[{"t":"p","text":"**Fogalma:** a nevelés elmélete (neveléstudomány) és a nevelés gyakorlata."},{"t":"p","text":"**Tárgya:** a fejlesztendő személyiség alakításának, fejlesztésének folyamata."}]},{"q":"Mit értünk a pedagógia fogalma alatt? Mivel foglalkozik a pedagógia? Soroljon fel a pedagógia társtudományai közül legalább 4-et!","alt":[],"note":"","blocks":[{"t":"p","text":"A pedagógia a gyermekek (általánosan: az ember) nevelésével és oktatásával foglalkozó tudomány. Tudatos és tervezett tevékenységekkel foglalkozik, ez különbözteti meg a hétköznapi neveléstől."},{"t":"p","text":"**Társtudományai:** pszichológia, szociológia, szociálpszichológia, kommunikációelmélet."}],"short":[{"t":"p","text":"A nevelés és oktatás tudománya; tudatos, tervezett nevelő tevékenységgel foglalkozik."},{"t":"p","text":"**Társtudományai:** pszichológia, szociológia, szociálpszichológia, kommunikációelmélet."}]},{"q":"Sorolja fel és ismertesse a pedagógia résztudományait!","alt":[],"note":"","blocks":[{"t":"ul","items":["**Általános pedagógia:** a nevelés alapkérdései, fogalmai.","**Neveléselmélet:** a nevelés céljai, folyamata, módszerei.","**Oktatáselmélet (didaktika):** a tanítás és a tanulás elmélete.","**Iskolaszervezettan:** az iskola felépítése, működése.","**Összehasonlító pedagógia:** a különböző országok nevelési rendszereinek összevetése.","**Neveléstörténet:** a nevelés elveinek és gyakorlatának történeti alakulása.","**Neveléspszichológia:** a nevelés lélektani törvényszerűségei.","**Óvodai, iskola-, gyógy- és családpedagógia:** a nevelés adott színterére vagy csoportjára szakosodó ágak."]}],"short":[{"t":"ul","items":["**Neveléselmélet:** a nevelés céljai, módszerei.","**Didaktika:** az oktatás elmélete.","**Neveléstörténet:** a nevelés története.","**Összehasonlító pedagógia:** országok nevelési rendszereinek összevetése.","**Neveléspszichológia:** a nevelés lélektani törvényszerűségei.","**Gyógypedagógia:** a fogyatékos gyermekek nevelése."]}]},{"q":"Határozza meg, hogy melyek a legfontosabb értékek a nevelés folyamatában! Soroljon fel legalább 5 példát mindegyik csoportra!","alt":[],"note":"","blocks":[{"t":"ul","items":["**Alapértékek:** személyiség, fejlődés, önnevelés, szabadság, autonómia, demokratizmus, humánum, boldogság, magyarságtudat, műveltség.","**Alkalmazott és differenciált értékek:** kötelesség, felelősség, szorgalom, szerénység, tisztelet, önzetlenség, bátorság, ízlés, sport és egészség, a normák betartása.","**Egyéni értékek:** önérték feltárása, világkép és világnézet, saját értékrend és eszmények, önművelés, reális életcélok, követendő minta vállalása."]}],"short":[{"t":"ul","items":["**Alapértékek:** személyiség, fejlődés, szabadság, humánum, műveltség.","**Alkalmazott értékek:** kötelesség, felelősség, szorgalom, tisztelet, önzetlenség.","**Egyéni értékek:** önismeret, világnézet, saját értékrend, önművelés, reális életcél."]}]},{"q":"Milyen tényezők hátráltatják a gyermeket a nevelés folyamatában?","alt":[],"note":"","blocks":[{"t":"ul","items":["betegség, az egészség megromlása","a szeretet hiányának érzékelése","a szülők válása, annak előtti és utáni időszaka","családi problémák, a család gazdasági háttere","sikertelenség, kudarcélmény","a pedagógus destruktív nevelési stílusa","a kortársakkal való kölcsönhatások negatív hatása"]}],"short":[{"t":"p","text":"Betegség; szeretethiány; a szülők válása, családi problémák; kudarcélmény; a pedagógus destruktív nevelési stílusa."}]},{"q":"Ismertesse a nevelés fogalmát és színtereit!","alt":[],"note":"","blocks":[{"t":"p","text":"**Fogalma:** értékátadó, értékrendszert kialakító fejlesztő folyamat, amelynek célja, hogy az egyént életfeladataira képessé tegye."},{"t":"ul","items":["**Elsődleges színtér:** család.","**Másodlagos színtér:** bölcsőde, óvoda, iskola.","**Harmadlagos színtér:** civil szféra."]}],"short":[{"t":"p","text":"**Fogalma:** értékátadó, fejlesztő folyamat, amely az egyént életfeladataira képessé teszi."},{"t":"p","text":"**Színterei:** család (elsődleges); bölcsőde, óvoda, iskola (másodlagos); civil szféra (harmadlagos)."}]}]},{"name":"Pszichológia","q":[{"q":"Soroljon fel és röviden mutassa be a pszichológia kutatási és vizsgálati módszerei közül legalább 4-et!","alt":["Ismertesse a pszichológia vizsgálati módszereit!","Sorolja fel a pszichológia kutatási és vizsgálati módszereit, röviden jellemezze őket! Írjon legalább 4 módszert!"],"note":"","blocks":[{"t":"ul","items":["**Kísérlet:** a jelenség létrejöttének feltételeit a kísérletvezető teremti meg és változtatja, egy tudományos feltevés bizonyítására. Fajtái: laboratóriumi, természetes.","**Megfigyelés:** introspekció (önmegfigyelés, nagyobb szubjektivitással) és extrospekció (mások külső megfigyelése).","**Kikérdezés:** szóbeli (pl. exploráció, a pillanatnyi lelkiállapot kikérdezése) vagy írásbeli (nyílt és zárt kérdőív).","**Teszt:** feladathelyzet elé állítja a személyt. Pl. intelligenciateszt, speciális képességvizsgálat, projektív teszt."]}],"short":[{"t":"ul","items":["**Kísérlet:** a kutató teremti meg és változtatja a feltételeket.","**Megfigyelés:** önmegfigyelés vagy mások megfigyelése.","**Kikérdezés:** szóban (exploráció) vagy kérdőívvel.","**Teszt:** feladathelyzet, pl. intelligenciateszt."]}]}]},{"name":"Szocializáció","q":[{"q":"Mi a kortárscsoport szerepe a szocializáció folyamatában?","alt":[],"note":"","blocks":[{"t":"ul","items":["**Bölcsőde:** „idegenek” megjelenése, „egy a sok közül” élmény, az önálló kapcsolatteremtés első szakasza.","**Óvoda:** megjelenik az együttműködés, a szerepjátékok csoportossá válnak.","**Serdülőkor:** érettebb együttműködés, átérzik egymás érzelmeit, kifejlődik az empátia."]},{"t":"p","text":"**További funkciói:** lazítja a családi kapcsolatokat, alternatív viselkedési modelleket, értékeket és normákat kínál. A serdülőnek meg kell tanulnia összehangolni a számára fontos személyek és intézmények esetleg ütköző normáit."}],"short":[{"t":"p","text":"Bölcsődében az első önálló kapcsolatok, óvodában az együttműködés, serdülőkorban az empátia alakul ki benne. Lazítja a családi kötődést, és alternatív viselkedési mintákat, értékeket, normákat kínál."}]}]},{"name":"Integráció, SNI, BTMN, HH, HHH","q":[{"q":"Ki minősül a hatályos jogszabályok alapján BTMN-es tanulónak? Milyen keretek között valósítható meg az ilyen gyermekek fejlesztése?","alt":[],"note":"A docx még „fejlesztő foglalkoztatást” ír, a hatályos törvény a „fejlesztő pedagógiai ellátás” kifejezést használja.","blocks":[{"t":"p","text":"**BTMN (Nkt. 4. § 3.):** az a különleges bánásmódot igénylő gyermek, tanuló, aki a szakértői bizottság véleménye alapján az életkorához képest jelentősen alulteljesít, társas kapcsolati problémákkal, tanulási, magatartásszabályozási hiányosságokkal küzd, közösségbe való beilleszkedése és személyiségfejlődése nehezített vagy sajátos tendenciákat mutat, de nem minősül SNI-nek."},{"t":"p","text":"**Fejlesztése (Nkt. 47. § (8)):** fejlesztő pedagógiai ellátásra jogosult, amely a nevelési tanácsadás, az óvodai nevelés, az iskolai nevelés és oktatás, valamint a kollégiumi nevelés és oktatás keretében valósítható meg."}],"short":[{"t":"p","text":"**BTMN:** a szakértői bizottság szerint életkorához képest jelentősen alulteljesít, beilleszkedési, tanulási, magatartási nehézséggel küzd, de nem SNI."},{"t":"p","text":"**Fejlesztése:** fejlesztő pedagógiai ellátás a nevelési tanácsadás, az óvoda, az iskola vagy a kollégium keretében."}]},{"q":"Melyek a sajátos nevelési igényű neveléshez és oktatáshoz szükséges feltételek?","alt":[],"note":"A docx a törvény régebbi szövegét idézi, ez a hatályos változat.","blocks":[{"t":"p","text":"**Nkt. 47. § (4):**"},{"t":"ul","items":["**Külön neveléshez és oktatáshoz, fejlesztő nevelés-oktatáshoz:** a sajátos nevelési igény típusának és súlyosságának megfelelő gyógypedagógus, konduktor; speciális tanterv, tankönyv és egyéb segédlet.","**Egyéni előrehaladású és integrált neveléshez, oktatáshoz, a szakértői bizottság által meghatározott foglalkozáshoz:** a típusnak és súlyosságnak megfelelő gyógypedagógus, konduktor; speciális tanterv, tankönyv, valamint speciális gyógyászati és technikai eszközök.","**Mindkét esetben:** a fejlesztési területek meghatározása a szakértői bizottság által."]}],"short":[{"t":"ul","items":["gyógypedagógus, konduktor","speciális tanterv, tankönyv, segédletek","speciális gyógyászati és technikai eszközök","a fejlesztési területek meghatározása a szakértői bizottság által"]}]},{"q":"Határozza meg, hogy mikor tekinthető sajátos nevelési igényűnek a gyermek!","alt":[],"note":"A docx kihagyja a szakértői véleményt, pedig ez a feltétel kulcsa.","blocks":[{"t":"p","text":"**SNI (Nkt. 4. § 25.):** az a különleges bánásmódot igénylő gyermek, tanuló, aki a szakértői bizottság szakértői véleménye alapján mozgásszervi, érzékszervi (látási, hallási), értelmi vagy beszédfogyatékos, több fogyatékosság esetén halmozottan fogyatékos, autizmus spektrum zavarral vagy egyéb pszichés fejlődési zavarral (súlyos tanulási, figyelem- vagy magatartásszabályozási zavarral) küzd."}],"short":[{"t":"p","text":"Ha a szakértői bizottság véleménye szerint mozgásszervi, érzékszervi, értelmi vagy beszédfogyatékos, halmozottan fogyatékos, autizmus spektrum zavarral vagy egyéb pszichés fejlődési zavarral küzd."}]},{"q":"Határozza meg a különleges bánásmódot igénylő gyermekek fogalmát! Milyen 4 csoportot különböztetünk meg? Soroljon fel legalább 2-2 példát az egyes csoportokhoz!","alt":[],"note":"A 4 csoport szakirodalmi felosztás. Az Nkt. 4. § 13. szerint a különleges bánásmódot igénylő lehet SNI, BTMN vagy kiemelten tehetséges.","blocks":[{"t":"p","text":"**Fogalma:** az a gyermek, akinek állandó vagy átmeneti jelleggel fizikai, biológiai, pszichikai, intellektuális, családi vagy szociokulturális okokból egyéni nevelési-oktatási szükségletei vannak, és egyénre szabott bánásmódot igényel."},{"t":"ul","items":["**Speciális nevelési szükségletű:** tanulásban, beszédben, értelmileg akadályozott; látás-, hallássérült, mozgáskorlátozott; autista.","**Tanulási problémákkal küzdő:** tanulási nehézség (lassú, motiválatlan, hátrányos hátterű) és tanulási zavar (diszlexia, diszgráfia, diszkalkulia, figyelemzavar).","**Magatartászavarok miatt problémás:** visszahúzódó (regresszív), depresszív; ellenséges (agresszív), inkonzekvens viselkedésű.","**Kivételes képességű, tehetséges:** intellektuális, művészi, pszichomotoros, szociális tehetség."]}],"short":[{"t":"p","text":"**Fogalma:** egyéni okok miatt egyénre szabott nevelést, oktatást igénylő gyermek."},{"t":"ul","items":["**Speciális nevelési szükségletű:** látássérült, mozgáskorlátozott.","**Tanulási problémákkal küzdő:** diszlexia, diszkalkulia.","**Magatartászavaros:** visszahúzódó, agresszív.","**Kivételes képességű:** intellektuális, művészi tehetség."]}]},{"q":"Határozza meg, mit értünk integrált nevelés alatt! Mutassa be röviden jellemzőit! Sorolja fel az integrált nevelés legalább 3 előnyét!","alt":["Mit értünk az integrált nevelés fogalma alatt? Jellemezze röviden az óvodai integrált nevelést!"],"note":"","blocks":[{"t":"p","text":"**Fogalma:** a különálló részek beilleszkedése egy nagyobb egészbe. A pedagógiában a fogyatékkal élő, akadályozott és ép gyermekek közös élet- és tanulási térben zajló együttnevelése."},{"t":"p","text":"**Jellemzői:** minden résztvevőnek optimális fejlődést biztosít, az esélyegyenlőtlenségek csökkentésének eszköze."},{"t":"p","text":"**Óvodai integrált nevelés:** az óvoda vállalja a beszédhibás és más fogyatékos gyermekek nevelését, ha közösségben elláthatók. Célja, hogy az ép gyermekek számára is természetes legyen a másság elfogadása, a segítségnyújtás és a tolerancia."},{"t":"p","text":"**Előnyei:**"},{"t":"ul","items":["erősödik az SNI-s gyermek énképe, önbizalma","fejlődik az alkalmazkodóképesség","kialakul az empátia, a segítőkészség, a tolerancia","erősödik az önismeret és az önértékelés"]}],"short":[{"t":"p","text":"**Fogalma:** fogyatékos és ép gyermekek közös nevelése, oktatása."},{"t":"p","text":"**Jellemzője:** mindenkinek optimális fejlődést biztosít, csökkenti az esélyegyenlőtlenséget."},{"t":"p","text":"**Előnyei:** erősödő önbizalom; jobb alkalmazkodóképesség; empátia és tolerancia."}]},{"q":"Sorakoztasson fel érveket és ellenérveket a különleges bánásmódot igénylő gyermekek integrált, illetve szegregált nevelésével kapcsolatban!","alt":[],"note":"","blocks":[{"t":"p","text":"**Az integráció mellett:** esélyteremtés, egyenlő bánásmód, megszünteti a stigmatizálást és a diszkriminációt, elfogadóvá, toleránssá nevel."},{"t":"p","text":"**Az integráció ellen (a szegregáció mellett):** csökkenhet a csoport teljesítménye, konfliktusok lehetnek a többi gyermekkel, speciálisan képzett pedagógus kell."}],"short":[{"t":"p","text":"**Érvek:** esélyteremtés, nincs megbélyegzés, toleranciára nevel."},{"t":"p","text":"**Ellenérvek:** csökkenhet a csoport teljesítménye, konfliktusok, speciálisan képzett pedagógus kell."}]},{"q":"Ismertesse az inkluzív nevelés fogalmát! Mutasson be egy kutatást vagy elméletet, amely az inkluzív neveléssel foglalkozik!","alt":[],"note":"","blocks":[{"t":"p","text":"**Fogalma:** a közösség tagjai sokszínűségének, bárminemű különbözőségének elfogadása és megbecsülése. A gyermekek közötti különbségekre lehetőségként tekint, és a tananyagot, a módszereket rugalmasan a változó igényekhez igazítja."},{"t":"p","text":"**Példa, Marsha Forest elmélete.** A tanulókat jobban fejleszti, ha:"},{"t":"ul","items":["különböző képességűek tanulnak együtt","mindenki biztonságban érezheti magát, mert egyéni segítséget kap, amikor szüksége van rá","az inklúziót széles körű társadalmi kampányok is támogatják"]}],"short":[{"t":"p","text":"**Fogalma:** a közösség minden tagjának elfogadása; a különbség lehetőség, a tanítás rugalmasan igazodik hozzá."},{"t":"p","text":"**Marsha Forest elmélete:** a tanulók jobban fejlődnek, ha különböző képességűek tanulnak együtt, és mindenki egyéni segítséget kap."}]},{"q":"Ismertesse a differenciált bánásmód fogalmát és az óvodapedagógus szerepét a differenciálásban!","alt":[],"note":"","blocks":[{"t":"p","text":"**Fogalma:** a hátrányokkal és előnyökkel rendelkező, különleges bánásmódot igénylő gyermekek nevelése-oktatása az egyéni sajátosságokhoz alkalmazkodva."},{"t":"p","text":"**Az óvodapedagógus szerepe:**"},{"t":"ul","items":["elfogadtatja, hogy a gyermekek közötti különbség természetes","elősegíti az egyénre jellemző pozitív megnyilvánulásokat","elfogadhatóvá teszi a feladatokat, választási lehetőséget ad","egyénhez igazodó követelményeket biztosít","együttműködésre kész, ösztönöz, modellt nyújt","nem alakítani akarja a gyermeket, hanem alakulni hagyja"]}],"short":[{"t":"p","text":"**Fogalma:** nevelés-oktatás a gyermek egyéni sajátosságaihoz igazodva."},{"t":"p","text":"**Az óvodapedagógus szerepe:** elfogadtatja a különbségeket, egyénhez igazodó követelményt állít, választási lehetőséget ad, ösztönöz."}]},{"q":"Határozza meg a halmozottan hátrányos helyzetű gyermek fogalmát!","alt":[],"note":"A docx csak az első esetet említi.","blocks":[{"t":"p","text":"**HHH (Gyvt. 67/A. § (2)):**"},{"t":"ul","items":["az a rendszeres gyermekvédelmi kedvezményre jogosult gyermek, akinél a következők közül legalább kettő fennáll: a szülő alacsony iskolai végzettsége, a szülő alacsony foglalkoztatottsága, elégtelen lakókörnyezet vagy lakáskörülmény","a nevelésbe vett gyermek","az utógondozói ellátásban részesülő, tanulói vagy hallgatói jogviszonyban álló fiatal felnőtt"]}],"short":[{"t":"p","text":"Rendszeres gyermekvédelmi kedvezményre jogosult, és legalább kettő fennáll: a szülő alacsony iskolai végzettsége, alacsony foglalkoztatottsága, elégtelen lakáskörülmény. HHH a nevelésbe vett gyermek és a tanuló utógondozott fiatal felnőtt is."}]},{"q":"Soroljon fel legalább 8 tünetet, amelyek alapján a gyermek veszélyeztetettnek tekinthető!","alt":[],"note":"","blocks":[{"t":"p","text":"Zárkózottság; szeretetéhség; nyugtalanság; durva, agresszív magatartás; hirtelen hanyatlás a magatartásban, tanulásban; igazolatlan vagy gyanús hiányzások; álmatlanság, aluszékonyság; durva hangnem."}],"short":[{"t":"p","text":"Zárkózottság; szeretetéhség; nyugtalanság; agresszív magatartás; hirtelen romló tanulás; gyanús hiányzások; alvászavar; durva hangnem."}]},{"q":"Definiálja a veszélyeztetettség fogalmát! Soroljon fel példákat a veszélyeztetett gyermekekre!","alt":[],"note":"","blocks":[{"t":"p","text":"**Fogalma (Gyvt. 5. § n)):** a gyermek vagy más személy által tanúsított magatartás, mulasztás vagy körülmény következtében kialakult állapot, amely a gyermek testi, értelmi, érzelmi vagy erkölcsi fejlődését gátolja vagy akadályozza."},{"t":"p","text":"**Példák:**"},{"t":"ul","items":["alkoholista, züllött, elmebeteg, pszichopata, krónikus beteg szülő gyermeke","felbomlott család elhanyagolt gyermeke","az intézményekben tartósan kirívó magatartású, neurotizálódott gyermek","tanulásban lemaradt, túlkoros gyermek","javítóintézetből vagy nevelőotthonból elbocsátott, nem utógondozott fiatal"]}],"short":[{"t":"p","text":"**Fogalma:** magatartás, mulasztás vagy körülmény miatt kialakult állapot, amely gátolja a gyermek testi, értelmi, érzelmi vagy erkölcsi fejlődését."},{"t":"p","text":"**Példák:** alkoholista szülő gyermeke; felbomlott család elhanyagolt gyermeke; nevelőotthonból elbocsátott, nem utógondozott fiatal."}]},{"q":"Mit értünk elhanyagolás alatt? Milyen formái, típusai vannak az elhanyagolásnak? Ismertessen ezek közül legalább kettőt!","alt":[],"note":"","blocks":[{"t":"p","text":"**Elhanyagolás:** a szülő vagy gondviselő rendszeresen elmulasztja a gyermek alapvető szükségleteinek kielégítését, védelmét, felügyeletét, ami súlyos ártalmat okoz vagy azzal fenyeget."},{"t":"ul","items":["**Érzelmi:** az érzelmi biztonság és az állandó szeretetkapcsolat hiánya, a kötődés mellőzése, durva magatartás más családtaggal a gyermek jelenlétében.","**Fizikai:** az alapvető fizikai szükségletek, a higiéné, a felügyelet hiánya, a gyermek védelmének elmulasztása veszélyhelyzetben."]}],"short":[{"t":"p","text":"**Elhanyagolás:** a gyermek alapvető szükségleteinek, védelmének rendszeres elmulasztása."},{"t":"ul","items":["**Érzelmi:** a szeretet, az érzelmi biztonság hiánya.","**Fizikai:** az ellátás, a higiéné, a felügyelet hiánya."]}]}]},{"name":"Személyiséglélektan","q":[{"q":"Határozza meg a személyiséglélektan fogalmát! Melyek a személyiség fejlődését befolyásoló tényezők?","alt":[],"note":"","blocks":[{"t":"p","text":"**Fogalma:** a pszichológia alaptudományainak egyike. Azt kutatja, hogyan szerveződnek a lelki folyamatok egységes személyiséggé, és mi az oka az emberek közötti hasonlóságoknak és különbségeknek."},{"t":"p","text":"**Befolyásoló tényezők:** genetikai hatások, öröklött adottságok, környezeti hatások."}],"short":[{"t":"p","text":"**Fogalma:** azt vizsgálja, hogyan szerveződnek a lelki folyamatok egységes személyiséggé, és miben különbözünk egymástól."},{"t":"p","text":"**Tényezők:** öröklődés, környezet, nevelés."}]},{"q":"Ismertesse az emberi szükségletek rendszerét!","alt":[],"note":"","blocks":[{"t":"p","text":"Maslow szerint a szükségletek hierarchiát alkotnak, amelyet motivációs piramisban foglalt össze. Alulról felfelé:"},{"t":"ol","items":["**Fiziológiai:** légzés, étel, víz, alvás, anyagcsere.","**Biztonság:** fizikai, anyagi, egészségi biztonság.","**Szociális:** barátság, család, szeretet, valahová tartozás.","**Megbecsülés:** önbecsülés, elismerés, presztízs.","**Önmegvalósítás:** a bennünk lévő lehetőségek kiteljesedése."]},{"t":"p","text":"A docx szövege a megbecsülés és az önmegvalósítás közé a kognitív és az esztétikai szükségletet is beilleszti."}],"short":[{"t":"p","text":"Maslow-piramis, alulról felfelé: fiziológiai szükségletek; biztonság; szeretet, valahová tartozás; megbecsülés; önmegvalósítás. A magasabb szint akkor lesz fontos, ha az alacsonyabb kielégült."}]},{"q":"Milyen tényezők módosítják aktuálisan az alapvető emberi szükségleteket? Soroljon fel legalább 6 tényezőt!","alt":[],"note":"A docx itt magukat a szükségleteket sorolja fel (légzés, étel, víz stb.), ezek nem módosító tényezők. Ez a lista saját kidolgozás, érdemes a tankönyveddel összevetni.","blocks":[{"t":"p","text":"Életkor; nem; testi egészségi állapot, betegség; lelki állapot; napszak, évszak, éghajlat; aktuális tevékenység, terhelés; kulturális szokások; családi és anyagi helyzet."}],"short":[{"t":"p","text":"Életkor; egészségi állapot; lelki állapot; évszak, éghajlat; aktuális tevékenység; kulturális szokások."}]}]},{"name":"Fejlődéslélektan","q":[{"q":"A megismerő folyamatok közül soroljon fel a figyelem 4 fajtáját és röviden jellemezze őket!","alt":[],"note":"","blocks":[{"t":"ul","items":["**Szándékos (akaratlagos):** tudatos mentális erőfeszítést igényel, 6-7 éves korban alakul ki, a tanulás alapja. A gyerekek kb. 10-15 percig tudnak így figyelni.","**Spontán (önkéntelen):** hirtelen, önkéntelenül irányul egy erős vagy szokatlan ingerre, kisgyermekkorban jelenik meg. Pavlov „mi az?” reflexnek nevezi.","**Automatikus:** gyakorlással alakul ki, lehetővé teszi a figyelem megosztását párhuzamos tevékenységek között. Inkább serdülő- és felnőttkorra jellemző.","**Kitartó:** hosszú ideig tartó, nagy mentális erőfeszítés. Az idő múlásával csökken, hatással van rá a motiváció, az érdeklődés és az előzetes tudás."]}],"short":[{"t":"ul","items":["**Szándékos:** tudatos erőfeszítés, 6-7 éves korra alakul ki.","**Spontán:** önkéntelen, erős vagy új ingerre irányul.","**Automatikus:** gyakorlással alakul ki, megosztható.","**Kitartó:** hosszan tartó erőfeszítés, idővel csökken."]}]},{"q":"Röviden mutassa be a pubertáskorra jellemző életkori sajátosságokat!","alt":[],"note":"Az életkori határok forrásonként eltérnek. A szóbeli 11. tétel más határokat ad (prepubertás 10-12, pubertás 12-16 év).","blocks":[{"t":"p","text":"**Szakaszai (kb.):** kiskamaszkor (prepubertás, 11-13 év), kamaszkor (pubertás, 14-18 év), ifjúkor (adoleszcencia, 18-21 év). A kezdet és a tartam egyénenként és nemenként eltér."},{"t":"ul","items":["átmenet a gyermek- és a felnőttkor között, gyakran krízisekkel","átalakul a családhoz fűződő kapcsolat, kitágul a társas világ","szexuális érés, intim párkapcsolat igénye","felnő a felelősségvállaláshoz: pályaválasztás, önálló életvitel","feszültség a biológiai érés és a társadalmi elvárások között","érzelmi ingadozás, ütközés a felnőttekkel, esetenként szabálysértés","érettséget a döntések hoznak: pálya, társaság, értékek, partner"]}],"short":[{"t":"p","text":"**Szakaszai:** prepubertás (11-13), pubertás (14-18), ifjúkor (18-21 év)."},{"t":"p","text":"**Jellemzői:** nemi érés; leválás a családról, a kortársak szerepének növekedése; érzelmi ingadozás, konfliktus a felnőttekkel; identitáskeresés, pályaválasztás."}]},{"q":"Határozza meg a fejlődés fogalmát, jellemzőit!","alt":[],"note":"","blocks":[{"t":"p","text":"**Fogalma:** minőségi változásokkal és egyre differenciáltabb szerveződéssel járó folyamat."},{"t":"ul","items":["egyszerre tükrözi az emberi faj jellegzetességeit és az egyén egyedi vonásait","biológiai és társas-társadalmi hatóerők is befolyásolják, csak társas környezetben képzelhető el","a fejlődés és a szocializáció elválaszthatatlan","egyaránt érinti a testi, a kognitív, az érzelmi és a társas folyamatokat","ha egy funkció az átlagnál korábban vagy később alakul ki, az önmagában nem előny és nem hátrány"]}],"short":[{"t":"p","text":"**Fogalma:** minőségi változásokkal, egyre differenciáltabb szerveződéssel járó folyamat."},{"t":"p","text":"**Jellemzői:** biológiai és társas hatások alakítják; elválaszthatatlan a szocializációtól; testi, értelmi, érzelmi és társas területet is érint."}]},{"q":"Ismertesse a fejlődéslélektan fogalmát, tárgyát!","alt":[],"note":"","blocks":[{"t":"p","text":"A tudományos pszichológia egyik fő ága. Azokkal a testi, értelmi, társas és személyiségbeli változásokkal foglalkozik, amelyeken az ember a fogantatástól az élet végéig keresztülmegy. Célja a fejlődési funkciók leírása, magyarázata, összehasonlítása és előrejelzése."},{"t":"p","text":"**3 központi kérdése:**"},{"t":"ul","items":["**Folyamatosság:** folyamatos a fejlődés, vagy ugrásszerű?","**Forrása:** öröklődés vagy környezet?","**Egyéni különbségek:** mennyire különbözünk, mennyire állandóak a jellemvonások?"]}],"short":[{"t":"p","text":"A pszichológia ága, amely az ember testi, értelmi, társas és személyiségbeli változásait vizsgálja a fogantatástól a halálig."},{"t":"p","text":"**Központi kérdései:** folyamatos-e a fejlődés; öröklődés vagy környezet; mekkorák az egyéni különbségek."}]},{"q":"Röviden mutassa be Mary Ainsworth kísérleteinek lényegét! Mit takar az Idegen helyzet kísérlet?","alt":[],"note":"","blocks":[{"t":"p","text":"**Idegen helyzet:** 12-18 hónapos gyermek kötődésének vizsgálata szabványos laboratóriumi helyzetben. A gyermek anyjával ismeretlen szobába kerül, belép egy idegen, az anya kimegy, majd visszatér. A kulcs a gyermek reakciója a távozásra és a visszatérésre."},{"t":"ul","items":["**Biztonságos:** a kezdeti ijedtség után örömmel fogadja az anyát, felveszi vele a kapcsolatot.","**Szorongó-elkerülő:** nem reagál különösebben a távozásra, a visszatéréskor inkább visszahúzódik.","**Szorongó-ellenálló:** érzékenyen reagál a távozásra, visszatéréskor dühös, sértett, miközben keresi a közelséget."]}],"short":[{"t":"p","text":"1-1,5 éves gyermek kötődését vizsgálta: idegen szobában az anya kimegy, majd visszatér, és a gyermek reakcióját figyelik."},{"t":"p","text":"**Kötődési típusok:** biztonságos (örömmel fogadja az anyát); szorongó-elkerülő (kerüli); szorongó-ellenálló (keresi, de dühös)."}]},{"q":"Mit értünk iskolaérettség alatt? Mutassa be az iskolaérett gyermek testi, lelki és szociális jellemzőit!","alt":[],"note":"","blocks":[{"t":"p","text":"Összetett fogalom: a gyermek testileg, pszichésen és szociálisan is alkalmas az iskolai élet megkezdésére."},{"t":"ul","items":["**Testi:** első alakváltozás, fogváltás, arányos, teherbíró test, összerendezett mozgás, fejlődő finommotorika, szükségleteit szándékosan irányítja.","**Lelki:** szándékos bevésés és felidézés, szándékos figyelem, elemi fogalmi gondolkodás.","**Szociális:** több szabályhoz alkalmazkodik, késleltetni tudja szükségletei kielégítését, kialakul a feladattudata és a feladattartása."]}],"short":[{"t":"p","text":"A gyermek testileg, lelkileg és szociálisan is alkalmas az iskolakezdésre."},{"t":"ul","items":["**Testi:** első alakváltozás, fogváltás, összerendezett mozgás.","**Lelki:** szándékos figyelem és emlékezés, elemi fogalmi gondolkodás.","**Szociális:** szabálytartás, késleltetés, feladattudat."]}]},{"q":"Fogalmazza meg, mit értünk hospitalizmus alatt! Mely tényezők járulnak hozzá a kialakulásához?","alt":["Ismertesse a hospitalizáció fogalmát és sorolja fel a leggyakoribb tüneteit!"],"note":"A docx a tüneteket nem sorolja fel, ez a lista saját kidolgozás.","blocks":[{"t":"p","text":"**Fogalma:** affektív hiánybetegség. Tágabb értelemben a hosszabb intézeti tartózkodásra visszavezethető magatartászavar, gyermekeknél és felnőtteknél egyaránt."},{"t":"p","text":"**Kialakulásához hozzájárul:** az anya távolléte, az anyai érzelmek hiánya, az anyai gondoskodás zavara, a hosszú intézeti elhelyezés állandó, szeretetteljes gondozó nélkül."},{"t":"p","text":"**Leggyakoribb tünetei:**"},{"t":"ul","items":["apátia, érdektelenség","megkésett mozgás- és beszédfejlődés","ritmikus ringatózás, sztereotip mozgások","étvágytalanság, súlyvesztés, alvászavar","fokozott fogékonyság a betegségekre","kötődési zavar, felszínes kapcsolatok"]}],"short":[{"t":"p","text":"**Fogalma:** hosszú intézeti elhelyezés, érzelmi gondoskodás hiánya miatti fejlődési és magatartászavar."},{"t":"p","text":"**Kialakulásához hozzájárul:** az anya hiánya, az anyai gondoskodás zavara, az állandó gondozó hiánya."},{"t":"p","text":"**Tünetei:** apátia, fejlődési elmaradás, ringatózás, gyakori betegség."}]},{"q":"Ismertesse a csecsemőkori ambivalens és a dezorganizált kötődés fogalmát! Milyen esetekben alakulhatnak ki? Hogyan ismeri fel ezeket a kötődési típusokat?","alt":["Ismertesse az ambivalens kötődés fogalmát!"],"note":"","blocks":[{"t":"ul","items":["**Ambivalens:** kialakulása: következetlen anya, aki hol büntet, hol túlóv, vagy korai szeparáció; a szülő kiszámíthatatlansága szorongást kelt. Felismerése: a gyermek extrém módon követi az anyját, tapadósan kötődik, de miközben keresi a kapcsolatot, ellen is áll neki.","**Dezorganizált:** kialakulása: teljesen kaotikus, gyakran bántalmazó szülői bánásmód. Felismerése: széttöredezett érzelemvilág és viselkedés, alig játszik, a földre veti magát, hisztérikus rohamai vannak."]}],"short":[{"t":"ul","items":["**Ambivalens:** kiszámíthatatlan, hol büntető, hol túlóvó anyánál alakul ki; a gyermek tapad az anyjára, de ellen is áll neki.","**Dezorganizált:** kaotikus, bántalmazó bánásmódnál alakul ki; a gyermek viselkedése zavart, alig játszik, hisztérikus rohamai vannak."]}]},{"q":"Sorolja fel a gyermekek életkori szakaszait és röviden ismertesse őket!","alt":[],"note":"","blocks":[{"t":"ul","items":["**Csecsemőkor (0-1 év):** feltételes reflexek, a beszéd és a járás kezdete, szenzomotoros tevékenység.","**Kisgyermekkor (1-3 év):** beszéd, tanulás, a személytudat kialakulása.","**Óvodáskor (3-6 év):** az éntudat megszilárdulása, alkalmazkodás.","**Kisiskoláskor (6-10 év):** játék helyett tanulás, elemző látásmód, az akarat fejlődése.","**Serdülőkor (10-18 év):** átmeneti állapot, nemi érettség, feszültség.","**Ifjúkor (18-25 év):** beilleszkedés, érzelmi és társadalmi érettség."]}],"short":[{"t":"ul","items":["**Csecsemőkor (0-1):** járás, beszéd kezdete.","**Kisgyermekkor (1-3):** beszéd, éntudat.","**Óvodáskor (3-6):** játék, alkalmazkodás.","**Kisiskoláskor (6-10):** tanulás, akarat.","**Serdülőkor (10-18):** nemi érés, feszültség.","**Ifjúkor (18-25):** társadalmi beilleszkedés."]}]}]},{"name":"Didaktika","q":[{"q":"Melyek a jó pedagógus ismérvei? Soroljon fel legalább nyolcat!","alt":[],"note":"","blocks":[{"t":"p","text":"Kölcsönös tisztelet a tanár és a diák között; lelkes, motivált; elkötelezett; jó pedagógiai ismeretek; érett személyiség; folyamatosan fejleszti magát; szabad, spontán viselkedés; hiteles."}],"short":[{"t":"p","text":"Tiszteli a diákot; motivált; elkötelezett; szakmailag felkészült; érett személyiség; fejleszti magát; spontán; hiteles."}]},{"q":"Mi az interaktív tábla? Milyen lehetőségeket kínál? Milyen előnyei és hátrányai lehetnek?","alt":[],"note":"","blocks":[{"t":"p","text":"**Fogalma:** infokommunikációs eszköz, amely szoftverrel kapcsolja össze a táblát a számítógéppel, így a gép a tábláról vezérelhető."},{"t":"p","text":"**Lehetőségei:** érintéssel vezérelt tartalom, kép, hang és videó megjelenítése, közös feladatmegoldás, a táblakép mentése."},{"t":"p","text":"**Előnyei:** korszerű, hatékony, figyelemfelkeltő."},{"t":"p","text":"**Hátrányai:** korlátozott mobilitás, számos hibalehetőség, a tanár esetleges informatikai ismerethiánya."}],"short":[{"t":"p","text":"**Fogalma:** számítógéppel összekötött tábla, amelyről a gép vezérelhető."},{"t":"p","text":"**Lehetőségei:** érintéses vezérlés, kép, hang és videó, a táblakép mentése."},{"t":"p","text":"**Előnyei:** korszerű, figyelemfelkeltő. **Hátrányai:** helyhez kötött, meghibásodhat."}]},{"q":"Ismertesse a didaktika fogalmát!","alt":[],"note":"","blocks":[{"t":"p","text":"Az oktatás, tanítás tudománya, oktatáselmélet. Azokat a fogalmakat, elveket, szabályokat és törvényszerűségeket vizsgálja, amelyek az oktatási folyamatban objektívan megvannak és hatnak."}],"short":[{"t":"p","text":"Az oktatás, tanítás tudománya, az oktatási folyamat törvényszerűségeit vizsgálja."}]},{"q":"Sorolja fel, melyek lehetnek az oktatási módszer kiválasztásának szempontjai! Ismertessen legalább 3 szempontot!","alt":[],"note":"","blocks":[{"t":"ul","items":["az oktatás törvényszerűségei, alapelvei, követelményei","az oktatás célja és feladatai","a tantárgy, a téma tartalma, hagyományai, a feladat jellege","a tanulók tanulási feltételei","a külső, gazdasági-pénzügyi feltételek","a tanár felkészültsége, adottságai, módszertani kultúrája"]}],"short":[{"t":"ul","items":["az oktatás célja, feladata","a tananyag tartalma","a tanulók életkora, képességei"]}]},{"q":"Soroljon fel legalább 4-4 érvet és ellenérvet a számítógépek tanórai keretek közötti használatát illetően!","alt":[],"note":"","blocks":[{"t":"p","text":"**Érvek:** változatossá teszi az oktatást; rendhagyó formája motivál; komplex élményt nyújt; a gyerekek figyelme koncentrált."},{"t":"p","text":"**Ellenérvek:** a technika lefagyhat, megzavarhatja az órát; a pedagógus kompetenciája nem mindig megfelelő; kevesebb a finommotorika gyakorlása; túlstimulálja a diák agyát."}],"short":[{"t":"p","text":"**Érvek:** változatos; motivál; komplex élmény; fenntartja a figyelmet."},{"t":"p","text":"**Ellenérvek:** technikai hiba; kell hozzá tanári kompetencia; kevesebb finommotoros gyakorlás; túlstimulál."}]},{"q":"Soroljon fel legalább 4-4 érvet és ellenérvet az okostelefonok tanórai keretek közötti használatát illetően!","alt":[],"note":"","blocks":[{"t":"p","text":"**Érvek:** bármikor használható internet; támogatja az inkluzív oktatást; segíti az értékelést; támogatja az önálló munkát."},{"t":"p","text":"**Ellenérvek:** könnyen eltereli a figyelmet; műszaki megbízhatatlanság, sérülékenység; speciális jártasságot igényel; rövid üzemidő, nehéz töltés az iskolában."}],"short":[{"t":"p","text":"**Érvek:** azonnali internet; segíti az inklúziót; segíti az értékelést; önálló munka."},{"t":"p","text":"**Ellenérvek:** elvonja a figyelmet; sérülékeny; jártasság kell hozzá; lemerül."}]},{"q":"Sorolja fel a tanítási órák típusait! Melyek egy tanítási óra lehetséges állandó elemei? Milyen szokások kapcsolódnak egy tanítási órához?","alt":[],"note":"","blocks":[{"t":"p","text":"**Típusai:** új ismereteket feldolgozó, ismereteket alkalmazó, gyakorló, ismereteket megszilárdító, ellenőrző, vegyes típusú óra."},{"t":"p","text":"**Állandó elemek (új ismeret feldolgozásakor):**"},{"t":"ol","items":["figyelemfelkeltés, motiváció","az óra céljának ismertetése","az előzetes ismeretek felidézése","az új ismeretek bemutatása és elemzése","fogalomalkotás, szabály megfogalmazása","rendszerezés, rögzítés","alkalmazás, visszacsatolás","a teljesítmény ellenőrzése"]},{"t":"p","text":"**Szokások:** csengetés, felállás az óra elején és végén, házi feladat ellenőrzése, a jelentkezés módja, felállás feleléskor, a pedagógus megszólítása."}],"short":[{"t":"p","text":"**Típusai:** új ismeretet feldolgozó, alkalmazó, gyakorló, ellenőrző, vegyes."},{"t":"p","text":"**Állandó elemei:** motiváció, célkitűzés, felidézés, új anyag, rögzítés, ellenőrzés."},{"t":"p","text":"**Szokások:** felállás az óra elején, házi feladat ellenőrzése, jelentkezés."}]}]},{"name":"Szociálpszichológia","q":[{"q":"Mit értünk az attitűd fogalma alatt? Milyen nevelői attitűdöket ismer? Röviden jellemezze őket!","alt":[],"note":"A docx-ből hiányzik a meleg-engedékeny típus.","blocks":[{"t":"p","text":"**Attitűd:** beállítottság, irányultság, viselkedési készség."},{"t":"p","text":"**Ranschburg szerinti nevelői attitűdök:**"},{"t":"ul","items":["**Meleg-engedékeny:** elfogadó, önállóságot adó nevelés; a gyermek aktív, önálló, barátságos.","**Meleg-korlátozó:** túlféltés, kevés bizalom; önállótlan magatartáshoz vezet.","**Hideg-engedékeny:** magára hagyás, kevés szeretet; a gyermek agresszióval keres biztonságot, antiszociális útra léphet.","**Hideg-korlátozó:** elégedetlen szülő, büntetéstől való félelem; a gyermek bátortalan, neurotikussá válhat."]}],"short":[{"t":"p","text":"**Attitűd:** beállítottság, viselkedési készség."},{"t":"ul","items":["**Meleg-engedékeny:** önálló, barátságos gyermek.","**Meleg-korlátozó:** túlféltés, önállótlan gyermek.","**Hideg-engedékeny:** magára hagyás, agresszív gyermek.","**Hideg-korlátozó:** szigor, szorongó gyermek."]}]},{"q":"Sorolja fel, majd ismertesse röviden a csoportfejlődés szakaszait!","alt":[],"note":"","blocks":[{"t":"ol","items":["**Tájékozódás:** ismeretlen helyzet, egymás megismerése, kipróbálása, nyitottság.","**Strukturálódás:** értékek és normák ütközése, szerepharcok, konfliktuskezelés, kompromisszumkeresés.","**Munkafázis:** együttműködés, feladatorientáltság, együttes élmény, összetartó erő, eredmények.","**Felbomlás vagy újraszerveződés:** megjelennek a különbségek, a hagyományok és a szükségletek konfliktusa, megújulás vagy felbomlás."]}],"short":[{"t":"ol","items":["**Tájékozódás:** ismerkedés.","**Strukturálódás:** szerepharcok, normák.","**Munkafázis:** együttműködés.","**Felbomlás vagy újraszerveződés.**"]}]},{"q":"Határozza meg röviden az előítéletesség fogalmát és kialakulását! Sorolja fel típusait!","alt":[],"note":"","blocks":[{"t":"p","text":"**Fogalma:** egy társadalmi csoport és tagjai pozitív vagy negatív értékelése, amely nem tapasztalaton, hanem elfogultságon alapul, és általában hamis következtetéshez vezet."},{"t":"p","text":"**Kialakulása:** kognitív tényezők (kategóriák, sztereotípiák), társas befolyás (szocializáció, csoporttagság), autoriter személyiség."},{"t":"p","text":"**Típusai:**"},{"t":"ul","items":["tárgyuk szerint","fokozatuk szerint: szóbeli előítéletesség, elkerülés, hátrányos megkülönböztetés, fizikai erőszak, üldözés és kiirtás","nyíltság szerint: forró és hideg előítélet"]}],"short":[{"t":"p","text":"**Fogalma:** tapasztalat nélküli, elfogult ítélet egy csoportról."},{"t":"p","text":"**Kialakulása:** sztereotípiák, szocializáció, autoriter személyiség."},{"t":"p","text":"**Típusai:** tárgya szerint; fokozata szerint (szóbeli, elkerülés, megkülönböztetés, erőszak, üldözés); nyíltság szerint."}]},{"q":"Mit takar a szociometria fogalma?","alt":[],"note":"","blocks":[{"t":"p","text":"A társas kapcsolatok vizsgálatára szolgáló mérési módszer (Jacob L. Moreno). Célja a rokon- és ellenszenvi kapcsolatok feltérképezése."}],"short":[{"t":"p","text":"A csoporton belüli rokon- és ellenszenvi kapcsolatok mérése (Moreno)."}]},{"q":"Mutassa be, hogyan fűződik Mérei Ferenc neve a szociometriához!","alt":[],"note":"","blocks":[{"t":"p","text":"A módszert Magyarországon Mérei Ferenc adaptálta és fejlesztette tovább. Életcélja az volt, hogy a pedagógián keresztül változtasson az embereken. Kutatta a pedagógiai hatással elérhető változást, és sokat tett a pedagógusok képzéséért, továbbképzéséért."}],"short":[{"t":"p","text":"Magyarországon ő honosította meg és fejlesztette tovább a szociometriát, és sokat tett a pedagógusképzésért."}]},{"q":"Definiálja a szociálpszichológia fogalmát! Mivel foglalkozik, mit vizsgál?","alt":[],"note":"","blocks":[{"t":"p","text":"A pszichológia egyik ága, amely azt vizsgálja, hogyan befolyásolja az egyén viselkedését mások valódi, elképzelt vagy mögöttes jelenléte. Az egyén és a társas környezet kölcsönhatásával foglalkozik: hogyan észlelik az emberek a társas világot, hogyan gondolkodnak róla, és hogyan hatnak egymásra."}],"short":[{"t":"p","text":"A pszichológia ága, amely azt vizsgálja, hogyan hat az egyénre mások jelenléte, és hogyan befolyásolják egymást az emberek."}]},{"q":"Ismertessen egy híres szociálpszichológiai kísérletet! Hogyan zajlott le a kísérlet? Milyen következtetések vonhatók le a kísérletből?","alt":[],"note":"A docx csak megnevezi a Milgram- és a stanfordi börtönkísérletet, a lefolyást és a következtetést nem írja le.","blocks":[{"t":"p","text":"**Milgram-kísérlet (Yale Egyetem, 1960-as évek):** azt vizsgálta, meddig engedelmeskedünk egy tekintélynek, ha másnak szenvedést kell okoznunk."},{"t":"p","text":"**Menete:** a résztvevő „tanárként” egyre erősebb áramütést adott a hibázó „tanulónak” a kísérletvezető utasítására. Az áramütés nem volt valódi, a tanuló beépített ember volt."},{"t":"p","text":"**Eredménye:** az első kísérletben a résztvevők kb. 65%-a elment a legmagasabb, 450 voltos fokozatig."},{"t":"p","text":"**Következtetés:** a helyzet és a tekintély nyomása hétköznapi embereket is rávehet arra, hogy másnak ártsanak."}],"short":[{"t":"p","text":"**Milgram-kísérlet:** a résztvevők utasításra egyre erősebb, valójában ál-áramütést adtak egy „tanulónak”. Kb. 65%-uk elment a legerősebb fokozatig."},{"t":"p","text":"**Következtetés:** a tekintély nyomására hétköznapi emberek is ártanak másoknak."}]},{"q":"Ismertesse a szerepkonfliktusok fajtáit és okait!","alt":[],"note":"","blocks":[{"t":"p","text":"Oka, hogy a személynek egyszerre több szerepnek kell megfelelnie, és ez nehézségekbe ütközik."},{"t":"ul","items":["**Személy-szerep konfliktus:** a szerep jellegénél fogva nem illik az egyén személyiségéhez.","**Szerepek közötti konfliktus:** az egyén nem tud egyszerre eleget tenni a sokféle szerepnek.","**Szerepen belüli konfliktus:** ugyanazzal a szereppel kapcsolatban ellentétesek az elvárások."]}],"short":[{"t":"p","text":"Oka: egyszerre több szerepnek kell megfelelni."},{"t":"ul","items":["**Személy-szerep:** a szerep nem illik a személyiséghez.","**Szerepek közötti:** több szerep egyszerre nem teljesíthető.","**Szerepen belüli:** ellentétes elvárások egy szerepen belül."]}]},{"q":"Mivel foglalkozik a társadalmi kapcsolatháló-elemzés tudománya? (Milyen kutatási előzményei vannak, melyek az alapfogalmai, és milyen módon végezhető az elemzési eljárás? Mi a 6 lépés távolság elmélete?)","alt":[],"note":"A docx-ből hiányoznak az alapfogalmak, az eljárás és a 6 lépés elmélete, ezek saját kidolgozásban kerültek ide.","blocks":[{"t":"p","text":"**Tárgya:** az egyének viselkedését és a köztük lévő kapcsolatokat, interakciókat vizsgálja. Gyakori vizsgált kapcsolatok: kommunikáció, tanácsadás, befolyásolás, barátság, bizalom."},{"t":"p","text":"**Előzménye:** a szociometria. A kapcsolatháló-elemzés ennél bonyolultabb, időben változó, nagyobb közösségeket is vizsgál. Nem csak egyénekre és rokonszenvre terjed ki, hanem szervezetekre, társadalmi rendszerekre és rokoni, gazdasági, politikai kapcsolatokra is."},{"t":"p","text":"**Alapfogalmak:** csomópont (a szereplő), kapcsolat (él), hálózat, központi szereplő."},{"t":"p","text":"**Eljárása:** adatgyűjtés kérdőívvel, megfigyeléssel vagy dokumentumokból, a kapcsolatok rögzítése táblázatban, ábrázolása hálózatként, majd a szerkezet elemzése."},{"t":"p","text":"**6 lépés távolság:** bármely két embert átlagosan kb. hat ismeretségi lépés köt össze. Karinthy Frigyes vetette fel a Láncszemek című novellájában (1929), Stanley Milgram levélküldési kísérlete (1967) vizsgálta."}],"short":[{"t":"p","text":"Az emberek és szervezetek közötti kapcsolatok hálózatát vizsgálja."},{"t":"p","text":"**Előzménye:** a szociometria. **Alapfogalmai:** szereplő, kapcsolat, hálózat."},{"t":"p","text":"**Eljárása:** adatgyűjtés, a kapcsolatok ábrázolása hálózatként, elemzés."},{"t":"p","text":"**6 lépés távolság:** bárki kb. hat ismerősön keresztül eljut bárkihez (Karinthy Frigyes, Milgram)."}]}]},{"name":"Konfliktus","q":[{"q":"Soroljon fel az óvodában előforduló konfliktustípusokat! Említsen legalább 4 dolgot, amelyekre figyelmet kell szentelni az óvodás korúak körében a konfliktuskezelés során!","alt":[],"note":"","blocks":[{"t":"p","text":"**Típusai:** gyermek-gyermek, gyermek-felnőtt, felnőtt-felnőtt."},{"t":"p","text":"**Figyelni kell arra, hogy:**"},{"t":"ul","items":["a megoldás módja és a lehetséges következmények különös figyelmet kapjanak","a konfliktus fontos nevelési eszköz is","a konfliktusok többnyire a játékok birtoklása körül alakulnak ki","segít a testi közelség: érintsük meg a gyermekeket, ültessük magunk mellé"]}],"short":[{"t":"p","text":"**Típusai:** gyermek-gyermek, gyermek-felnőtt, felnőtt-felnőtt."},{"t":"p","text":"**Figyelni kell:** a megoldás módjára; a következményekre; a játékok birtoklása miatti vitákra; a testi közelségre (érintés, magunk mellé ültetés)."}]},{"q":"Soroljon fel legalább 8 szülő-tanár közötti konfliktusforrást!","alt":[],"note":"A docx csak az első 5-öt sorolja fel, a többi saját kiegészítés.","blocks":[{"t":"ul","items":["érdemjegy","a gyermek magatartásának eltérő megítélése","a szülő nem látja reálisan gyermeke képességeit","a pedagógus szülőkkel szembeni attitűdje","a pedagógus gyermekekkel szembeni attitűdje","eltérő nevelési elvek otthon és az iskolában","a fegyelmezés, büntetés módja","a házi feladat mennyisége","a tájékoztatás hiánya, késése"]}],"short":[{"t":"p","text":"Érdemjegy; a magatartás megítélése; a szülő elfogultsága; a pedagógus attitűdje a szülővel; a pedagógus attitűdje a gyermekkel; eltérő nevelési elvek; büntetés módja; házi feladat mennyisége."}]},{"q":"Mit értünk a konfliktus fogalma alatt? Soroljon fel legalább 6 családon belül előforduló konfliktusforrást!","alt":[],"note":"","blocks":[{"t":"p","text":"**Fogalma:** olyan helyzet vagy folyamat, amelyben tartós kapcsolatban álló személyek vagy csoportok között érdekellentét van, amely érzelmi, szándékbeli ellentétben, időnként ellenséges interakcióban is kifejeződik. Formái: rejtett (érzelmi, tudati szinten marad) és nyílt."},{"t":"p","text":"**Családon belüli források:**"},{"t":"ul","items":["a jövedelem nagysága és felhasználása","referenciacsoportok","vallási különbségek","szexuális ellentét","a gyermek okozta konfliktus","a baráti és a házastársi lojalitás ütközése","a szabadidő felhasználása","függőségek"]}],"short":[{"t":"p","text":"**Fogalma:** tartós kapcsolatban álló felek közötti érdekellentét, amely érzelmi vagy nyílt ellentétben is megjelenik."},{"t":"p","text":"**Források:** pénz; vallás; gyermeknevelés; szabadidő; barátok és házastárs ütköző igényei; függőség."}]},{"q":"Milyen konfliktuskezelési stratégiákat ismer, és milyen attitűd jellemzi ezeket?","alt":[],"note":"A docx a versengőhöz magas együttműködést ír, ez hiba: így nem különbözne a problémamegoldótól.","blocks":[{"t":"ul","items":["**Elkerülő:** alacsony önérvényesítés, alacsony együttműködés; nincs vagy alacsony a nyereség.","**Versengő:** magas önérvényesítés, alacsony együttműködés; magas saját nyereségre törekszik.","**Alkalmazkodó:** alacsony önérvényesítés, magas együttműködés; a másik nyer.","**Kompromisszumkereső:** közepes önérvényesítés és együttműködés; elfogadható közös nyereség.","**Problémamegoldó:** magas önérvényesítés, magas együttműködés; a közös nyereséget maximalizálja."]}],"short":[{"t":"ul","items":["**Elkerülő:** se önérvényesítés, se együttműködés.","**Versengő:** magas önérvényesítés, alacsony együttműködés.","**Alkalmazkodó:** alacsony önérvényesítés, magas együttműködés.","**Kompromisszumkereső:** mindkettő közepes.","**Problémamegoldó:** mindkettő magas, közös nyereség."]}]}]},{"name":"Család","q":[{"q":"Ismertesse az apaszerep változásait napjainkban!","alt":[],"note":"","blocks":[{"t":"p","text":"A családtagok közötti egyenlőség és az erős érzelmi kötelék kerül előtérbe. Az apák feladják a korábbi kemény, hierarchikus stílust és az agresszív fegyelmező szerepet, szakítanak a saját gyermekkori mintájukkal. Megjelenik az apás szülés, a barátságosabb, játékosabb viszony, a feladatok megosztása az anyával, a gondoskodó apa szerepe."}],"short":[{"t":"p","text":"Az apa a kemény, fegyelmező szerep helyett barátságos, játékos viszonyt alakít ki a gyermekkel, részt vesz a szülésen és a gondozásban, és megosztja a feladatokat az anyával."}]},{"q":"Mutassa be, milyen szereppel bír az apa a gyermek fejlődésében! Soroljon fel legalább 8 tényezőt!","alt":[],"note":"","blocks":[{"t":"ul","items":["megismerteti a társadalmi normákkal","a korai anya-gyermek függő viszonyt szeretettel, fegyelmezéssel átformálja","megnyitja a gyermek előtt a világ kapuit","szerepe instrumentális, míg az anyáé expresszív (érzelmi bázis)","hat a nemre jellemző viselkedésformák kialakulására fiúknál és lányoknál","fizikai, mozgásos játékokat játszik, örömtelivé teszi a kapcsolatot","kivezeti a gyermeket a családból, ösztönzi, táplálja ambícióit, és megköveteli a szociális normákat","felfokozott érzelmi állapotokat él át vele, sok érintést ad"]}],"short":[{"t":"p","text":"Normákat közvetít; oldja az anyától való függést; kitárja a világot; fegyelmez; nemi szerepmintát ad; mozgásos játékot játszik; ösztönzi az ambíciókat; érzelmi élményeket és érintést ad."}]},{"q":"Ismertesse a család fajtáit!","alt":["Milyen családtípusokat ismer? Mutassa be őket röviden!"],"note":"","blocks":[{"t":"ul","items":["**Kiscsalád:** férj, feleség és gyermek(ek); a gyermektelen házaspár is ide tartozik.","**Nagycsalád:** a kiscsalád és a rokonok; sokszínű segítséget nyújt.","**Egyszülős család:** az egyik szülő halál, válás vagy elköltözés miatt kivált, vagy egyedülálló vállal, fogad örökbe gyermeket.","**Vegyes család:** a szülők előző kapcsolatukból hoznak gyermeket, és van közös gyermekük is.","**Család nélküli család:** a gyermekek kirepültek, az egyik szülő kivált, a családtag egyedül él.","**Nemzedéken átugró család:** nagyszülők gondozzák az unokákat."]}],"short":[{"t":"ul","items":["**Kiscsalád:** szülők és gyermek.","**Nagycsalád:** rokonokkal együtt.","**Egyszülős:** egy szülő gyermekkel.","**Vegyes:** előző kapcsolatból hozott és közös gyermekek.","**Család nélküli:** egyedül élő családtag.","**Nemzedéken átugró:** nagyszülő neveli az unokát."]}]},{"q":"Ismertesse, hogy mit értünk egy család rendellenes működésén!","alt":[],"note":"","blocks":[{"t":"ul","items":["merev, célszerűtlen viselkedési mintákat közvetít a gyermeknek","lezárja határait a külső hatások elől, szűk a válaszkészlete a változásokra","kevés figyelmet fordít a családtagok egyéni érzékenységére, véleményére","mereven ragaszkodik a fejlődést gátló hiedelmekhez, szabályokhoz, eltorzítja a realitást","az érzelmi kötelékek hiányoznak vagy torzulnak, nem biztonságos érzelmi bázis","torz a kommunikáció, nincs társas támasz","a nevelési eljárások hiányoznak vagy szélsőségesek"]}],"short":[{"t":"p","text":"Merev, célszerűtlen mintákat közvetít; elzárkózik a külvilágtól; torzak az érzelmi kötelékek és a kommunikáció; nem nyújt biztonságot; nevelése hiányos vagy szélsőséges."}]},{"q":"Ismertesse a túlkötés fogalmát és az ennek következtében adódó problémákat!","alt":[],"note":"","blocks":[{"t":"p","text":"**Fogalma:** túlzott szülői ragaszkodás, féltés. A szülőt jó szándék vezérli, mégis sok mindentől megfosztja a gyermekét."},{"t":"p","text":"**Következményei:**"},{"t":"ul","items":["a gyermek nem fedezi fel önállóan a világot, nem tanul meg kudarcain keresztül megküzdeni","nehezen válik önálló, magabiztos személyiséggé","felnőttként is szorongó, szociálisan visszahúzódó lehet","akadályozott a munkahelyen és a párkapcsolatban","gyakran egy életen át nem tud szabadulni ettől a korláttól"]}],"short":[{"t":"p","text":"**Fogalma:** túlzott szülői ragaszkodás, féltés."},{"t":"p","text":"**Következményei:** önállótlanság; a kudarcok kezelésének hiánya; szorongás; felnőttkori munkahelyi és párkapcsolati nehézségek."}]},{"q":"Határozza meg a család és a háztartás fogalmát! Válaszában emelje ki a két fogalom közti különbséget, és soroljon fel legalább 4 háztartástípust!","alt":["Határozza meg, miben különbözik a család és a háztartás fogalma egymástól! Soroljon fel legalább 3-3 típust mindkettőhöz!"],"note":"","blocks":[{"t":"p","text":"**Család:** együtt élő kiscsoport, amelynek tagjait házassági vagy vérségi kapcsolat köti össze. Típusai: házaspár, házaspár gyermekkel, egy szülő gyermekkel."},{"t":"p","text":"**Háztartás:** együtt lakó, a megélhetési költségeket megosztó, együtt fogyasztó emberek csoportja, akik általában, de nem szükségképpen rokonok."},{"t":"p","text":"**A különbség:** a családot a rokoni kötelék, a háztartást a közös lakás és gazdálkodás határozza meg."},{"t":"p","text":"**Háztartástípusok:** nukleáris családi, kiterjesztett családi, több családmagból álló, családmag nélküli (a tagok nem tartoznak azonos családmaghoz), egyszemélyes."}],"short":[{"t":"p","text":"**Család:** házassági vagy vérségi kapcsolat köti össze a tagjait."},{"t":"p","text":"**Háztartás:** együtt lakó, közösen gazdálkodó emberek, nem feltétlenül rokonok."},{"t":"p","text":"**Különbség:** a családot a rokonság, a háztartást a közös lakás és gazdálkodás határozza meg."},{"t":"p","text":"**Háztartástípusok:** nukleáris családi, kiterjesztett családi, több családmagból álló, egyszemélyes."}]},{"q":"Mi a családlátogatás célja? Sorolja fel, hogy egy leendő elsős kisgyerek családjánál történő látogatás során milyen kérdésekre keresi a választ!","alt":[],"note":"","blocks":[{"t":"p","text":"**Célja:** személyes bemutatkozás, anamnézis felvétele, a családi környezet feltérképezése."},{"t":"p","text":"**Kérdések:**"},{"t":"ul","items":["a gyermek és a szülők adatai, családszerkezet, testvérek","lakáskörülmények: van-e saját szobája, íróasztala, ágya","egészségi állapot, allergia, gyógyszerérzékenység, milyen gyakran beteg","hány évig járt óvodába, hogyan szokott be, mit kedvelt","milyen a természete, tehetséges-e valamiben","járt-e logopédushoz, pszichológushoz, fejlesztőpedagógushoz, és miért"]}],"short":[{"t":"p","text":"**Célja:** bemutatkozás, a családi környezet megismerése."},{"t":"p","text":"**Kérdések:** családszerkezet, testvérek; lakáskörülmények, saját hely a tanuláshoz; egészség, allergia; óvodai beilleszkedés, érdeklődés; járt-e fejlesztésre, logopédushoz."}]},{"q":"Ismertesse a család funkcióit!","alt":[],"note":"","blocks":[{"t":"ul","items":["**Termelés:** anyagi javak előállítása, többnyire pénzkeresés.","**Fogyasztás:** egyéni (az étel) és családi (a televízió).","**Reprodukció:** az utódok nemzése, az egyik legősibb funkció.","**A felnőttek pszichés védelme:** az érzelmi kapcsolat véd a külvilág nyomásával szemben.","**A gyermek szocializációja:** az elsődleges szocializáció a családban történik."]}],"short":[{"t":"p","text":"Termelés (kereset); fogyasztás; reprodukció; a felnőttek érzelmi védelme; a gyermek szocializációja."}]},{"q":"Mutassa be, hogy milyen hibák adódhatnak egy szülői értekezleten! Soroljon fel legalább nyolcat!","alt":[],"note":"","blocks":[{"t":"ul","items":["nincs világos célja","érdemi kommunikáció helyett kényszerű időtöltés","túl nagy vagy túl kicsi a létszám","az események nem követhetők","nem sikerül tartani a kereteket","a vezető zavarban van, feszültsége feszélyezi a jelenlévőket","egy résztvevő dominálja a helyzetet","az intézmény képviselői eltérő álláspontot képviselnek","a pedagógus szerepe eltér a tervezettől","a pedagógus kommunikációja nem illeszkedik a jelenlévőkhöz"]}],"short":[{"t":"p","text":"Nincs világos cél; kényszeres időtöltés; rossz létszám; követhetetlenség; nincs keret; a vezető zavarban van; egy résztvevő dominál; a pedagógus nem érthetően kommunikál."}]},{"q":"Mutassa be, hogy szülői értekezlet megtartása során milyen problémák adódhatnak! Soroljon fel legalább 5 tényezőt, amellyel hatékonyabbá teheti a szülői értekezletet!","alt":[],"note":"","blocks":[{"t":"p","text":"**Problémák:** csak a jegyek ismertetése; nincs tervezés, ad hoc témák; csak a kirívó esetek megtárgyalása; egyéni problémák a többi szülő előtt; nincs kapcsolat a szülőkkel; nem megfelelő hangnem; az anyagi kérdések előtérbe kerülése; a kényszer érzete."},{"t":"p","text":"**Hatékonyabbá teszi:**"},{"t":"ul","items":["világos célkitűzés","a témák előzetes elküldése","követhetőség, feljegyzések a szülőknek","az időkeret betartása","közösségformálás","a problémák megbeszélése kisebb szülői csoportokban, majd közösen","a kollégák bevonása"]}],"short":[{"t":"p","text":"**Problémák:** csak a jegyekről szól; nincs tervezés; egyéni ügyek a többiek előtt; rossz hangnem."},{"t":"p","text":"**Hatékonyabbá teszi:** világos cél; a témák előzetes kiküldése; az időkeret betartása; kiscsoportos megbeszélés; feljegyzés a szülőknek."}]},{"q":"Ismertesse az iskolai fogadóórák jelentőségét!","alt":[],"note":"","blocks":[{"t":"p","text":"Kétszemélyes pedagógiai konzultáció, a szülők általában szaktanáronként tájékozódhatnak. A részvétel nem kötelező."},{"t":"ul","items":["**Célja:** személyes találkozás a pedagógussal.","**Időpontja:** havi vagy kéthavi rendszerességgel, meghatározott napon és időtartamban.","**Tartalma:** egyéni tájékoztatás a gyermekről.","**Menete:** magatartási, szorgalmi, tanulmányi problémák, a gyermek közösségben betöltött szerepe, egyeztetett egyéb témák."]}],"short":[{"t":"p","text":"Kétszemélyes, nem kötelező konzultáció a szülő és a pedagógus között, rendszerint havonta. A szülő egyéni tájékoztatást kap gyermeke tanulásáról, magatartásáról és közösségi helyzetéről."}]},{"q":"Milyen kapcsolattartási formákat ismer a szülő és az iskola között?","alt":[],"note":"","blocks":[{"t":"p","text":"Szülői értekezlet; fogadóóra; üzenetek; nyílt órák, nyílt napok; családlátogatás; közös szabadidős tevékenységek; rendkívüli megbeszélés a szülővel; szülői közösség."},{"t":"p","text":"A hagyományos formák többnyire egyirányúak, a fejlesztés célja a kétirányú kommunikáció."}],"short":[{"t":"p","text":"Szülői értekezlet; fogadóóra; üzenetek; nyílt nap; családlátogatás; közös programok."}]}]},{"name":"Bűnözés","q":[{"q":"Mi a büntetőjogi felelősség alsó határa (hány éves kortól büntethető egy fiatalkorú)? Melyek a fiatalkorúakkal szemben alkalmazott büntetés alapvető céljai?","alt":[],"note":"A docx a régi, 1978-as Btk. 37. §-ára hivatkozik. A hatályos törvényben a 79. és a 106. § a helyes.","blocks":[{"t":"p","text":"**Alsó határ (Btk. 16. §):** a 14. életév, bizonyos súlyos bűncselekményeknél kivételesen a 12. életév, ha az elkövető rendelkezett a következmények felismeréséhez szükséges belátással. Fiatalkorú az, aki az elkövetéskor 12. életévét betöltötte, de a 18.-at nem (Btk. 105. §)."},{"t":"p","text":"**A büntetés általános célja (Btk. 79. §):** a társadalom védelme érdekében annak megelőzése, hogy az elkövető vagy más bűncselekményt kövessen el."},{"t":"p","text":"**Fiatalkorúnál (Btk. 106. §):** elsősorban az, hogy a fiatalkorú helyes irányba fejlődjön, és a társadalom hasznos tagjává váljon, ezért a nevelését és védelmét kell szem előtt tartani."}],"short":[{"t":"p","text":"**Alsó határ:** 14 év; súlyos bűncselekményeknél 12 év, ha megvolt a belátási képessége."},{"t":"p","text":"**Célja:** hogy a fiatalkorú helyes irányba fejlődjön és a társadalom hasznos tagjává váljon; nevelése és védelme áll előtérben."}]},{"q":"A hatályos jogszabályok alapján mi a büntethetőség alsó életkori határa? Miért volt szükség a korhatár csökkentésére? Soroljon fel legalább 4 olyan bűncselekményt, amely miatt a legalacsonyabb életkorú személy büntethető!","alt":[],"note":"A docx hibásan a 10. életévet írja, a törvény szerint a 12. a helyes. A lista a hatályos szöveg alapján a hivatalos személy elleni erőszakkal is bővült.","blocks":[{"t":"p","text":"**Alsó határ:** a 12. életév, ha az elkövető rendelkezett a következmények felismeréséhez szükséges belátással (Btk. 16. §). Ezt a hatóságnak kell bizonyítania."},{"t":"p","text":"**A csökkentés oka (14-ről 12 évre):** a jogalkotói indoklás szerint a 12-14 évesek körében terjedt az érdekek erőszakos érvényesítése, és a legagresszívabb cselekményeknél a megelőzéshez és a társadalomba való beillesztéshez szükség van a büntetőjog eszközeire."},{"t":"p","text":"**Bűncselekmények:**"},{"t":"ul","items":["emberölés","erős felindulásban elkövetett emberölés","életveszélyt vagy halált okozó testi sértés","hivatalos személy, közfeladatot ellátó személy, illetve támogatójuk elleni erőszak","terrorcselekmény","rablás","kifosztás (minősített esetek)"]}],"short":[{"t":"p","text":"**Alsó határ:** a 12. életév, ha a gyermek felismerhette tette következményeit."},{"t":"p","text":"**Oka:** terjedt a 12-14 évesek erőszakos bűnelkövetése."},{"t":"p","text":"**Bűncselekmények:** emberölés; életveszélyt okozó testi sértés; rablás; terrorcselekmény."}]}]}]</script>
<script id="data" type="application/json">[{"n": 1, "sections": [{"h": "A pedagógia fogalma", "blocks": [{"t": "p", "text": "A pedagógia a neveléssel foglalkozó tudomány, más néven neveléstudomány. A szó a görög „paidagógosz” kifejezésből ered, ami eredetileg azt a rabszolgát jelentette, aki a gyermeket az iskolába kísérte – szó szerint „gyermekvezetőt”. Ma a pedagógia a nevelés elméletével és gyakorlatával, a nevelés céljaival, tartalmával, módszereivel, eszközeivel és szervezeti formáival foglalkozó társadalomtudomány."}, {"t": "p", "text": "A pedagógia egyszerre elméleti és gyakorlati tudomány: elméleti, mert feltárja a nevelés törvényszerűségeit, és gyakorlati, mert az eredményeket a mindennapi nevelőmunkában hasznosítja."}]}, {"h": "A pedagógia tárgya és célja", "blocks": [{"t": "p", "text": "A pedagógia tárgya maga a nevelés: annak folyamata, céljai, feltételei, tényezői és eredményei. Vizsgálja a nevelő és a nevelt viszonyát, a nevelés színtereit (család, óvoda, iskola, kortárscsoport), valamint azokat a hatásokat, amelyek a személyiség fejlődését befolyásolják."}, {"t": "p", "text": "A pedagógia célja, hogy feltárja a nevelés törvényszerűségeit, és ezek alapján olyan elveket, módszereket és eljárásokat dolgozzon ki, amelyek segítségével a gyermek személyisége harmonikusan, a képességeinek megfelelően fejlődhet. Végső célja az önálló, felelős, a társadalomba beilleszkedni képes ember nevelésének segítése."}]}, {"h": "A pedagógia feladata", "blocks": [{"t": "ul", "items": ["**Leíró feladat:** a nevelési jelenségek megfigyelése, rögzítése, rendszerezése.", "**Magyarázó feladat:** az ok-okozati összefüggések feltárása – miért és hogyan hatnak a nevelési tényezők.", "**Előrejelző (prognosztikus) feladat:** annak megbecsülése, hogy egy nevelési hatás milyen eredményre vezet.", "**Normatív, gyakorlatirányító feladat:** elvek, szabályok, módszerek kidolgozása a nevelők számára.", "**Értékelő feladat:** a nevelési folyamat és eredményeinek elemzése, visszacsatolás."]}]}, {"h": "A pedagógia területei", "blocks": [{"t": "ul", "items": ["**Neveléselmélet:** a nevelés céljaival, elveivel, módszereivel foglalkozik.", "**Didaktika (oktatáselmélet):** az oktatás, a tanítás-tanulás folyamatának tudománya.", "**Neveléstörténet:** a nevelési eszmék és intézmények történeti fejlődése.", "**Nevelésfilozófia:** a nevelés értékeinek, emberképének kérdései.", "**Összehasonlító pedagógia:** különböző országok oktatási rendszereinek összevetése.", "**Gyógypedagógia:** a fogyatékos, sajátos nevelési igényű gyermekek nevelése.", "**Szociálpedagógia:** a hátrányos helyzetű, veszélyeztetett gyermekek segítése.", "**Családpedagógia:** a családi nevelés kérdései.", "**Szabadidő-pedagógia:** a szabadidő tartalmas, nevelő célú eltöltése.", "**Óvodapedagógia, kisgyermeknevelés, iskolapedagógia:** az egyes intézménytípusok nevelési kérdései.", "**Andragógia:** a felnőttek nevelése, képzése.", "**Határterületek:** pedagógiai pszichológia, nevelésszociológia, oktatásgazdaságtan, egészségpedagógia."]}]}, {"h": "A nevelés fogalma", "blocks": [{"t": "p", "text": "A nevelés tudatos, tervszerű és céltudatos tevékenység, amelynek során a nevelő a gyermek személyiségét a társadalom által elfogadott értékek, normák és célok szerint formálja, úgy, hogy közben a gyermek egyéni adottságait és képességeit kibontakoztatja."}, {"t": "p", "text": "Tágabb értelemben nevelésnek tekinthető minden olyan hatás, amely a személyiség fejlődését befolyásolja (a spontán hatások is). Szűkebb értelemben csak a szándékos, célzott ráhatást nevezzük nevelésnek. A nevelés kétpólusú folyamat: a nevelő és a nevelt kölcsönhatásában valósul meg, ezért a gyermek nem passzív befogadó, hanem aktív résztvevő. A nevelés végső célja az önnevelésre képes személyiség kialakítása."}]}, {"h": "A nevelési módszer fogalma", "blocks": [{"t": "p", "text": "A nevelési módszer a nevelő és a gyermek közös tevékenységének olyan eljárása, eszköze, amelynek segítségével a nevelési célok megvalósulnak. A módsze
